spring:
  datasource:
    url: jdbc:h2:mem:jlas_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 2525

jlas:
  auth:
    jwt-secret: test-only-jwt-secret-with-at-least-thirty-two-characters
    access-token-ttl: 900
    refresh-token-ttl: 604800
    verification-token-ttl: 900

app:
  google:
    client-id: ""

upload:
  path:
    avatar: ${java.io.tmpdir}/jlas-test/avatar
    flashcard: ${java.io.tmpdir}/jlas-test/flashcard
