# Cấu hình riêng cho test AI Tutor (H2 trong bộ nhớ, mọi khoá đều là giá trị giả).
spring:
  datasource:
    url: jdbc:h2:mem:admin-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  mail:
    host: localhost
    port: 1
    username: dummy
    password: dummy
jlas:
  auth:
    jwt-secret: test-only-dummy-secret-at-least-thirty-two-characters
    access-token-ttl: 900
    refresh-token-ttl: 604800
app:
  google:
    client-id: dummy
  mail:
    from: dummy@example.test
openrouter:
  api:
    key: dummy
    url: http://127.0.0.1:1
  site:
    url: http://127.0.0.1:1
    name: JLAS-test
deepgram:
  api:
    key: dummy
azure:
  speech:
    pronunciation:
      key: dummy
      region: dummy
upload:
  path:
    video: target/test-uploads/video
    audio: target/test-uploads/audio
    thumbnail: target/test-uploads/thumbnail
    avatar: target/test-uploads/avatar
    flashcard: target/test-uploads/flashcard
pronunciation:
  storage:
    local:
      root: target/test-storage
