# Isolated test configuration. application.yaml always includes the `local` profile (MySQL with
# git-ignored secrets); tests cancel that include via @SpringBootTest(properties) and run on
# in-memory H2 so plain `mvn test` works on any machine without touching a real database.
spring:
  datasource:
    url: jdbc:h2:mem:jlas-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
