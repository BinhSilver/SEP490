<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lộ trình cá nhân hóa · JLAS</title>
  <link rel="icon" href="/images/jlab.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/theme-bridge.css">
  <link rel="stylesheet" href="/css/pages/personalized-path.css">
  <link rel="stylesheet" href="/css/jlab-base-shell.css">
  <script defer src="/js/pages/personalized-path-data.js"></script>
  <script defer src="/js/pages/personalized-path.js"></script>
  <script defer src="/js/jlab-base-shell.js"></script>
</head>
<body id="jlabBasePage">
  <div id="jlabBaseShellMount"></div>
  <main id="jlabBaseContent">
    <div class="pp-page">
      <aside class="pp-demo" aria-label="Chế độ xem trước">
        <div><strong>Bản xem trước giao diện</strong><span>Dữ liệu minh họa, chưa nối Smart Test hoặc lưu tiến độ.</span></div>
        <label>Xem trạng thái <select id="pp-demo-scenario">
          <option value="active">Đang học</option><option value="empty">Chưa có lộ trình</option>
          <option value="loading">Đang tải</option><option value="error">Lỗi kết nối</option>
          <option value="complete">Đã hoàn thành</option><option value="coverage">Thiếu học liệu</option>
          <option value="no-warm-up">Không cần khởi động</option>
        </select></label>
      </aside>
      <div id="pp-root" aria-busy="true"><p>Đang tải giao diện lộ trình…</p></div>
      <noscript>Vui lòng bật JavaScript để xem lộ trình cá nhân hóa.</noscript>
      <dialog id="pp-lesson-dialog" class="pp-dialog" aria-labelledby="pp-dialog-title">
        <button class="pp-dialog-close" data-close-dialog aria-label="Đóng thông tin bài học">×</button>
        <div data-dialog-body></div>
      </dialog>
      <footer class="pp-footer">JLAS <span>Học vững từng bước, tiến gần mục tiêu.</span></footer>
    </div>
  </main>
</body>
</html>
