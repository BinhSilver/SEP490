<!DOCTYPE html>
<html lang="vi">
<head>
    <script src="/js/theme-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kháng nghị chế tài | KotsuKotsu</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/theme-bridge.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components/buttons.css">
  <link rel="stylesheet" href="/css/pages/appeal.css?v=20261008">
  <link rel="stylesheet" href="/css/jlab-base-shell.css">
  <link rel="icon" href="/images/jlab.png" type="image/png">
</head>
<body id="jlabBasePage" class="page-appeal">
<div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent">
  <div class="apl-page">
    <header class="apl-header">
      <h1 class="apl-title">Kháng nghị chế tài</h1>
    </header>

    <section class="apl-card" aria-labelledby="aplSanctionTitle">
      <h2 class="apl-card__title" id="aplSanctionTitle">Chế tài đang áp dụng</h2>
      <div id="aplSanctions" aria-live="polite"><p class="apl-muted">Đang tải…</p></div>
    </section>

    <section class="apl-card" id="aplFormCard" aria-labelledby="aplFormTitle" hidden>
      <h2 class="apl-card__title" id="aplFormTitle">Gửi đơn kháng nghị</h2>
      <p class="apl-note" id="aplPendingNote" hidden></p>
      <form id="aplForm" class="apl-form" novalidate>
        <div class="apl-field">
          <label for="aplSanction">Chế tài muốn kháng nghị</label>
          <select id="aplSanction" class="apl-input"></select>
        </div>
        <div class="apl-field">
          <label for="aplReason">Lý do <span aria-hidden="true">*</span></label>
          <textarea id="aplReason" class="apl-input" rows="5" maxlength="1000"
                    placeholder="Trình bày vì sao bạn cho rằng chế tài chưa đúng" aria-describedby="aplReasonHint aplReasonError"></textarea>
          <div class="apl-field__foot">
            <span id="aplReasonHint" class="apl-muted">Tối thiểu 20 ký tự</span>
            <span id="aplReasonCount" class="apl-muted">0/1000</span>
          </div>
          <p class="apl-error" id="aplReasonError" aria-live="polite"></p>
        </div>
        <div class="apl-field">
          <label for="aplEvidence">Liên kết bằng chứng (không bắt buộc)</label>
          <input id="aplEvidence" class="apl-input" type="url" maxlength="500"
                 placeholder="https://…" aria-describedby="aplEvidenceError">
          <p class="apl-error" id="aplEvidenceError" aria-live="polite"></p>
        </div>
        <div class="apl-field">
          <label for="aplFile">File bằng chứng (không bắt buộc)</label>
          <input id="aplFile" class="apl-input" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf"
                 aria-describedby="aplFileHint aplFileError">
          <span id="aplFileHint" class="apl-muted">Một ảnh JPG, PNG, WEBP hoặc PDF, tối đa 5 MB. Chỉ bạn và kiểm duyệt viên xem được.</span>
          <p class="apl-error" id="aplFileError" aria-live="polite"></p>
        </div>
        <p class="apl-error" id="aplSubmitError" aria-live="polite"></p>
        <button type="submit" class="btn btn--primary" id="aplSubmit" disabled>
          <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Gửi đơn
        </button>
      </form>
    </section>

    <section class="apl-card" aria-labelledby="aplHistoryTitle">
      <h2 class="apl-card__title" id="aplHistoryTitle">Đơn của tôi</h2>
      <p class="apl-error" id="aplHistoryError" aria-live="polite"></p>
      <div id="aplHistory" aria-live="polite"><p class="apl-muted">Đang tải…</p></div>
    </section>
  </div>
</main>

<script src="/js/auth-session.js"></script>
<script src="/js/jlab-base-shell.js"></script>
<script src="/flashcard/js/api-client.js"></script>
<script src="/js/pages/appeal.js?v=20261109-kotsu"></script>
</body>
</html>
