<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kháng nghị chế tài — JLAS</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/jlab-base-shell.css">
  <link rel="stylesheet" href="/css/pages/moderation.css">
</head>
<body id="jlabBasePage" class="page-moderation">
  <div id="jlabBaseShellMount"></div>
  <main id="jlabBaseContent" class="admin-wrap">
    <h1>Kháng nghị chế tài</h1>
    <p class="muted">Bạn chỉ có thể gửi một đơn OPEN cho chế tài đang còn hiệu lực.</p>
    <form id="appeal-form" class="admin-item" hidden>
      <label for="sanction">Chế tài</label>
      <select id="sanction" required></select>
      <label for="reason">Lý do</label>
      <textarea id="reason" required maxlength="1000" rows="5"></textarea>
      <label for="evidence">Liên kết bằng chứng (nếu có)</label>
      <input id="evidence" type="url" maxlength="500">
      <button class="btn btn-primary" type="submit">Gửi đơn</button>
    </form>
    <p id="no-sanction" hidden>Hiện không có chế tài đang hiệu lực để kháng nghị.</p>
    <p id="message" role="status"></p>
    <h2>Đơn của tôi</h2>
    <div id="history"></div>
  </main>
  <script src="/js/auth-session.js"></script>
  <script src="/js/jlab-base-shell.js"></script>
  <script src="/flashcard/js/api-client.js"></script>
  <script>
    (async function () {
      var form = document.getElementById('appeal-form');
      var select = document.getElementById('sanction');
      var message = document.getElementById('message');
      if (!JlasAuth.requireLogin()) return;
      await load();
      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        message.textContent = '';
        try {
          await FlashApi.post('/api/appeals', {
            sanctionId: Number(select.value),
            reason: document.getElementById('reason').value,
            evidenceUrl: document.getElementById('evidence').value || null
          });
          message.textContent = 'Đã gửi đơn kháng nghị.';
          form.reset();
          await load();
        } catch (error) {
          message.textContent = error.message || 'Không thể gửi đơn.';
        }
      });
      async function load() {
        var sanctions = await FlashApi.get('/api/appeals/sanctions');
        var appeals = await FlashApi.get('/api/appeals/me');
        form.hidden = !sanctions.length;
        document.getElementById('no-sanction').hidden = !!sanctions.length;
        select.innerHTML = sanctions.map(function (item) {
          return '<option value="' + item.id + '">' + item.type + ' #' + item.id +
            (item.endsAt ? ' — đến ' + item.endsAt : ' — vô thời hạn') + '</option>';
        }).join('');
        document.getElementById('history').innerHTML = appeals.length ? appeals.map(function (item) {
          return '<article class="admin-item"><h3>Đơn #' + item.id + ' — ' + item.status + '</h3>' +
            '<p>' + escapeHtml(item.reason) + '</p>' +
            (item.resolutionNote ? '<p><strong>Phản hồi:</strong> ' + escapeHtml(item.resolutionNote) + '</p>' : '') +
            '</article>';
        }).join('') : '<p>Chưa có đơn kháng nghị.</p>';
      }
      function escapeHtml(value) {
        return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
    })();
  </script>
</body>
</html>
