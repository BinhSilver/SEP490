<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle, pageCss)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle}">KotsuKotsu Admin</title>
    <script>/* Use the same saved theme as the shared learner/creator navbar. */
      (function () { try { var t = localStorage.getItem('jlas-theme'); if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t); document.documentElement.classList.remove('light', 'dark'); document.documentElement.classList.add(t); } catch (e) {} })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/tokens.css(v=20261119-compact)}"/>
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}"/>
    <link rel="stylesheet" th:href="@{/css/base.css(v=20261119-compact)}"/>
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}"/>
    <link rel="stylesheet" th:href="@{/css/components/inputs.css(v=20261119-compact)}"/>
    <link rel="stylesheet" th:href="@{/css/components/forms.css}"/>
    <link rel="stylesheet" th:href="@{/css/components/toast.css}"/>
    <link rel="stylesheet" th:href="@{/css/components/theme-switch.css}"/>
    <link rel="stylesheet" th:href="@{'/css/pages/' + ${pageCss} + '.css' + ${(pageCss == 'admin') ? '?v=20261118-coupon-grid' : ((pageCss == 'textbooks' or pageCss == 'jpath-admin') ? '?v=20261118-flat-admin' : ((pageCss == 'jlpt-admin' or pageCss == 'kanji-map-admin' or pageCss == 'verb-practice-admin') ? '?v=20261119-deploy-merge' : ''))}}"/>
    <link rel="stylesheet" th:href="@{/css/admin-shell.css(v=20261118-flat-admin)}"/>
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png"/>
    <script th:src="@{/js/auth-session.js(v=20261013portal)}"></script>
    <script th:src="@{/js/components.js}"></script>
    <link rel="stylesheet" href="/css/components/cp-unit.css?v=20261123-gold"/>
    <script defer src="/js/components/cp-unit.js?v=20261123-gold"></script>
    <script defer th:src="@{/js/theme.js(v=20261119-compact)}"></script>
    <!-- Shared dropdown for <select data-jl-select> (css/components/select.css, js/components/select.js) -->
    <link rel="stylesheet" th:href="@{/css/components/select.css(v=20261111-select2)}" />
    <script defer th:src="@{/js/components/select.js(v=20261111-select2)}"></script>

    <!-- UI contract for the owned feature pages; other modules keep their existing styles. -->
    <th:block th:if="${pageCss == 'jlpt-admin' or pageCss == 'jlpt-practice-admin' or pageCss == 'verb-practice-admin' or pageCss == 'kanji-map-admin'}">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&amp;display=swap" />
        <link rel="stylesheet" th:href="@{/css/controls.css(v=20261119-compact)}" />
        <link rel="stylesheet" th:href="@{/css/components/ui-chuan.css(v=20261119-compact)}" />
        <script defer th:src="@{/js/components/owned-ui.js(v=20261119-compact)}"></script>
    </th:block>
</head>
</html>
