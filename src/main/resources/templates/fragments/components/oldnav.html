<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="platform-links(active)">
    <a th:href="@{/}" th:classappend="${active == 'home'} ? ' is-active'" title="Trang chủ JLAS">
        <i class="fa-solid fa-house" aria-hidden="true"></i>
        <span>Trang chủ</span>
    </a>
    <a th:href="@{/ai-call}" th:classappend="${active == 'aicall'} ? ' is-active'" title="Luyện hội thoại AI">
        <i class="fa-solid fa-comments" aria-hidden="true"></i>
        <span>AI Call</span>
    </a>
    <a th:href="@{/learning/path}" th:classappend="${active == 'onyomi'} ? ' is-active'" title="Lộ trình Hán Việt  On">
        <i class="fa-solid fa-route" aria-hidden="true"></i>
        <span>Onyomi</span>
    </a>
    <button type="button" class="platform-nav-disabled" aria-disabled="true" title="Tính năng tra cứu đã tắt">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <span>Tra cứu</span>
    </button>
    <a th:href="@{/games}" th:classappend="${active == 'game'} ? ' is-active'" title="Chơi game luyện tiếng Nhật">
        <i class="fa-solid fa-gamepad" aria-hidden="true"></i>
        <span>Game</span>
    </a>
    <a th:href="@{/flashcard/library.html}" th:classappend="${active == 'flashcard'} ? ' is-active'"
        title="Nhập từ & flashcard">
        <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
        <span>Flashcard</span>
    </a>
    <a th:href="@{/shadowing}" th:classappend="${active == 'shadowing'} ? ' is-active'" title="Luyện nghe – shadowing">
        <i class="fa-solid fa-headphones" aria-hidden="true"></i>
        <span>Shadowing</span>
    </a>
    <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? ' is-active'" title="Hồ sơ và cài đặt">
        <i class="fa-solid fa-user" aria-hidden="true"></i>
        <span>Hồ sơ và cài đặt</span>
    </a>
</th:block>

<nav th:fragment="platform-bar(active)" class="jlas-platform-nav" aria-label="JLAS features"
    style="display:none !important;"></nav>

</html>
