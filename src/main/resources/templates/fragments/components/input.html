<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Text / email / password field -->
<div th:fragment="field(id, name, label, type, placeholder, required, icon, caps)"
     class="field">
    <label th:for="${id}"
           class="field__label"
           th:classappend="${caps} ? ' field__label--caps' : ''"
           th:text="${label}">Label</label>
    <div class="input-wrap">
        <span th:if="${icon != null}" class="input-wrap__icon">
            <span class="material-symbols-outlined" th:text="${icon}">mail</span>
        </span>
        <input th:id="${id}"
               th:name="${name != null ? name : id}"
               th:type="${type != null ? type : 'text'}"
               th:placeholder="${placeholder}"
               th:required="${required}"
               class="input"
               th:classappend="${icon != null} ? ' input--with-icon' : ''"
               th:autocomplete="${type == 'password' ? 'current-password' : (type == 'email' ? 'email' : 'on')}"/>
    </div>
</div>

<!-- Password field with toggle -->
<div th:fragment="password(id, name, label, placeholder, required)"
     class="field">
    <label th:for="${id}" class="field__label" th:text="${label}">Password</label>
    <div class="input-wrap">
        <span class="input-wrap__icon">
            <span class="material-symbols-outlined">lock</span>
        </span>
        <input th:id="${id}"
               th:name="${name != null ? name : id}"
               type="password"
               class="input input--with-icon input--with-action"
               th:placeholder="${placeholder}"
               th:required="${required}"
               autocomplete="current-password"/>
        <button type="button" class="input-wrap__action"
                th:attr="data-toggle-password=${id}"
                aria-label="Toggle password">
            <span class="material-symbols-outlined">visibility</span>
        </button>
    </div>
</div>

</html>
