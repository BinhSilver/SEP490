<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="standard(pageTitle, pageCss)">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"
          th:content="${pageCss == 'login' ? 'width=device-width, initial-scale=1.0, viewport-fit=cover' : 'width=device-width, initial-scale=1.0'}" />
    <title th:text="${pageTitle}">KotsuKotsu</title>

    <script>/* Apply saved light/dark theme before paint to avoid a flash (key matches jlab-base-shell.js). */
      (function () { try { var t = localStorage.getItem('jlas-theme'); if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t); document.documentElement.classList.remove('light', 'dark'); document.documentElement.classList.add(t); } catch (e) {} })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://jlassep490media.blob.core.windows.net" />
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&amp;family=Instrument+Serif:ital@0;1&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;family=Noto+Serif:wght@400;500;600;700&amp;family=Noto+Serif+JP:wght@400;500;600;700&amp;family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&amp;display=swap" />

    <!-- Shared design system (index = source of truth) -->
    <link rel="stylesheet" th:href="@{/css/tokens.css(v=20261128-vi-font2)}" />
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css(v=20261125-largescreen)}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/sakura-background.css}" />

    <!-- Shared components -->
    <link rel="stylesheet" th:href="@{/css/components/buttons.css(v=20261125-largescreen)}" />
    <link rel="stylesheet" th:href="@{/css/components/cards.css(v=20261125-largescreen)}" />
    <link rel="stylesheet" th:href="@{/css/components/inputs.css(v=20261125-largescreen)}" />
    <link rel="stylesheet" th:href="@{/css/components/forms.css(v=20261125-largescreen)}" />
    <link rel="stylesheet" th:href="@{/css/components/dropdowns.css(v=20261125-largescreen)}" />
    <link rel="stylesheet" th:href="@{/css/components/toast.css?v=20261125-largescreen}" />
    <link rel="stylesheet" th:href="@{/css/components/header.css(v=20261125-largescreen)}" />
    <link rel="stylesheet" th:href="@{/css/components/brand.css(v=20261125-largescreen)}" />
    <link rel="stylesheet" th:href="@{/css/components/platform-nav.css(v=20261125-largescreen)}" />
    <link rel="stylesheet" th:href="@{/css/components/footer.css(v=20261125-largescreen)}" />
    <link rel="stylesheet" th:href="@{/css/components/user-menu.css?v=20261125-largescreen}" />
    <link rel="stylesheet" th:href="@{/css/components/kitsu-guide.css(v=20261125-phase1)}" />
    <link rel="stylesheet" th:href="@{/css/components/inline-dictionary.css(v=20261125-largescreen)}" />
    <link rel="stylesheet" th:href="@{/css/components/retention-live.css?v=20261125-phase1}" />
    <link rel="stylesheet" th:href="@{/css/components/avatar-frame.css?v=20261021-catalog}" />

    <!-- Page-specific CSS (optional) -->
    <link th:if="${pageCss != null and !#strings.isEmpty(pageCss)}" rel="stylesheet"
        th:href="@{'/css/pages/' + ${pageCss} + '.css?v=' + ${(pageCss == 'jlpt' or pageCss == 'jlpt-exam' or pageCss == 'jlpt-study' or pageCss == 'jlpt-practice' or pageCss == 'jlpt-practice-admin' or pageCss == 'verb-practice-admin' or pageCss == 'kanji-map' or pageCss == 'kanji-map-admin' or pageCss == 'weakness-notebook' or (pageCss == 'jlas-certificates' and ownedUi == true)) ? '20261119-deploy-merge' : (pageCss == 'weakness-notebook' ? '20261021-notebook-sort-menu' : (pageCss == 'home' ? '20261105-plum' : (pageCss == 'arena' ? '20261127-puzzle' : (pageCss == 'login' ? '20261128-terms-google' : ((pageCss == 'profile' or pageCss == 'credit-history') ? '20261125-largescreen' : (pageCss == 'onyomi' ? '20261123-ui-standard' : (pageCss == 'textbooks' ? '20261108-plum' : '20261105-plum')))))))}}" />
    <link th:if="${pageCss == 'kanji-map'}" rel="stylesheet" th:href="@{/css/pages/kanji-map.css(v='20261119-toast')}" />
    <link th:if="${pageCss == 'kanji-map-admin'}" rel="stylesheet" th:href="@{/css/pages/kanji-map-admin.css(v=20261119-deploy-merge)}" />
    <link th:if="${pageCss == 'jlpt-study'}" rel="stylesheet" th:href="@{/css/pages/jlpt-study.css?v=20261119-compact}" />
    <link th:if="${pageCss == 'jlpt'}" rel="stylesheet" th:href="@{/css/pages/jlpt.css?v=20261119-compact}" />
    <link th:if="${pageCss == 'profile'}" rel="stylesheet" th:href="@{/css/pages/retention-demo.css?v=20261125-phase2a}" />
    <link th:if="${pageCss == 'register' or pageCss == 'profile'}" rel="stylesheet" th:href="@{/css/components/date-wheel.css?v=20261102-wheel2}" />
    <link th:if="${pageCss == 'jlpt-practice'}" rel="stylesheet" th:href="@{/css/pages/jlpt-practice.css?v=20261126-rem}" />
    <link th:if="${pageCss == 'jlpt-exam'}" rel="stylesheet" th:href="@{/css/pages/jlpt-exam-furigana.css?v=20261126-rem}" />
    <link th:if="${pageCss == 'jlpt-exam'}" rel="stylesheet" th:href="@{/css/pages/jlpt-exam-controls.css?v=20261126-rem}" />
    <link th:if="${pageCss == 'jlpt-exam' or pageCss == 'jlpt-practice'}" rel="stylesheet" th:href="@{/css/pages/jlpt-sentence-order.css?v=20261126-rem}" />
    <link th:if="${pageCss == 'weakness-notebook'}" rel="stylesheet" th:href="@{/css/pages/weakness-notebook.css?v=20261126-rem}" />
    <th:block th:if="${pageCss == 'jlpt-exam' or pageCss == 'jlpt-practice' or pageCss == 'verb-practice' or pageCss == 'kanji-map'}">
        <link rel="stylesheet" th:href="@{/css/components/learning-report.css(v=20261120-report-fix)}" />
        <script th:src="@{/js/components/learning-report.js(v=20261120-report-fix)}"></script>
    </th:block>
    <!-- Shared shell styles are loaded last so every standard page uses the contract-owned navigation. -->
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css?v=20261125-largescreen}" />
    <link rel="stylesheet" th:href="@{/css/pages/learning-journey.css}" />
    <link th:if="${pageCss == 'smart-test'}" rel="stylesheet" th:href="@{/css/learning-v2-tokens.css?v=20261111-smart-test}" />
    <link th:if="${pageCss == 'smart-test'}" rel="stylesheet" th:href="@{/css/pages/jpath-base.css?v=20261126-rem}" />
    <link th:if="${pageCss == 'smart-test'}" rel="stylesheet" th:href="@{/css/pages/smart-test.css?v=20261126-rem}" />

    <script th:src="@{/js/components/avatar-frame.js?v=20261021-catalog}"></script>
    <script th:src="@{/js/auth-session.js(v=20261119-notebook-survey)}"></script>
    <script th:src="@{/js/components.js}"></script>
    <script defer th:src="@{/js/sakura-background.js}"></script>
    <script th:src="@{/js/components/cp-auto-pay.js(v=20261116-minutes)}"></script>
    <script defer th:src="@{/js/inline-dictionary.js(v=20261103-auto)}"></script>
    <!-- Chatbot gia sư (nút nổi); tự ẩn với khách, trang quản trị, bài kiểm tra, hoặc khi máy chủ chưa bật -->
    <link rel="stylesheet" th:href="@{/css/components/tutor-widget.css(v=20261125-largescreen)}" />
    <script defer th:src="@{/js/pages/home-mascot.js?v=20261115-f129}"></script>
    <script defer th:src="@{/js/components/tutor-widget.js(v=20261125-cleanup)}"></script>
    <link rel="stylesheet" href="/css/components/cp-unit.css?v=20261123-gold" />
    <script defer src="/js/components/cp-unit.js?v=20261123-gold"></script>
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png" />
    <link rel="stylesheet" href="/css/owned-mobile.css?v=20261119-compact" />
    <!-- Shared dropdown for <select data-jl-select> (css/components/select.css, js/components/select.js) -->
    <link rel="stylesheet" th:href="@{/css/components/select.css(v=20261125-largescreen)}" />
    <script defer th:src="@{/js/components/select.js(v=20261125-icons-vi)}"></script>

    <!-- UI contract for the owned feature pages; other modules keep their existing styles. -->
    <th:block th:if="${pageCss == 'jlpt' or pageCss == 'jlpt-exam' or pageCss == 'jlpt-study' or pageCss == 'jlpt-practice' or pageCss == 'jlpt-admin' or pageCss == 'jlpt-practice-admin' or pageCss == 'verb-practice' or pageCss == 'verb-practice-admin' or pageCss == 'kanji-map' or pageCss == 'kanji-map-admin' or pageCss == 'weakness-notebook' or (pageCss == 'jlas-certificates' and ownedUi == true)}">
        <link rel="stylesheet" th:href="@{/css/controls.css(v=20261125-largescreen)}" />
        <script defer th:src="@{/js/components/owned-ui.js(v=20261119-compact)}"></script>
    </th:block>
    <link rel="stylesheet" th:href="@{/css/components/ui-chuan.css(v=20261125-largescreen)}" />
    <link th:if="${pageCss == 'jlpt-practice'}" rel="stylesheet" th:href="@{/css/pages/jlpt-practice-setup.css(v=20261119-instant-mark)}" />
    <link th:if="${pageCss == 'jlpt-practice'}" rel="stylesheet" th:href="@{/css/pages/jlpt-practice-player.css(v=20261119-instant-mark)}" />
</head>

<!-- Compact feature-module head (aicall / learning / etc.) -->
