<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="standard(pageTitle, pageCss)">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"
          th:content="${pageCss == 'login' ? 'width=device-width, initial-scale=1.0, viewport-fit=cover' : 'width=device-width, initial-scale=1.0'}" />
    <title th:text="${pageTitle}">KotsuKotsu</title>

    <script>/* Apply saved light/dark theme before paint to avoid a flash (key matches jlab-base-shell.js). */
      (function () { try { var t = localStorage.getItem('jlas-theme'); if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t); document.documentElement.classList.remove('light', 'dark'); document.documentElement.classList.add(t); } catch (e) {} })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://jlassep490media.blob.core.windows.net" />
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&amp;family=Instrument+Serif:ital@0;1&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;family=Noto+Serif:wght@400;500;600;700&amp;family=Noto+Serif+JP:wght@400;500;600;700&amp;family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Shared design system (index = source of truth) -->
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/sakura-background.css}" />

    <!-- Shared components -->
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}" />
    <link rel="stylesheet" th:href="@{/css/components/cards.css}" />
    <link rel="stylesheet" th:href="@{/css/components/inputs.css}" />
    <link rel="stylesheet" th:href="@{/css/components/forms.css}" />
    <link rel="stylesheet" th:href="@{/css/components/dropdowns.css}" />
    <link rel="stylesheet" th:href="@{/css/components/toast.css?v=20261011-mobile-toast}" />
    <link rel="stylesheet" th:href="@{/css/components/header.css}" />
    <link rel="stylesheet" th:href="@{/css/components/brand.css}" />
    <link rel="stylesheet" th:href="@{/css/components/platform-nav.css}" />
    <link rel="stylesheet" th:href="@{/css/components/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/components/user-menu.css?v=20261014-frames}" />
    <link rel="stylesheet" th:href="@{/css/components/kitsu-guide.css}" />
    <link rel="stylesheet" th:href="@{/css/components/inline-dictionary.css(v=20261103-auto)}" />
    <link rel="stylesheet" th:href="@{/css/components/retention-live.css?v=20260903-motion}" />
    <link rel="stylesheet" th:href="@{/css/components/avatar-frame.css?v=20261021-catalog}" />

    <!-- Page-specific CSS (optional) -->
    <link th:if="${pageCss != null and !#strings.isEmpty(pageCss)}" rel="stylesheet"
        th:href="@{'/css/pages/' + ${pageCss} + '.css?v=' + ${(pageCss == 'jlpt' or pageCss == 'jlpt-exam' or pageCss == 'jlpt-study' or pageCss == 'jlpt-practice' or pageCss == 'jlpt-practice-admin' or pageCss == 'verb-practice-admin' or pageCss == 'kanji-map' or pageCss == 'kanji-map-admin' or pageCss == 'weakness-notebook' or pageCss == 'jlas-certificates') ? '20261107-plum-portal' : (pageCss == 'weakness-notebook' ? '20261021-notebook-sort-menu' : (pageCss == 'home' ? '20261105-plum' : (pageCss == 'arena' ? '20261112-preview-dark' : (pageCss == 'login' ? '20261111-google-face' : (pageCss == 'profile' ? '20261103-auto' : (pageCss == 'onyomi' ? '20261116-next-mobile' : (pageCss == 'textbooks' ? '20261108-plum' : '20261105-plum')))))))}}" />
    <link th:if="${pageCss == 'kanji-map'}" rel="stylesheet" th:href="@{/css/pages/kanji-map.css(v='20261107-plum-portal')}" />
    <link th:if="${pageCss == 'kanji-map-admin'}" rel="stylesheet" th:href="@{/css/pages/kanji-map-admin.css(v=20261107-plum-portal)}" />
    <link th:if="${pageCss == 'jlpt-study'}" rel="stylesheet" th:href="@{/css/pages/jlpt-study.css?v=20261111-icons}" />
    <link th:if="${pageCss == 'jlpt'}" rel="stylesheet" th:href="@{/css/pages/jlpt.css?v=20261111-ui}" />
    <link th:if="${pageCss == 'profile'}" rel="stylesheet" th:href="@{/css/pages/retention-demo.css?v=20261105-plum}" />
    <link th:if="${pageCss == 'register' or pageCss == 'profile'}" rel="stylesheet" th:href="@{/css/components/date-wheel.css?v=20261102-wheel2}" />
    <link th:if="${pageCss == 'jlpt-practice'}" rel="stylesheet" th:href="@{/css/pages/jlpt-practice.css?v=20261111-ui}" />
    <link th:if="${pageCss == 'jlpt-exam'}" rel="stylesheet" th:href="@{/css/pages/jlpt-exam-furigana.css?v=20261107-plum-portal}" />
    <link th:if="${pageCss == 'jlpt-exam'}" rel="stylesheet" th:href="@{/css/pages/jlpt-exam-controls.css?v=20261107-plum-portal}" />
    <link th:if="${pageCss == 'jlpt-exam' or pageCss == 'jlpt-practice'}" rel="stylesheet" th:href="@{/css/pages/jlpt-sentence-order.css?v=20261107-plum-portal}" />
    <!-- Shared shell styles are loaded last so every standard page uses the contract-owned navigation. -->
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css?v=20261111-nav-nowrap}" />
    <link rel="stylesheet" th:href="@{/css/pages/learning-journey.css}" />
    <link th:if="${pageCss == 'smart-test'}" rel="stylesheet" th:href="@{/css/learning-v2-tokens.css?v=20261111-smart-test}" />
    <link th:if="${pageCss == 'smart-test'}" rel="stylesheet" th:href="@{/css/pages/jpath-base.css?v=20261111-smart-test}" />
    <link th:if="${pageCss == 'smart-test'}" rel="stylesheet" th:href="@{/css/pages/smart-test.css?v=20261111-learning-v2}" />

    <script th:src="@{/js/components/avatar-frame.js?v=20261021-catalog}"></script>
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/components.js}"></script>
    <script defer th:src="@{/js/sakura-background.js}"></script>
    <script th:src="@{/js/components/cp-auto-pay.js(v=20261103-auto)}"></script>
    <script defer th:src="@{/js/inline-dictionary.js(v=20261103-auto)}"></script>
    <!-- Chatbot gia sư (nút nổi); tự ẩn với khách, trang quản trị, bài kiểm tra, hoặc khi máy chủ chưa bật -->
    <link rel="stylesheet" th:href="@{/css/components/tutor-widget.css(v=20261026c)}" />
    <script defer th:src="@{/js/components/tutor-widget.js(v=20261116-stream)}"></script>
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png" />
    <link rel="stylesheet" href="/css/owned-mobile.css?v=20261107-onyomi-mobile" />
    <!-- Shared dropdown for <select data-jl-select> (css/components/select.css, js/components/select.js) -->
    <link rel="stylesheet" th:href="@{/css/components/select.css(v=20261111-select2)}" />
    <script defer th:src="@{/js/components/select.js(v=20261111-select2)}"></script>
</head>

<!-- Compact feature-module head (aicall / learning / etc.) -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />

</head>

</html>
