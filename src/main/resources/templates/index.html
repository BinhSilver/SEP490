<!DOCTYPE html>
<html class="home-html" lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: standard('KotsuKotsu', 'home')}"></head>

<body data-mobile-adapt="owned" id="jlabBasePage" class="app-body app-body--marketing page-home">

    <div id="jlabBaseShellMount"></div>

    <main id="jlabBaseContent" class="app-main page-home-main">
        <section class="home-hero" aria-labelledby="home-hero-title">
            <div class="home-scene" data-home-scene data-home-motion="full" aria-hidden="true">
                <div class="home-scene__layer home-scene__layer--day"></div>
                <div class="home-scene__layer home-scene__layer--night"></div>
                <div class="home-scene__dusk"></div>
                <svg class="home-scene__stars" viewBox="0 0 1600 900" preserveAspectRatio="none" focusable="false">
                    <g fill="currentColor">
                        <circle cx="110" cy="60" r="1.4" /><circle cx="260" cy="126" r="1" />
                        <circle cx="350" cy="40" r="1.5" /><circle cx="470" cy="95" r="1" />
                        <circle cx="620" cy="38" r="1.3" /><circle cx="720" cy="158" r="1" />
                        <circle cx="800" cy="72" r="1.6" /><circle cx="890" cy="220" r="1" />
                        <circle cx="990" cy="32" r="1.2" /><circle cx="1100" cy="182" r="1.5" />
                        <circle cx="1190" cy="75" r="1" /><circle cx="1280" cy="130" r="1.3" />
                        <circle cx="1380" cy="30" r="1.4" /><circle cx="1500" cy="88" r="1" />
                    </g>
                    <g class="home-scene__constellation" fill="none" stroke="currentColor" stroke-linecap="round">
                        <path d="M850 45v8m-4-4h8M1160 112v8m-4-4h8M570 135v6m-3-3h6" />
                    </g>
                </svg>
                <div class="home-sky__orbit home-sky__orbit--sun" data-home-sun-anchor>
                    <div class="home-sky__body home-sky__sun" data-home-sun></div>
                </div>
                <div class="home-sky__orbit home-sky__orbit--moon" data-home-moon-anchor>
                    <div class="home-sky__body home-sky__moon" data-home-moon></div>
                </div>
                <div class="home-sky__horizon" data-home-horizon></div>
            </div>
            <div class="home-hero__content">
                <h1 id="home-hero-title" class="home-hero__title">
                    <span class="home-hero__line">Học thêm <span class="home-hero__accent">1</span> ngôn ngữ,</span>
                    <span class="home-hero__line">sống thêm <span class="home-hero__accent">1</span> đời.</span>
                </h1>
                <div class="home-hero__actions">
                    <!-- F24: one label per case, set by landing.js — guest: sign up; signed in without a path: create one;
                         with a path: carry on -->
                    <a class="home-hero__button home-hero__button--primary" th:href="@{/register}" data-home-start>
                        <span data-home-start-text>Đăng ký học miễn phí</span>
                    </a>
                    <a class="home-hero__button home-hero__button--secondary" th:href="@{/shadowing}">
                        <span>Khám phá</span>
                        <span class="material-symbols-outlined home-hero__explore" aria-hidden="true">explore</span>
                    </a>
                </div>
            </div>
        </section>
        <div th:replace="~{fragments/landing-sections :: sections}"></div>
    </main>

    <!-- [JLAS-W0108] F25 word cards beside the hero (own module, can be hidden by the learner) -->
    <link rel="stylesheet" th:href="@{/css/pages/home-word-deck.css?v=20261110}">
    <link rel="stylesheet" th:href="@{/css/pages/home-mascot.css?v=20261115-f169}">
    <link rel="stylesheet" th:href="@{/css/pages/landing.css?v=20261115-f167}">
    <script th:src="@{/js/pages/home-mascot.js?v=20261115-f129}"></script>
    <script th:src="@{/js/pages/home-word-deck.js?v=20261115-f168}"></script>
    <script th:src="@{/js/pages/home-theme-scene.js?v=20261009-setting-arc}"></script>
    <script th:src="@{/js/pages/landing.js?v=20261111-path-state}"></script>
    <script th:src="@{/js/jlab-base-shell.js?v=20261109-kotsu}"></script>

</body>

</html>
