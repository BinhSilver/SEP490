<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nội dung cộng đồng | KotsuKotsu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/tokens.css}"/>
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}"/>
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}"/>
    <link rel="stylesheet" th:href="@{/css/pages/community.css(v=20261108-plum)}"/>
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css(v='20261111-nav-nowrap')}"/>
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png"/>
    <link rel="stylesheet" href="/css/owned-mobile.css?v=20261009-compact-2">
</head>
<body data-mobile-adapt="owned" id="jlabBasePage" class="page-community">
<div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent">
    <div class="cm-page" id="cmDetail" th:attr="data-content-type=${contentType},data-content-id=${contentId}">
        <a class="cm-back" href="/community"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Quay lại Cộng đồng</a>

        <div class="cm-state" id="cmDetailState" aria-live="polite">
            <span class="cm-spinner" aria-hidden="true"></span> Đang tải nội dung…
        </div>

        <div id="cmDetailBody" hidden>
            <div class="cm-banner" id="cmNotice" role="status" hidden></div>

            <article class="cm-detail">
                <div class="cm-detail__thumb" id="cmThumb" aria-hidden="true"></div>
                <div class="cm-detail__main">
                    <div class="cm-badges" id="cmBadges"></div>
                    <h1 class="cm-detail__title" id="cmTitle"></h1>
                    <p class="cm-detail__author" id="cmAuthor"></p>
                    <p class="cm-detail__desc" id="cmDesc"></p>
                    <div class="cm-detail__actions">
                        <a class="btn btn--primary btn--sm" id="cmOpenSource" href="#">
                            <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> Mở nội dung gốc
                        </a>
                        <button type="button" class="btn btn--ghost btn--sm cm-report-btn" id="cmReportContent" hidden>
                            <i class="fa-regular fa-flag" aria-hidden="true"></i> Báo cáo
                        </button>
                    </div>
                </div>
            </article>

            <section class="cm-panel" aria-labelledby="cmRatingTitle">
                <div class="cm-panel__head">
                    <h2 id="cmRatingTitle">Đánh giá</h2>
                    <p class="cm-rating-summary" id="cmRatingSummary"></p>
                </div>
                <div class="cm-rate" id="cmRate">
                    <div class="cm-stars-input" id="cmStars" role="radiogroup" aria-label="Chọn số sao"></div>
                    <span class="cm-rate__mine" id="cmMyRating"></span>
                    <button type="button" class="btn btn--ghost btn--sm" id="cmUnrate" hidden>Gỡ đánh giá</button>
                </div>
                <p class="cm-muted" id="cmRateHint" hidden></p>
            </section>

            <section class="cm-panel" aria-labelledby="cmCommentTitle">
                <div class="cm-panel__head">
                    <h2 id="cmCommentTitle">Bình luận <span class="cm-count" id="cmCommentCount"></span></h2>
                </div>
                <form class="cm-comment-form" id="cmCommentForm">
                    <label class="cm-visually-hidden" for="cmCommentBody">Viết bình luận</label>
                    <textarea id="cmCommentBody" rows="3" maxlength="1000" placeholder="Chia sẻ cảm nhận của bạn…"></textarea>
                    <div class="cm-comment-form__foot">
                        <span class="cm-muted" id="cmCommentCounter">0/1000</span>
                        <button type="submit" class="btn btn--primary btn--sm" id="cmCommentSubmit">Gửi bình luận</button>
                    </div>
                </form>
                <p class="cm-muted" id="cmCommentHint" hidden></p>
                <ul class="cm-comments" id="cmComments" aria-live="polite"></ul>
                <div class="cm-comments__more">
                    <button type="button" class="btn btn--secondary btn--sm" id="cmMoreComments" hidden>Xem thêm bình luận</button>
                </div>
            </section>
        </div>
    </div>

    <div class="cm-modal" id="cmReportModal" role="dialog" aria-modal="true" aria-labelledby="cmReportTitle" hidden>
        <div class="cm-modal__backdrop" data-cm-close></div>
        <form class="cm-modal__box" id="cmReportForm">
            <h2 id="cmReportTitle">Báo cáo nội dung</h2>
            <p class="cm-muted" id="cmReportTarget"></p>
            <label class="cm-field cm-field--block">
                <span>Lý do</span>
                <select id="cmReportReason" required></select>
            </label>
            <label class="cm-field cm-field--block">
                <span>Ghi chú (không bắt buộc)</span>
                <textarea id="cmReportNote" rows="3" maxlength="500" placeholder="Mô tả thêm để kiểm duyệt viên xử lý nhanh hơn"></textarea>
            </label>
            <div class="cm-modal__actions">
                <button type="button" class="btn btn--secondary btn--sm" data-cm-close>Huỷ</button>
                <button type="submit" class="btn btn--primary btn--sm" id="cmReportSubmit">Gửi báo cáo</button>
            </div>
        </form>
    </div>

    <!-- Hộp xác nhận dùng chung (xoá bình luận) thay cho window.confirm(). -->
    <th:block th:replace="~{community/modals :: confirm}"></th:block>
</main>

<script th:src="@{/js/auth-session.js}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
<script th:src="@{/js/pages/community-common.js(v=20261102)}"></script>
<script th:src="@{/js/pages/community-detail.js(v=20261109-kotsu)}"></script>
</body>
</html>
