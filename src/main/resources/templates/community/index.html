<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cộng đồng | KotsuKotsu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/tokens.css}"/>
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}"/>
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}"/>
    <link rel="stylesheet" th:href="@{/css/pages/community.css}"/>
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}"/>
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png"/>
    <link rel="stylesheet" href="/css/owned-mobile.css?v=20261009-compact-2">
</head>
<body data-mobile-adapt="owned" id="jlabBasePage" class="page-community">
<div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent">
    <div class="cm-page cm-page--feed">
        <header class="cm-hero cm-hero--compact">
            <div>
                <h1 class="cm-title">Cộng đồng</h1>
                <p class="cm-subtitle">Chia sẻ kinh nghiệm học tiếng Nhật, hỏi đáp và khám phá nội dung người học chia sẻ.</p>
            </div>
            <button type="button" class="btn btn--secondary btn--sm cm-filter-toggle" id="cmFilterToggle"
                    aria-controls="cmSide" aria-expanded="false">
                <i class="fa-solid fa-sliders" aria-hidden="true"></i> Bộ lọc
            </button>
        </header>

        <div class="cm-layout">
            <aside class="cm-side" id="cmSide" aria-label="Bộ lọc nội dung">
                <div class="cm-side__head">
                    <h2>Bộ lọc</h2>
                    <button type="button" class="cm-icon-btn" id="cmFilterClose" aria-label="Đóng bộ lọc"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
                </div>
                <form class="cm-filters cm-filters--side" id="cmFilters" role="search" aria-label="Tìm kiếm nội dung cộng đồng">
                    <label class="cm-search">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <span class="cm-visually-hidden">Từ khoá</span>
                        <input type="search" name="keyword" id="cmKeyword" maxlength="100" placeholder="Tìm bài viết, nội dung…" autocomplete="off">
                    </label>
                    <label class="cm-field">
                        <span>Loại nội dung</span>
                        <select name="contentType" id="cmType"><option value="">Tất cả</option></select>
                    </label>
                    <label class="cm-field">
                        <span>Cấp độ</span>
                        <select name="jlptLevel" id="cmLevel"><option value="">Tất cả</option></select>
                    </label>
                    <label class="cm-field">
                        <span>Đánh giá</span>
                        <select name="minRating" id="cmRating">
                            <option value="">Tất cả</option>
                            <option value="4">Từ 4 sao</option>
                            <option value="3">Từ 3 sao</option>
                            <option value="2">Từ 2 sao</option>
                            <option value="1">Từ 1 sao</option>
                        </select>
                    </label>
                    <label class="cm-field">
                        <span>Sắp xếp</span>
                        <select name="sort" id="cmSort"><option value="newest">Mới nhất</option></select>
                    </label>
                    <div class="cm-filters__actions">
                        <button type="submit" class="btn btn--primary btn--sm">Tìm kiếm</button>
                        <button type="button" class="btn btn--secondary btn--sm" id="cmReset">Xoá lọc</button>
                    </div>
                </form>
            </aside>
            <div class="cm-drawer-backdrop" id="cmDrawerBackdrop" hidden></div>

            <section class="cm-feed" aria-label="Bảng tin cộng đồng">
                <div class="cm-composer" id="cmComposer">
                    <div class="cm-composer__row">
                        <span id="cmComposerAvatar"></span>
                        <button type="button" class="cm-composer__open" id="cmComposerOpen" aria-controls="cmComposerForm" aria-expanded="false">
                            Bạn muốn chia sẻ gì về việc học tiếng Nhật?
                        </button>
                    </div>
                    <form class="cm-composer__form" id="cmComposerForm" hidden>
                        <label class="cm-visually-hidden" for="cmComposerBody">Nội dung bài viết</label>
                        <textarea id="cmComposerBody" class="cm-composer__input" rows="4" maxlength="5000"
                                  placeholder="Bạn muốn chia sẻ gì về việc học tiếng Nhật?"></textarea>
                        <div class="cm-composer__foot">
                            <label class="cm-composer__level">
                                <span>Cấp độ</span>
                                <select id="cmComposerLevel">
                                    <option value="">Chung</option>
                                    <option value="N5">N5</option>
                                    <option value="N4">N4</option>
                                    <option value="N3">N3</option>
                                    <option value="N2">N2</option>
                                    <option value="N1">N1</option>
                                </select>
                            </label>
                            <span class="cm-composer__count" id="cmComposerCount">0/5000</span>
                            <button type="button" class="btn btn--secondary btn--sm" id="cmComposerCancel">Huỷ</button>
                            <button type="submit" class="btn btn--primary btn--sm" id="cmComposerSubmit" disabled>Đăng</button>
                        </div>
                    </form>
                </div>

                <p class="cm-summary" id="cmSummary" aria-live="polite"></p>
                <div class="cm-feed__list" id="cmFeed" aria-live="polite" aria-busy="true"></div>
                <div id="cmFeedState"></div>
                <div class="cm-feed__sentinel" id="cmSentinel" aria-hidden="true"></div>
                <div class="cm-feed__more">
                    <button type="button" class="btn btn--secondary btn--sm" id="cmLoadMore" hidden>Xem thêm</button>
                </div>
            </section>
        </div>
    </div>

    <th:block th:replace="~{community/modals :: modals}"></th:block>
</main>

<script th:src="@{/js/auth-session.js}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
<script th:src="@{/js/pages/community-common.js}"></script>
<script th:src="@{/js/pages/community-cards.js}"></script>
<script th:src="@{/js/pages/community-feed.js}"></script>
</body>
</html>
