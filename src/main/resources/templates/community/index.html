<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cộng đồng | KotsuKotsu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/tokens.css}"/>
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}"/>
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}"/>
    <link rel="stylesheet" th:href="@{/css/pages/community.css(v=20261108-plum)}"/>
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css(v='20261111-nav-nowrap')}"/>
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png"/>
    <link rel="stylesheet" href="/css/owned-mobile.css?v=20261009-compact-2">
</head>
<body data-mobile-adapt="owned" id="jlabBasePage" class="page-community">
<div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent">
    <div class="cm-page">
        <header class="cm-hero">
            <div>
                <h1 class="cm-title">Cộng đồng</h1>
                <p class="cm-subtitle">Khám phá nội dung học do người học chia sẻ công khai: đánh giá, bình luận và báo cáo nội dung không phù hợp.</p>
            </div>
        </header>

        <form class="cm-filters" id="cmFilters" role="search" aria-label="Tìm kiếm nội dung cộng đồng">
            <label class="cm-search">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <span class="cm-visually-hidden">Từ khoá</span>
                <input type="search" name="keyword" id="cmKeyword" maxlength="100" placeholder="Tìm theo tên hoặc mô tả…" autocomplete="off">
            </label>
            <label class="cm-field">
                <span>Loại nội dung</span>
                <select name="contentType" id="cmType"><option value="">Tất cả</option></select>
            </label>
            <label class="cm-field">
                <span>Cấp độ</span>
                <select name="jlptLevel" id="cmLevel"><option value="">Tất cả</option></select>
            </label>
            <label class="cm-field">
                <span>Đánh giá</span>
                <select name="minRating" id="cmRating">
                    <option value="">Tất cả</option>
                    <option value="4">Từ 4 sao</option>
                    <option value="3">Từ 3 sao</option>
                    <option value="2">Từ 2 sao</option>
                    <option value="1">Từ 1 sao</option>
                </select>
            </label>
            <label class="cm-field">
                <span>Sắp xếp</span>
                <select name="sort" id="cmSort"><option value="newest">Mới nhất</option></select>
            </label>
            <div class="cm-filters__actions">
                <button type="submit" class="btn btn--primary btn--sm">Tìm kiếm</button>
                <button type="button" class="btn btn--secondary btn--sm" id="cmReset">Xoá lọc</button>
            </div>
        </form>

        <p class="cm-summary" id="cmSummary" aria-live="polite"></p>
        <section class="cm-grid" id="cmGrid" aria-live="polite" aria-busy="true"></section>

        <nav class="cm-pager" id="cmPager" aria-label="Phân trang" hidden>
            <button type="button" class="btn btn--secondary btn--sm" data-step="-1">Trang trước</button>
            <span id="cmPageInfo"></span>
            <button type="button" class="btn btn--secondary btn--sm" data-step="1">Trang sau</button>
        </nav>
    </div>
</main>

<script th:src="@{/js/auth-session.js}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
<script th:src="@{/js/pages/community-common.js(v=20261102)}"></script>
<script th:src="@{/js/pages/community-feed.js(v=20261102)}"></script>
</body>
</html>
