<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Không thể mở trang · KotsuKotsu</title>
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&display=swap">
    <link rel="stylesheet" th:href="@{/css/tokens.css(v=20261125-phase1)}">
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}">
    <link rel="stylesheet" th:href="@{/css/base.css(v=20261125-phase1)}">
    <link rel="stylesheet" th:href="@{/arena/css/tokens.css(v=20261125-phase1)}">
    <link rel="stylesheet" th:href="@{/arena/css/base.css(v=20261125-phase1)}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css(v=20261125-phase1)}">
    <link rel="stylesheet" th:href="@{/css/components/dropdowns.css(v=20261125-phase1)}">
    <link rel="stylesheet" th:href="@{/css/components/header.css(v=20261125-phase1)}">
    <link rel="stylesheet" th:href="@{/css/components/brand.css(v=20261125-phase1)}">
    <link rel="stylesheet" th:href="@{/css/components/platform-nav.css(v=20261125-icons-vi)}">
    <link rel="stylesheet" th:href="@{/css/components/user-menu.css(v=20261125-icons-vi)}">
    <link rel="stylesheet" th:href="@{/css/components/kitsu-guide.css(v=20261125-phase1)}">
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/components.js}"></script>
    <link rel="stylesheet" th:href="@{/css/pages/error.css(v=20261105-plum)}">
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css(v=20261125-icons-vi)}">
    <link rel="stylesheet" href="/css/owned-mobile.css?v=20261009-compact-2">
</head>
<body data-mobile-adapt="owned" id="jlabBasePage">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent" class="error-page">
    <section class="error-card" th:with="forbidden=${status == 403}">
        <span class="error-card__code"
              th:text="${status != null and status != 999 ? 'ERROR ' + status : 'KotsuKotsu'}">KotsuKotsu</span>
        <div id="errorKitsuGuide">
            <div th:replace="~{fragments/components/kitsu-guide :: guide(
                'Kitsu-chan đang ở đây',
                ${status == 403}
                    ? 'Khu vực này cần quyền riêng. Mình đưa bạn về chỗ học quen thuộc nhé!'
                    : 'Trang này đang đi lạc một chút. Mình sẽ giúp bạn quay về nơi an toàn để tiếp tục học!')}"></div>
        </div>
        <h1 th:text="${forbidden} ? 'Bạn không có quyền truy cập' : 'Không thể mở trang này'">Không thể mở trang này</h1>
        <p th:text="${forbidden} ? 'Trang này chỉ dành cho tài khoản được cấp quyền, ví dụ kiểm duyệt viên hoặc quản trị viên. Nếu bạn nghĩ đây là nhầm lẫn, hãy liên hệ quản trị viên.' :
                    (${status == 404} ? 'Đường dẫn không tồn tại hoặc đã được thay đổi.' :
                    'Phiên truy cập hoặc dịch vụ vừa gặp sự cố. Hãy quay về sảnh và thử lại.')">
            Phiên truy cập hoặc dịch vụ vừa gặp sự cố. Hãy quay về sảnh và thử lại.
        </p>
        <div class="error-card__actions">
            <a class="btn btn--primary" th:href="@{/}">Về trang chủ</a>
            <button th:if="${forbidden}" class="btn btn--ghost" type="button" onclick="history.length > 1 ? history.back() : window.location.assign('/')">Quay lại trang trước</button>
            <button th:unless="${forbidden}" class="btn btn--ghost" type="button" onclick="window.location.reload()">Thử lại</button>
        </div>
    </section>
</main>
<script th:src="@{/js/jlab-base-shell.js(v=20261125-icons-vi)}"></script>
</body>
</html>
