<!DOCTYPE html>
<html id="jlabBaseDocument" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: standard('Chi tiết ngày học Giao tiếp - JLAS', null)}">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết ngày học Giao tiếp - JLAS</title>
    <link rel="stylesheet" href="../../static/css/tokens.css" />
    <link rel="stylesheet" href="../../static/css/base.css" />
    <link rel="stylesheet" href="../../static/css/layout.css" />
    <link rel="stylesheet" href="../../static/css/learning-v2-tokens.css" />
    <link rel="stylesheet" href="../../static/css/pages/jpath-base.css" />
    <link rel="stylesheet" href="../../static/css/pages/jpath-nav.css" />
    <link rel="stylesheet" href="../../static/css/pages/jpath-path.css" />
    <link rel="stylesheet" href="../../static/css/pages/jpath-side.css" />
    <link rel="stylesheet" href="../../static/css/pages/cpath.css" />
</head>
<th:block th:replace="~{jlptpath/fragments/jpath :: assets('jpath-side')}"></th:block>
<link rel="stylesheet" href="../../static/css/pages/jpath-path.css" th:href="@{/css/pages/jpath-path.css(v=${jpathAssetVersion})}" />
<link rel="stylesheet" href="../../static/css/pages/cpath.css" th:href="@{/css/pages/cpath.css(v=${jpathAssetVersion})}" />
<body id="jlabBasePage" class="app-body jp-body">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent" class="jp-page jp-side cp-page" data-inline-dictionary>
    <div class="jp-ws jp-ws--norail">
        <nav class="jp-crumbs jp-ws__crumbs" aria-label="Bạn đang ở">
            <ol class="jp-crumbs__list">
                <li class="jp-crumbs__item"><a class="jp-crumbs__link" href="/">Trang chủ</a></li>
                <li class="jp-crumbs__item"><a class="jp-crumbs__link" href="/learning/comm/path" th:href="@{/learning/comm/path}">Lộ trình giao tiếp</a></li>
                <li class="jp-crumbs__item"><span class="jp-crumbs__here" aria-current="page">Chi tiết ngày</span></li>
            </ol>
        </nav>
        <aside class="jp-ws__side" aria-label="Điều hướng lộ trình giao tiếp">
            <nav class="jp-sidenav" aria-label="Trang của lộ trình">
                <p class="jp-sidenav__title">Lộ trình Giao tiếp</p>
                <a class="jp-sidenav__link" href="/learning/comm/path" th:href="@{/learning/comm/path}">
                    <svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-route"/></svg> Bản đồ tuần
                </a>
                <a class="jp-sidenav__link" href="/learning/comm/day" th:href="@{/learning/comm/day}" aria-current="page">
                    <svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-history"/></svg> Chi tiết ngày
                </a>
                <a class="jp-sidenav__link" href="/learning/comm/survey" th:href="@{/learning/comm/survey}">
                    <svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-settings"/></svg> Thêm mục tiêu phụ
                </a>
                <a class="jp-sidenav__link" href="/learning/comm/notebook">
                    <svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-notebook"/></svg> Sổ tay
                </a>
            </nav>
        </aside>
        <div class="jp-ws__main">
            <div id="cpathDayRoot" aria-live="polite">
                <p class="jp-status" role="status">Đang tải chi tiết ngày học…</p>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{jlptpath/fragments/jpath :: scripts}">
    <script src="../../static/js/jlptpath/jpath-api.js"></script>
</th:block>
<script src="../../static/js/cpath/cpath-day.js" th:src="@{/js/cpath/cpath-day.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
