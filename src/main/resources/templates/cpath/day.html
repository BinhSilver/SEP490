    <link rel="stylesheet" href="../../static/css/tokens.css" />
    <link rel="stylesheet" href="../../static/css/base.css" />
    <link rel="stylesheet" href="../../static/css/layout.css" />
    <link rel="stylesheet" href="../../static/css/learning-v2-tokens.css" />
    <link rel="stylesheet" href="../../static/css/pages/jpath-base.css?v=20261126-rem" />
    <link rel="stylesheet" href="../../static/css/pages/jpath-nav.css?v=20261126-rem" />

<body id="jlabBasePage" class="app-body jp-body">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent" class="jp-page jp-side cp-page" data-inline-dictionary>
    <div class="jp-ws jp-ws--norail">
        <th:block th:replace="~{jlptpath/fragments/jpath :: back('Lộ trình giao tiếp', '/learning/comm/path')}"></th:block>
        <aside class="jp-ws__side" aria-label="Điều hướng lộ trình giao tiếp">
            <nav class="jp-sidenav" aria-label="Trang của lộ trình">
                <p class="jp-sidenav__title">Lộ trình Giao tiếp</p>
                <a class="jp-sidenav__link" href="/learning/comm/path" th:href="@{/learning/comm/path}">
                    <svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-route"/></svg> Bản đồ tuần
                </a>
                <a class="jp-sidenav__link" href="/learning/comm/settings" th:href="@{/learning/comm/settings}">
                    <svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-settings"/></svg> Cài đặt lộ trình
                </a>
                <a class="jp-sidenav__link" href="/learning/comm/path?tour=1" th:href="@{/learning/comm/path(tour=1)}">
                    <svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-lightbulb"/></svg> Xem hướng dẫn
                </a>
                <a class="jp-sidenav__link" href="/learning/comm/notebook">
                    <svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-notebook"/></svg> Sổ tay
                </a>
            </nav>
        </aside>
        <div class="jp-ws__main">
            <div id="cpathDayRoot" aria-live="polite">
                <p class="jp-status jp-skel jp-skel--list" role="status" aria-busy="true"><span class="jp-skel__sr">Đang tải chi tiết ngày học…</span><i class="jp-skel__b jp-skel__b--title"></i><i class="jp-skel__b jp-skel__b--line"></i><i class="jp-skel__b jp-skel__b--short"></i><i class="jp-skel__grid"><i class="jp-skel__b jp-skel__b--card"></i><i class="jp-skel__b jp-skel__b--card"></i><i class="jp-skel__b jp-skel__b--card"></i><i class="jp-skel__b jp-skel__b--card"></i></i></p>
            </div>
        </div>
    </div>
</main>
<!-- F220: the team's shared site footer -->
<th:block th:replace="~{fragments/site-footer :: footer}"></th:block>
<th:block th:replace="~{jlptpath/fragments/jpath :: scripts}">
    <script src="../../static/js/jlptpath/jpath-api.js"></script>
</th:block>
<script src="../../static/js/cpath/cpath-day.js" th:src="@{/js/cpath/cpath-day.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
<th:block th:replace="~{fragments/learning-fox :: fox}"></th:block>
