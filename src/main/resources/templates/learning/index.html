<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lộ trình học On-yomi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <style>
        :root {
            --primary: #0058be;
            --primary-dark: #2170e4;
            --secondary: #2170e4;
            --surface-base: #f8f9ff;
            --surface: #ffffff;
            --surface-muted: #f1f5f9;
            --text: #0b1c30;
            --text-muted: #475569;
            --border: #111827;
            --border-soft: #334155;
            --success: #22C55E;
            --card-radius: 24px;
            --hero-radius: 28px;
        }

        body {
            font-family: var(--font-body, 'Inter', system-ui, sans-serif);
            color: var(--text);
            background: var(--surface-base);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: var(--font-headline, 'Hanken Grotesk', system-ui, sans-serif);
            font-weight: 700;
        }

        .path-page {
            max-width: 1140px;
            margin: 0 auto;
            padding: 32px 24px 80px;
        }

        /* Breadcrumb */
        .path-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .path-breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .path-breadcrumb a:hover {
            color: var(--primary);
        }

        .path-breadcrumb .sep {
            color: var(--border-soft);
        }

        .path-breadcrumb .current {
            color: var(--primary);
            font-weight: 600;
        }

        /* Stage section */
        .stage-section {
            margin-bottom: 64px;
        }

        /* Hero */
        .stage-hero {
            min-height: 220px;
            border-radius: var(--hero-radius);
            padding: 36px 40px;
            background: linear-gradient(135deg, #e0edff 0%, #f8fbff 100%) !important;
            color: var(--text);
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
            border: 2px solid var(--border);
        }

        .stage-hero-icon {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            opacity: 0.95;
        }

        .stage-hero-icon i {
            width: 22px;
            height: 22px;
        }

        .stage-hero-label {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .stage-hero-title {
            font-size: 40px;
            font-weight: 700;
            margin: 0 0 8px;
            line-height: 1.15;
        }

        .stage-hero-subtitle {
            font-size: 16px;
            opacity: 0.92;
            margin: 0 0 20px;
            max-width: 560px;
            line-height: 1.5;
        }

        /* Lesson Grid */
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
        }

        @media (max-width: 991px) {
            .lesson-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 575px) {
            .lesson-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Lesson Card */
        .lesson-card {
            background: var(--surface) !important;
            border: 2px solid var(--border);
            border-radius: var(--card-radius);
            padding: 28px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .lesson-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0, 88, 190, 0.2);
            border-color: var(--border);
        }

        .lesson-card.is-done {
            border-color: var(--border);
            box-shadow: inset 4px 0 0 #16a34a, 0 6px 18px rgba(15, 23, 42, 0.08);
        }

        .lesson-card.is-active {
            border-color: var(--border);
            box-shadow: inset 4px 0 0 #2563eb, 0 6px 18px rgba(15, 23, 42, 0.08);
        }

        .lesson-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #dbeafe;
            color: var(--text);
            border: 1px solid var(--border);
            font-size: 12px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            font-family: var(--font-headline, 'Hanken Grotesk', system-ui, sans-serif);
        }

        .lesson-card-top {
            margin-top: 28px;
            margin-bottom: 16px;
        }

        .lesson-card-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: #dbeafe;
            border: 2px solid var(--border);
            color: #1d4ed8;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }

        .lesson-card-icon i {
            width: 22px;
            height: 22px;
        }

        .lesson-card-title {
            font-size: 24px;
            margin: 0 0 6px;
            color: var(--text);
            font-weight: 700;
        }

        .lesson-card-rules {
            font-size: 15px;
            font-weight: 700;
            color: #1d4ed8;
            font-family: var(--font-mono, 'JetBrains Mono', monospace);
            margin: 0;
        }

        .lesson-card-desc {
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 500;
            margin: 0 0 16px;
            flex-grow: 1;
            line-height: 1.55;
        }

        .lesson-card-desc-intro {
            display: block;
            margin-bottom: 10px;
        }

        .lesson-card-examples {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 16px;
            row-gap: 6px;
            color: #1d4ed8;
            font-weight: 700;
        }

        .lesson-card-example {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        /* Lesson status + progress */
        .lesson-status-row {
            margin-bottom: 20px;
        }

        .lesson-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .lesson-status.active {
            color: #1d4ed8;
        }

        .lesson-status.done {
            color: #15803d;
        }

        .lesson-status i {
            width: 15px;
            height: 15px;
        }

        .lesson-progress-bar {
            height: 6px;
            background: #cbd5e1;
            border-radius: 99px;
            overflow: hidden;
        }

        .lesson-progress-fill {
            height: 100%;
            background: linear-gradient(to right, #3b82f6, #60a5fa);
            border-radius: 99px;
            transition: width 0.5s ease;
        }

        .lesson-progress-pct {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
            margin-top: 4px;
            text-align: right;
        }

        /* CTA Button */
        .lesson-cta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            border: 2px solid var(--border);
            background: var(--surface) !important;
            color: var(--text);
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            font-family: var(--font-body, 'Inter', system-ui, sans-serif);
        }

        .lesson-cta:hover {
            color: #ffffff;
            background: var(--border) !important;
            border-color: var(--border);
            transform: translateY(-2px);
        }

        .lesson-cta.outline {
            background: var(--surface-muted) !important;
            color: var(--text);
            border: 2px solid var(--border);
        }

        .lesson-cta.outline:hover {
            background: var(--border) !important;
            color: #ffffff;
            border-color: var(--border);
        }

        .lesson-cta i {
            width: 18px;
            height: 18px;
        }

        /* Final quiz */
        .final-quiz-wrap {
            margin-top: 40px;
            text-align: center;
        }

        .final-quiz-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 32px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
            border: 2px solid var(--border);
            background: var(--surface) !important;
            color: var(--text);
        }

        .final-quiz-btn.active {
            background: #dbeafe !important;
            border: 2px solid var(--border);
            color: #1d4ed8;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .final-quiz-btn.active:hover {
            transform: translateY(-2px);
            color: #ffffff;
            background: var(--border) !important;
        }

        @media (max-width: 575px) {
            .stage-hero {
                padding: 28px 24px;
                min-height: auto;
            }

            .stage-hero-title {
                font-size: 28px;
            }

            .path-page {
                padding: 20px 16px 60px;
            }
        }
    </style>
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png" />
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}" />
</head>

<body id="jlabBasePage">

    <div id="jlabBaseShellMount"></div>

    <div th:replace="~{learning/fragments/welcome-modal :: welcome-modal}"></div>

    <main id="jlabBaseContent" class="path-page">



        <!-- Mỗi giai đoạn -->
        <section th:each="prog : ${categoryProgressList}" class="stage-section">

            <th:block th:with="
                catName=${prog.category.name},
                isDau=${#strings.contains(catName, 'đầu')},
                isCuoi=${#strings.contains(catName, 'cuối')},
                stageNum=${prog.category.displayOrder}
            ">

                <!-- Hero -->
                <div class="stage-hero">
                    <div class="stage-hero-icon">
                        <i th:if="${isDau}" class="fa-solid fa-brain" aria-hidden="true"></i>
                        <i th:if="${isCuoi}" class="fa-solid fa-book-bookmark" aria-hidden="true"></i>
                        <i th:if="${!isDau and !isCuoi}" class="fa-solid fa-sparkles" aria-hidden="true"></i>
                        <span class="stage-hero-label" th:text="'Giai đoạn ' + ${stageNum}">Giai đoạn 1</span>
                    </div>
                    <h2 class="stage-hero-title"
                        th:text="${isDau} ? 'Âm đầu của âm Hán Việt' : (${isCuoi} ? 'Âm cuối của âm Hán Việt' : 'Chuyển vần Hán Việt')">
                        Âm đầu của âm Hán Việt
                    </h2>
                    <p class="stage-hero-subtitle"
                        th:text="${isDau} ? 'Học cách chuyển âm đầu của âm Hán Việt thành âm đầu Onyomi.' : (${isCuoi} ? 'Học cách chuyển âm cuối của âm Hán Việt thành âm cuối Onyomi.' : 'Học cách chuyển vần Hán Việt thành vần Onyomi tương ứng.')">
                        Học cách chuyển âm đầu...
                    </p>
                </div>

                <!-- Lesson Grid -->
                <div class="lesson-grid">
                    <article th:each="lesson : ${prog.category.lessons}" th:with="
                                lp=${progressMap.get(lesson.id)},
                                lpPct=${lp != null and lp.completed ? 100 : (lp != null and lp.totalQuestions != null and lp.totalQuestions > 0 ? (lp.correctAnswers * 100.0 / lp.totalQuestions) : 0)},
                                lpStatus=${lp != null and lp.completed ? 'done' : (lp != null ? 'active' : 'new')},
                                rulesSummary=${#strings.listJoin(lesson.rules.![sourceSound], ' • ')},
                                typePrefix=${#strings.contains(lesson.title, 'ĐẦU')} ? 'Âm đầu ' : (${#strings.contains(lesson.title, 'CUỐI')} ? 'Âm cuối ' : 'Vần '),
                                pathExamples=${lesson.pathExampleLabels}
                             " class="lesson-card"
                        th:classappend="${lpStatus == 'done'} ? 'is-done' : (${lpStatus == 'active'} ? 'is-active' : '')">

                        <span class="lesson-badge" th:text="'Bài ' + ${lesson.displayOrder}">Bài 1</span>

                        <div class="lesson-card-top">
                            <div class="lesson-card-icon"><i class="fa-solid fa-book-open" aria-hidden="true"></i></div>
                            <h3 class="lesson-card-title" th:text="'Bài ' + ${lesson.displayOrder}">Bài 1</h3>
                            <p class="lesson-card-rules" th:text="${typePrefix} + ${rulesSummary}">Âm đầu C • K • QU</p>
                        </div>

                        <p class="lesson-card-desc">
                            <span class="lesson-card-desc-intro" th:text="${lesson.pathDescriptionIntro}">
                                Học cách chuyển âm cuối C, CH và P sang Onyomi qua các từ Hán Việt như:
                            </span>
                            <span class="lesson-card-examples" th:if="${!#lists.isEmpty(pathExamples)}">
                                <span class="lesson-card-example" th:each="example, exampleStat : ${pathExamples}"
                                    th:text="${example + (exampleStat.last ? '.' : '')}">
                                    Quốc (国)
                                </span>
                            </span>
                        </p>

                        <!-- Progress & Status -->
                        <div class="lesson-status-row">
                            <div class="lesson-status active" th:if="${lpStatus == 'active'}">
                                <i class="fa-solid fa-play" aria-hidden="true"></i> Đang học
                            </div>
                            <div class="lesson-status done" th:if="${lpStatus == 'done'}">
                                <i class="fa-solid fa-circle-check" aria-hidden="true"></i> Hoàn thành
                            </div>
                            <div class="lesson-progress-bar" th:if="${lpStatus != 'new'}">
                                <div class="lesson-progress-fill" th:style="'width:' + ${lpPct} + '%'"></div>
                            </div>
                            <div class="lesson-progress-pct" th:if="${lpStatus != 'new'}"
                                th:text="${#numbers.formatDecimal(lpPct, 0, 0)} + '%'">80%</div>
                        </div>

                        <a th:href="@{'/learning/lesson/' + ${lesson.id}}" class="lesson-cta"
                            th:classappend="${lpStatus == 'new'} ? '' : (${lpStatus == 'done'} ? 'outline' : '')">
                            <span
                                th:text="${lpStatus == 'new'} ? 'Bắt đầu học' : (${lpStatus == 'done'} ? 'Xem lại' : 'Tiếp tục')">Bắt
                                đầu học</span>
                        </a>
                    </article>
                </div>

                <!-- Thi tổng kết -->
                <div class="final-quiz-wrap">
                    <a th:href="@{'/learning/quiz/final/' + ${prog.category.id}}" class="final-quiz-btn active">
                        <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
                        <span th:text="'Thi tổng kết ' + ${prog.category.name}">Thi tổng kết</span>
                    </a>
                </div>

            </th:block>
        </section>
    </main>

    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/jlab-base-shell.js}"></script>
</body>

</html>
