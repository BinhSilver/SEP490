<!DOCTYPE html>
<html id="jlabBaseDocument" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: standard('Lộ trình học cá nhân - JLAS', 'learning-path')}"></head>
<body id="jlabBasePage" class="app-body learning-path-body">
<div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent" class="learning-path-page">
    <div class="lp-page-shell">
        <nav class="lp-breadcrumb" aria-label="Breadcrumb">
            <a th:href="@{/}">Học tập</a>
            <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
            <span aria-current="page">Lộ trình của tôi</span>
        </nav>

        <section id="missionSummaryRoot" class="ms-root" aria-live="polite"></section>

        <div id="learningPathRoot" class="lp-root" aria-live="polite" aria-busy="true">
            <section class="lp-state lp-state--loading" role="status">
                <span class="lp-spinner" aria-hidden="true"></span>
                <h1>Đang tải lộ trình</h1>
                <p>JLAS đang chuẩn bị hành trình học của bạn.</p>
            </section>
        </div>
    </div>
</main>

<script th:src="@{/js/pages/learning-path.js}"></script>
<script th:src="@{/js/pages/mission-summary.js}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
