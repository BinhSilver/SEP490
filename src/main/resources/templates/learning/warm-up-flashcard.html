<!DOCTYPE html>
<html id="jlabBaseDocument" lang="vi" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
  <script>try{var t=localStorage.getItem('jlas-theme');document.documentElement.setAttribute('data-theme',(t==='dark'||t==='light')?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));}catch(e){document.documentElement.setAttribute('data-theme','light');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn tập Kanji &amp; Từ vựng — JLAS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block"
    rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/theme-bridge.css}" />
  <link rel="stylesheet" th:href="@{/css/base.css}" />
  <link rel="stylesheet" th:href="@{/css/layout.css}" />
  <link rel="stylesheet" th:href="@{/css/sakura-background.css}" />
  <link rel="stylesheet" th:href="@{/css/components/buttons.css}" />
  <link rel="stylesheet" th:href="@{/css/components/cards.css}" />
  <link rel="stylesheet" th:href="@{/css/components/inputs.css}" />
  <link rel="stylesheet" th:href="@{/css/components/forms.css}" />
  <link rel="stylesheet" th:href="@{/css/components/toast.css}" />
  <link rel="stylesheet" th:href="@{/flashcard/flashcard-ui.css}" />
  <link rel="stylesheet" th:href="@{/flashcard/study-theme.css}" />
  <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}" />
  <link rel="stylesheet" th:href="@{/css/pages/learning-journey.css}" />
  <link rel="icon" th:href="@{/images/jlab.png}" type="image/png" />
  <style>
    /* [JLAS-W0108] Layout riêng cho màn ôn tập warm-up (tái dùng flip-card + study-theme). */
    .learning-warmup-page { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    .wu-breadcrumb { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--text-muted, #6b7280); margin-bottom: 20px; }
    .wu-breadcrumb a { color: inherit; text-decoration: none; }
    .wu-breadcrumb a:hover { color: var(--brand, #7c3aed); }
    .wu-loading { text-align: center; padding: 64px 16px; }
    .wu-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .wu-title { font-size: 22px; font-weight: 700; margin: 0; }
    .wu-progress-label { font-size: 14px; color: var(--text-muted, #6b7280); font-variant-numeric: tabular-nums; }
    .wu-progress { height: 6px; border-radius: 999px; background: var(--surface-muted, #e5e7eb); overflow: hidden; margin-bottom: 24px; }
    .wu-progress > span { display: block; height: 100%; width: 0; background: var(--brand, #7c3aed); transition: width .25s ease; }
    .wu-back { text-align: center; }
    .wu-back__reading { font-size: 28px; font-weight: 700; color: var(--text, #111827); margin-bottom: 8px; }
    .wu-back__meaning { font-size: 18px; color: var(--text, #1f2937); }
    .wu-back__hanviet { font-size: 14px; color: var(--text-muted, #6b7280); margin-top: 8px; }
    .wu-stage .study-actions { margin-top: 24px; }
    .wu-complete { text-align: center; padding: 40px 16px; }
    .wu-complete__inner { padding: 32px 24px; }
    .wu-complete h2 { margin: 0 0 8px; font-size: 24px; }
    .wu-complete p { color: var(--text-muted, #6b7280); margin-bottom: 24px; }
    .wu-complete__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>

<body id="jlabBasePage" class="app-body learning-warmup-body journey-ui" th:attr="data-set-id=${setId}">
<div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent" class="learning-warmup-page">
  <nav class="wu-breadcrumb" aria-label="Breadcrumb">
    <a th:href="@{/learning/path}">Lộ trình của tôi</a>
    <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
    <span aria-current="page">Ôn tập Kanji &amp; Từ vựng</span>
  </nav>

  <div class="wu-loading" id="wu-loading" role="status">
    <span class="lp-spinner" aria-hidden="true"></span>
    <p>Đang chuẩn bị thẻ ôn tập…</p>
  </div>

  <section class="wu-stage" id="wu-stage" hidden>
    <div class="wu-top">
      <h1 class="wu-title">Ôn tập Kanji &amp; Từ vựng</h1>
      <span class="wu-progress-label" id="wu-progress-label">1 / 0</span>
    </div>
    <div class="wu-progress" aria-hidden="true"><span id="wu-progress-fill"></span></div>

    <div class="flip-card" id="wu-flip-card" tabindex="0" role="button" aria-label="Lật thẻ">
      <div class="flip-card__inner" id="wu-flip-inner">
        <div class="flip-card__face flip-card__front">
          <div class="flip-label">Mặt trước</div>
          <div class="flip-text" id="wu-face-front"></div>
        </div>
        <div class="flip-card__face flip-card__back">
          <div class="flip-label">Mặt sau</div>
          <div class="wu-back" id="wu-face-back"></div>
        </div>
      </div>
    </div>

    <div class="study-actions">
      <div class="study-browse-actions">
        <button type="button" class="btn btn-wrong" id="wu-not-remembered" aria-label="Chưa thuộc" title="Chưa thuộc"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        <button type="button" class="btn btn-ghost" id="wu-flip" aria-label="Lật thẻ" title="Lật thẻ"><i class="fa-solid fa-rotate" aria-hidden="true"></i> Lật</button>
        <button type="button" class="btn btn-correct" id="wu-remembered" aria-label="Đã nhớ" title="Đã nhớ"><i class="fa-solid fa-check" aria-hidden="true"></i></button>
      </div>
    </div>
    <p id="wu-save-status" role="status" aria-live="polite">Lật thẻ trước khi đánh dấu đã nhớ hoặc chưa thuộc.</p>
    <a class="btn btn-ghost" th:href="@{/learning/path}">Lưu và quay lại lộ trình</a>
  </section>

  <section class="wu-complete" id="wu-complete" hidden>
    <div class="wu-complete__inner card">
      <h2>Đã hoàn thành ôn tập flashcard!</h2>
      <p id="wu-complete-summary"></p>
      <div class="wu-complete__actions">
        <button type="button" class="btn btn-primary" id="wu-review-again"><i class="fa-solid fa-rotate" aria-hidden="true"></i> Ôn lại thẻ</button>
        <a class="btn btn-ghost" th:href="@{/learning/path}">Quay lại lộ trình</a>
      </div>
    </div>
  </section>
</main>

<script th:src="@{/js/auth-session.js}"></script>
<script th:src="@{/js/components.js}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
<script th:src="@{/flashcard/js/api-client.js}"></script>
<script th:src="@{/js/pages/warm-up-flashcard.js}"></script>
</body>
</html>
