<!DOCTYPE html>
<html id="jlabBaseDocument" class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: standard('Sổ tay của tôi - JLAS', 'weakness-notebook')}"></head>
<body id="jlabBasePage" class="app-body">
<div id="jlabBaseShellMount"></div>
<main class="wn-page" id="notebookApp">
    <section id="notebookBrowse">
        <a class="wn-back" href="/learning/path">← Lộ trình học</a>
        <header class="wn-heading"><span class="wn-book" aria-hidden="true">▤</span><div><h1>Sổ tay của tôi</h1><p>Nhìn lại điểm yếu. Ôn từng chút, nhớ lâu hơn.</p></div><button id="notebookSync" class="wn-button wn-outline" type="button">↻ Cập nhật từ Smart Test</button></header>
        <section class="wn-progress" aria-label="Tiến độ ôn tập">
            <div class="wn-row"><h2>Tiến độ ôn tập <span id="notebookTotal"></span></h2><span class="wn-muted">Từ kết quả Smart Test</span></div>
            <button id="notebookStudy" type="button" class="wn-button wn-primary" disabled>▱ Ôn bằng thẻ</button>
            <div class="wn-bar" id="notebookProgress" role="progressbar" aria-label="Đã ôn" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
            <div class="wn-legend" id="notebookStats"></div>
            <p id="notebookReadiness" class="wn-readiness"></p>
        </section>
        <nav id="notebookSkills" class="wn-tabs" aria-label="Kỹ năng"></nav>
        <form id="notebookFilters" class="wn-filters" role="search">
            <label class="wn-search"><span class="wn-sr">Tìm trong sổ tay</span><input id="notebookQuery" type="search" maxlength="200" placeholder="Tìm từ, mẫu ngữ pháp, nội dung…"></label>
            <label><span class="wn-sr">Cấp độ</span><select id="notebookLevel"><option value="">Tất cả cấp độ</option>N5</option><option>N4</option><option>N3</option><option>N2</option><option>N1</option></select></label>
            <label><span class="wn-sr">Trạng thái</span><select id="notebookStatus"><option value="">Tất cả trạng thái</option><option value="OPEN">Cần ôn</option><option value="REVIEWED">Đã ôn</option><option value="MASTERED">Thành thạo</option></select></label>
            <label><span class="wn-sr">Sắp xếp</span><select id="notebookSort"><option value="recent">Mới nhất</option><option value="wrong">Sai nhiều nhất</option><option value="accuracy">Độ chính xác thấp nhất</option></select></label>
        </form>
        <p id="notebookNotice" class="wn-notice" role="status" hidden></p>
        <div class="wn-row wn-list-label"><h2>NỘI DUNG CẦN NHỚ</h2><span id="notebookResultCount"></span></div>
        <section id="notebookEntries" aria-label="Nội dung sổ tay" aria-busy="true"></section>
        <nav class="wn-pagination" aria-label="Phân trang"><button id="notebookPrev" type="button" class="wn-button wn-outline">← Trước</button><span id="notebookPage"></span><button id="notebookNext" type="button" class="wn-button wn-outline">Sau →</button></nav>
    </section>
    <section id="notebookReview" class="wn-review" hidden aria-label="Ôn bằng thẻ">
        <header class="wn-row"><button id="notebookExit" type="button" class="wn-button wn-outline">← Về sổ tay</button><h2>SỔ TAY CỦA TÔI</h2><span id="notebookReviewCounter"></span></header>
        <div class="wn-bar"><i id="notebookReviewBar"></i></div>
        <button id="notebookCard" class="wn-flashcard" type="button" aria-label="Lật thẻ"></button>
        <p id="notebookReviewNotice" class="wn-notice" role="status" hidden></p>
        <div id="notebookReviewActions" class="wn-review-actions" hidden><button id="notebookAgain" type="button" class="wn-button wn-outline">Cần ôn thêm</button><button id="notebookRemembered" type="button" class="wn-button wn-primary">Đã ôn thẻ này</button></div>
        <p class="wn-muted wn-center">Đã ôn là ghi nhận của bạn; mức thành thạo được xác định qua bài đánh giá.</p>
    </section>
</main>
<script th:src="@{/js/jlab-base-shell.js?v=8}"></script>
<script th:src="@{/js/pages/weakness-notebook.js?v=1}"></script>
</body>
</html>
