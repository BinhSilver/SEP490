<!DOCTYPE html>
<html id="jlabBaseDocument" class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: standard('Sổ tay của tôi - KotsuKotsu', 'weakness-notebook')}"></head>
<body id="jlabBasePage" class="app-body jlas-ui-owned">
<div id="jlabBaseShellMount"></div>
<main id="notebookApp" class="notebook-page" data-inline-dictionary>
    <section id="notebookOverview" aria-labelledby="notebookHeading">
        <header class="notebook-heading">
            <div><h1 id="notebookHeading">Sổ tay của tôi</h1><p>Quản lý các từ đã lưu</p></div>
            <button id="notebookCreate" class="notebook-primary" type="button">＋ Tạo sổ tay</button>
        </header>
        <p id="notebookNotice" class="notebook-notice" role="status" hidden></p>
        <div id="notebookBooks" class="notebook-books" aria-label="Danh sách sổ tay" aria-busy="true"></div>
    </section>

    <section id="notebookDetail" hidden aria-labelledby="notebookTitle">
        <header class="notebook-detail-heading">
            <span class="notebook-detail-icon material-symbols-outlined" aria-hidden="true">menu_book</span>
            <div class="notebook-detail-title"><h1 id="notebookTitle"></h1><p id="notebookTotal"></p></div>
            <div id="notebookManage" class="notebook-manage" hidden>
                <button id="notebookChooseFlashcards" type="button" aria-controls="notebookFlashcardToolbar" aria-expanded="false" hidden>Tạo flashcard</button>
                <button id="notebookRename" type="button" aria-label="Đổi tên sổ tay" title="Đổi tên sổ tay"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4L16.5 3.5Z"/></svg></button>
                <button id="notebookDelete" type="button" aria-label="Xóa sổ tay" title="Xóa sổ tay"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button>
            </div>
        </header>
        <div id="notebookFlashcardToolbar" class="notebook-flashcard-toolbar" role="group" aria-label="Tạo flashcard từ sổ tay" hidden>
            <div class="notebook-selection-tools">
                <span id="notebookSelectedCount" role="status" aria-live="polite">Chưa chọn từ</span>
                <button id="notebookSelectWords" type="button">Chọn tất cả từ</button>
                <button id="notebookClearSelection" type="button" disabled hidden>Bỏ chọn</button>
            </div>
            <div class="notebook-selection-actions">
                <button id="notebookCancelSelection" type="button">Hủy</button>
                <button id="notebookCreateFlashcards" class="notebook-primary" type="button" disabled>Tạo bộ thẻ</button>
            </div>
        </div>
        <div class="notebook-vocabulary-heading"><div class="notebook-sort"><button id="notebookSortToggle" type="button" aria-label="Sắp xếp nội dung đã lưu" aria-haspopup="true" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/></svg><span id="notebookSortLabel">Mới nhất</span><svg class="notebook-sort-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div id="notebookSortMenu" class="notebook-sort-menu" hidden><button type="button" data-sort="newest" aria-pressed="true">Mới nhất</button><button type="button" data-sort="oldest" aria-pressed="false">Cũ nhất</button></div></div></div>
        <label class="notebook-search"><span class="notebook-sr">Tìm trong sổ tay</span><input id="notebookQuery" type="search" maxlength="200" placeholder="Tìm từ, cách đọc hoặc nghĩa…"></label>
        <p id="notebookDetailNotice" class="notebook-notice" role="status" hidden></p>
        <div id="notebookEntries" class="notebook-entries" aria-live="polite" aria-busy="false"></div>

    </section>

    <dialog id="notebookCreateDialog" class="notebook-dialog" aria-labelledby="notebookDialogTitle">
        <form id="notebookCreateForm">
            <h2 id="notebookDialogTitle">Tạo sổ tay mới</h2>
            <label for="notebookName">Tên sổ tay</label>
            <input id="notebookName" name="name" maxlength="120" required autocomplete="off" placeholder="Ví dụ: Từ vựng N3">
            <p id="notebookCreateNotice" class="notebook-notice" role="alert" hidden></p>
            <div class="notebook-dialog-actions"><button id="notebookCancel" type="button">Hủy</button><button id="notebookSubmit" class="notebook-primary" type="submit">Tạo sổ tay</button></div>
        </form>
    </dialog>
    <dialog id="notebookManageDialog" class="notebook-dialog" aria-labelledby="notebookManageTitle">
        <form id="notebookManageForm">
            <h2 id="notebookManageTitle">Đổi tên sổ tay</h2>
            <label for="notebookManageName">Tên sổ tay</label>
            <input id="notebookManageName" maxlength="120" required autocomplete="off">
            <p id="notebookManageNotice" class="notebook-notice" role="alert" hidden></p>
            <div class="notebook-dialog-actions"><button id="notebookManageCancel" type="button">Hủy</button><button id="notebookManageSubmit" class="notebook-primary" type="submit">Lưu tên</button></div>
        </form>
    </dialog>
    <dialog id="notebookDeleteDialog" class="notebook-dialog" aria-labelledby="notebookDeleteTitle">
        <h2 id="notebookDeleteTitle">Xóa sổ tay?</h2>
        <p id="notebookDeleteMessage"></p>
        <p id="notebookDeleteNotice" class="notebook-notice" role="alert" hidden></p>
        <div class="notebook-dialog-actions"><button id="notebookDeleteCancel" type="button">Hủy</button><button id="notebookDeleteConfirm" class="notebook-primary" type="button">Xóa sổ tay</button></div>
    </dialog>
</main>
<script th:src="@{/js/jlab-base-shell.js?v=20261119-nav-deploy}"></script>
<script th:src="@{/js/pages/notebook-flashcards.js(v=20261119-unified-polish)}"></script>
<script th:src="@{/js/pages/weakness-notebook.js(v=20261119-compact-selection)}"></script>
</body>
</html>
