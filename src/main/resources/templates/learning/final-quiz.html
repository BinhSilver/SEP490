<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <title>Kiểm tra cuối phần</title>
    <style>
        :root {
            --primary: #0058be;
            --secondary: #2170e4;
            --surface-base: #f8f9ff;
            --text: #0b1c30;
        }

        body {
            font-family: var(--font-body, 'Inter', system-ui, sans-serif);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .quiz-item {
            background: white;
            padding: 30px;
            border-radius: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .q-text {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #eee;
            font-size: 16px;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 20px;
            cursor: pointer;
            margin-top: 40px;
        }

        #scoreBoard {
            display: none;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        }

        .score-val {
            font-size: 64px;
            color: var(--primary);
            font-weight: 700;
        }

        #finalQuizKitsu {
            margin-bottom: 22px;
            text-align: left;
        }
    </style>
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/components/kitsu-guide.css}" />
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png" />
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}" />
</head>

<body id="jlabBasePage">

    <div id="jlabBaseShellMount"></div>
    <main id="jlabBaseContent" class="container">
        <h1 style="text-align: center; color: var(--primary); margin-bottom: 40px;">Kiểm tra tổng kết</h1>

        <div id="quizForm">
            <div th:each="q, stat : ${questions}" class="quiz-item" th:data-answer="${q.correctAnswerText}">
                <div class="q-text" th:text="${stat.count} + '. ' + ${q.questionText}">1. Câu hỏi?
                </div>
                <input type="text" placeholder="Nhập đáp án..." class="user-answer">
            </div>
            <button class="btn-submit" onclick="submitFinal()">Nộp bài</button>
        </div>

        <div id="scoreBoard">
            <div id="finalQuizKitsu">
                <div th:replace="~{fragments/components/kitsu-guide :: guide(
                    'Kitsu-chan đã xem kết quả',
                    'Hoàn thành bài kiểm tra đã là một bước tiến. Cùng xem phần nào cần luyện thêm nhé!')}"></div>
            </div>
            <h2>Kết quả của bạn</h2>
            <div class="score-val" id="finalScore">0/10</div>
            <p id="feedback"></p>
            <a href="/learning"
                style="display: inline-block; margin-top: 20px; color: var(--primary); text-decoration: none; font-weight: 600;">Quay
                lại trang chủ</a>
        </div>
    </main>

    <script>
        function submitFinal() {
            const items = document.querySelectorAll('.quiz-item');
            let score = 0;
            items.forEach(item => {
                const correct = item.getAttribute('data-answer').toLowerCase();
                const user = item.querySelector('.user-answer').value.trim().toLowerCase();
                if (user === correct) {
                    score++;
                    item.style.borderColor = "#4caf50";
                } else {
                    item.style.borderColor = "#f44336";
                    const correctLabel = document.createElement('div');
                    correctLabel.innerText = "Đáp án đúng: " + correct.toUpperCase();
                    correctLabel.style.color = "#d32f2f";
                    correctLabel.style.marginTop = "10px";
                    item.appendChild(correctLabel);
                }
            });

            document.getElementById('quizForm').style.display = "none";
            document.getElementById('scoreBoard').style.display = "block";
            document.getElementById('finalScore').innerText = score + "/" + items.length;

            if (score >= items.length * 0.8) {
                document.getElementById('feedback').innerText = "Tuyệt vời! Bạn đã nắm vững kiến thức! 🎊";
                document.querySelector('#finalQuizKitsu .kitsu-guide__title').textContent = 'Kitsu-chan chúc mừng!';
                document.querySelector('#finalQuizKitsu .kitsu-guide__message').textContent =
                    'Bạn đã hoàn thành rất tốt. Hãy giữ nhịp học này để chinh phục phần tiếp theo!';
            } else {
                document.getElementById('feedback').innerText = "Hãy ôn tập lại thêm một chút nhé! 💪";
                document.querySelector('#finalQuizKitsu .kitsu-guide__title').textContent = 'Kitsu-chan vẫn ở đây';
                document.querySelector('#finalQuizKitsu .kitsu-guide__message').textContent =
                    'Hãy xem lại những câu chưa đúng rồi thử lại. Mỗi lần luyện là một lần tiến bộ!';
            }
        }
    </script>
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/jlab-base-shell.js}"></script>
</body>

</html>
