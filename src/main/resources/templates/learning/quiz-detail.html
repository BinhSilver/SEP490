<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <title>Luyện tập quy tắc</title>
    <style>
        :root {
            --primary: #4f378a;
            --secondary: #6750a4;
            --surface-base: #f8f9ff;
            --text: #0b1c30;
        }

        body {
            font-family: var(--font-body, 'Inter', system-ui, sans-serif);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .quiz-container {
            max-width: 600px;
            width: 100%;
        }

        .quiz-card {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            display: none;
        }

        .quiz-card.active {
            display: block;
        }

        .question {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .kanji-highlight {
            font-size: 32px;
            color: var(--primary);
            margin: 10px 0;
            display: block;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            background: white;
            text-align: left;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #fdfaff;
        }

        .option-btn.correct {
            background: #dcfce7;
            border-color: #16a34a;
            color: #166534;
        }

        .option-btn.wrong {
            background: #fee2e2;
            border-color: #dc2626;
            color: #991b1b;
        }

        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 16px;
            display: none;
        }

        .explanation.visible {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        .nav-btns {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-secondary {
            background: #64748b;
        }

        #quizKitsuTip {
            margin: 0 0 20px;
        }
    </style>
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/components/kitsu-guide.css}" />
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png" />
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}" />
</head>

<body id="jlabBasePage">

    <div id="jlabBaseShellMount"></div>
    <main id="jlabBaseContent" class="quiz-container">
        <h1 th:text="'Luyện tập: ' + ${rule.sourceSound} + '  ' + ${rule.targetSound}">Trắc nghiệm</h1>
        <aside id="quizKitsuTip">
            <div th:replace="~{fragments/components/kitsu-guide :: guide(
                'Mẹo từ Kitsu-chan',
                'Tập trung vào cách đọc đúng của rule đang học. Các đáp án còn lại chỉ là âm gần giống để giúp bạn phân biệt.')}"></div>
        </aside>

        <div th:each="item, stat : ${quizItems}" th:classappend="${stat.first} ? 'active' : ''" class="quiz-card"
            th:id="'quiz-' + ${stat.index}">
            <div class="question" th:text="'Câu ' + (${stat.index} + 1) + ': ' + ${item.questionText}">Câu hỏi</div>
            <span class="kanji-highlight" th:text="${item.kanji}">漢字</span>

            <div class="options">
                <button class="option-btn"
                    th:onclick="checkAnswer(this, 'A', [[${item.correctAnswer}]], [[${stat.index}]])"
                    th:text="'A. ' + ${item.optionA}">Lựa chọn A</button>
                <button class="option-btn"
                    th:onclick="checkAnswer(this, 'B', [[${item.correctAnswer}]], [[${stat.index}]])"
                    th:text="'B. ' + ${item.optionB}">Lựa chọn B</button>
                <button class="option-btn"
                    th:onclick="checkAnswer(this, 'C', [[${item.correctAnswer}]], [[${stat.index}]])"
                    th:text="'C. ' + ${item.optionC}">Lựa chọn C</button>
                <button class="option-btn"
                    th:onclick="checkAnswer(this, 'D', [[${item.correctAnswer}]], [[${stat.index}]])"
                    th:text="'D. ' + ${item.optionD}">Lựa chọn D</button>
            </div>

            <div class="explanation" th:id="'exp-' + ${stat.index}">
                <h4 style="margin-top: 0;">Đáp án chính xác: <span th:text="${item.correctAnswer}">A</span></h4>
                <p><strong>Cách đọc:</strong> <span th:text="${item.romaji}">romaji</span></p>
                <div th:utext="${item.explanation}">Table</div>
                <p><strong>Ghép:</strong> <span th:text="${item.ghép}">ghép</span></p>
                <p><strong>Nghĩa:</strong> <span th:text="${item.nghĩa}">nghĩa</span></p>
            </div>
        </div>

        <div class="nav-btns">
            <button class="btn btn-secondary" onclick="prevQuiz()">Câu trước</button>
            <button class="btn" id="next-btn" onclick="nextQuiz()">Câu tiếp theo</button>
            <a th:href="@{'/learning/lesson/' + ${rule.lesson.id}}" class="btn btn-secondary" id="finish-btn"
                style="display: none;">Xong</a>
        </div>
    </main>

    <script th:inline="javascript">
        let currentIndex = 0;
        const total = [[${ quizItems.size() }]];

        function checkAnswer(btn, choice, correct, index) {
            const card = document.getElementById('quiz-' + index);
            const buttons = card.querySelectorAll('.option-btn');
            const exp = document.getElementById('exp-' + index);

            buttons.forEach(b => b.disabled = true);

            if (choice === correct) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('wrong');
                buttons.forEach(b => {
                    if (b.innerText.startsWith(correct + '.')) {
                        b.classList.add('correct');
                    }
                });
            }

            exp.classList.add('visible');
        }

        function nextQuiz() {
            if (currentIndex < total - 1) {
                document.getElementById('quiz-' + currentIndex).classList.remove('active');
                currentIndex++;
                document.getElementById('quiz-' + currentIndex).classList.add('active');
                updateBtns();
            }
        }

        function prevQuiz() {
            if (currentIndex > 0) {
                document.getElementById('quiz-' + currentIndex).classList.remove('active');
                currentIndex--;
                document.getElementById('quiz-' + currentIndex).classList.add('active');
                updateBtns();
            }
        }

        function updateBtns() {
            document.getElementById('next-btn').style.display = (currentIndex === total - 1) ? 'none' : 'inline-block';
            document.getElementById('finish-btn').style.display = (currentIndex === total - 1) ? 'inline-block' : 'none';
        }

        updateBtns();
    </script>
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/jlab-base-shell.js}"></script>
</body>

</html>
