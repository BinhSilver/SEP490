<!DOCTYPE html>
<html id="jlabBaseDocument" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: standard('Luyện Đọc/Nghe hiểu - JLAS', 'interactive-study')}"></head>
<body id="jlabBasePage" class="app-body ilp-body">
<link rel="stylesheet" th:href="@{/css/pages/interactive-comprehension-study.css}" />
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent" class="ilp-page ilp-study-page">
    <nav class="ilp-breadcrumb" aria-label="Breadcrumb">
        <span class="ilp-system">// SYSTEM</span><span>/</span><span>Học tập</span><span>/</span>
        <a href="/learning/path/v2">Lộ trình cá nhân</a><span>/</span>
        <strong aria-current="page" th:text="${comprehensionKind == 'listening'} ? 'Nghe hiểu' : 'Đọc hiểu'">Đọc hiểu</strong>
    </nav>
    <div id="interactiveComprehensionStudyRoot" aria-live="polite" aria-busy="true">
        <section class="ilp-state" role="status"><span class="ilp-loader" aria-hidden="true"></span>
            <h1 th:text="${comprehensionKind == 'listening'} ? 'Đang tải phần Nghe hiểu' : 'Đang tải phần Đọc hiểu'">Đang tải</h1>
            <p>J-LAS đang chuẩn bị bài tập cho bạn.</p></section>
    </div>
</main>
<script th:src="@{/js/pages/interactive-comprehension-study.js}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
