<!DOCTYPE html>
<html id="jlabBaseDocument" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: standard('Bài kiểm tra - KotsuKotsu', 'lesson-quiz')}"></head>
<body id="jlabBasePage" class="app-body lesson-quiz-body journey-ui">
<div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent" class="lesson-quiz-page">
    <a class="jp-back" th:href="@{/learning}"><svg class="jp-back__icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Quay về Lộ trình học</span></a>

    <div id="lessonQuizRoot"
         class="lq-root"
         aria-live="polite"
         aria-busy="true"
         th:attr="data-quiz-mode=${quizMode}, data-lesson-id=${quizLessonId}, data-grammar-point-id=${quizGrammarPointId}, data-stage-id=${quizStageId}">
        <section class="lq-state lq-state--loading" role="status">
            <span class="lq-spinner" aria-hidden="true"></span>
            <h1>Đang tải bài kiểm tra</h1>
            <p>KotsuKotsu đang chuẩn bị câu hỏi cho bạn.</p>
        </section>
    </div>
</main>

<script th:src="@{/js/pages/lesson-quiz.js}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
