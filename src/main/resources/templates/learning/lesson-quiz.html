<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: standard(${pageTitle}, 'learning-quiz')}"></head>
<body id="jlabBasePage" class="app-body learning-quiz-body">
<div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent" class="learning-quiz-page">
    <div class="lq-page-shell">
        <nav class="lq-breadcrumb" aria-label="Breadcrumb">
            <a th:href="@{/}">Học tập</a>
            <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
            <a th:href="@{/learning/path}">Lộ trình của tôi</a>
            <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
            <a th:href="@{/learning/lesson/{id}(id=${lesson.id})}" th:text="${lesson.title}">Bài học</a>
            <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
            <span aria-current="page">Quiz</span>
        </nav>

        <header class="lq-hero">
            <span class="lq-eyebrow">
                <span class="material-symbols-outlined" aria-hidden="true">quiz</span>
                <span>Bài kiểm tra cuối bài</span>
            </span>
            <h1 th:text="${lesson.title}">Bài học</h1>
            <p class="lq-hero__desc">Trả lời các câu hỏi để kiểm tra kiến thức vừa học.
                Sau khi nộp bài, bạn sẽ xem được đáp án và giải thích chi tiết.</p>
        </header>

        <section id="lessonQuizRoot" class="lq-root" th:attr="data-lesson-id=${lesson.id}" aria-live="polite">
            <div class="lq-state" role="status">
                <span class="lq-spinner" aria-hidden="true"></span>
                <span>Đang tải bài quiz…</span>
            </div>
        </section>
    </div>
</main>

<script th:src="@{/js/pages/learning-quiz.js}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
