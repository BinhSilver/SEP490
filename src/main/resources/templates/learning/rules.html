<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/tokens.css}"/>
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}"/>
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <title>Tất cả quy tắc - Onyomi</title>
<style>
        :root { --primary: #4f378a; --secondary: #6750a4; --surface-base: #f8f9ff; --text: #0b1c30; }
        body { font-family: var(--font-body, 'Inter', system-ui, sans-serif); color: var(--text); margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { font-family: var(--font-headline, 'Hanken Grotesk', system-ui, sans-serif); text-align: center; color: var(--primary); }
        .category-section { margin-bottom: 40px; }
        .category-title { font-family: var(--font-headline, 'Hanken Grotesk', system-ui, sans-serif); font-size: 24px; color: var(--secondary); border-bottom: 2px solid var(--secondary); padding-bottom: 10px; margin-bottom: 20px; }
        .rules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .rule-card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .rule-conversion { text-align: center; margin-bottom: 16px; }
        .rule-label { font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .rule-sounds { display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--font-mono, 'JetBrains Mono', monospace); font-size: 22px; font-weight: 700; }
        .rule-sounds .src { color: var(--secondary); }
        .rule-sounds .tgt { color: var(--primary); }
        .rule-sounds .arrow { color: #94a3b8; font-size: 18px; }
        .rule-explain { font-size: 13px; color: #475569; margin-bottom: 12px; line-height: 1.5; }
        .example-item { font-size: 14px; margin: 5px 0; color: #555; padding: 6px 10px; background: #f8fafc; border-radius: 6px; }
        .btn-back { display: inline-block; margin-bottom: 20px; text-decoration: none; color: var(--primary); font-weight: 600; }
    </style>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png"/>
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}"/>
</head>
<body id="jlabBasePage">
    <div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent" class="container">
        <a href="/learning/path" class="btn-back">← Quay lại Lộ trình</a>
        <h1>Tổng hợp quy tắc On-yomi</h1>

        <div th:each="category : ${categories}" class="category-section">
            <h2 class="category-title" th:text="${category.name}">Âm đầu</h2>
            <div class="rules-grid">
                <div th:each="lesson : ${category.lessons}">
                    <div th:each="rule : ${lesson.rules}" class="rule-card">
                        <div class="rule-conversion">
                            <span class="rule-label"
                                  th:text="${#strings.contains(category.name, 'đầu')} ? 'Âm đầu Hán Việt  Âm đầu Onyomi' : (${#strings.contains(category.name, 'cuối')} ? 'Âm cuối Hán Việt  Âm cuối Onyomi' : 'Vần Hán Việt  Vần Onyomi')">
                                Âm đầu Hán Việt  Âm đầu Onyomi
                            </span>
                            <div class="rule-sounds">
                                <span class="src" th:text="${rule.sourceSound}">H</span>
                                <span class="arrow"></span>
                                <span class="tgt" th:text="${rule.targetSound}">K/G</span>
                            </div>
                        </div>
                        <p th:if="${rule.explanation != null}" class="rule-explain" th:text="${rule.explanation.title}"></p>
                        <div class="examples">
                            <div th:each="ex : ${rule.examples}" class="example-item">
                                <span th:text="${ex.hv} + '  ' + ${ex.onyomi}">Hải  Kai</span>
                                <span th:if="${ex.kanji}" th:text="' (' + ${ex.kanji} + ')'"> (海)</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
<script th:src="@{/js/auth-session.js}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
