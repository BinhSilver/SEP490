<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <title>Flashcards - Onyomi</title>
    <style>
        :root {
            --primary: #4f378a;
            --secondary: #6750a4;
            --surface-base: #f8f9ff;
            --text: #0b1c30;
        }

        body {
            font-family: var(--font-body, 'Inter', system-ui, sans-serif);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .flashcard {
            width: 400px;
            height: 250px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            perspective: 1000px;
            cursor: pointer;
            position: relative;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
        }

        .card-front {
            background: white;
        }

        .card-back {
            background: var(--primary);
            color: white;
            transform: rotateY(180deg);
        }

        .word {
            font-size: 48px;
            font-weight: 700;
        }

        .onyomi {
            font-size: 36px;
            font-weight: 700;
        }

        .kanji {
            font-size: 64px;
        }

        .hint {
            font-size: 14px;
            color: #888;
            margin-top: 20px;
        }

        .controls {
            position: absolute;
            bottom: -80px;
            width: 100%;
            display: flex;
            justify-content: space-between;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: white;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
    </style>
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png" />
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}" />
</head>

<body id="jlabBasePage">

    <div id="jlabBaseShellMount"></div>
    <main id="jlabBaseContent" style="position: relative;">
        <a href="/learning"
            style="position: absolute; top: -100px; left: 0; color: var(--primary); text-decoration: none; font-weight: 600;">←
            Quay lại</a>

        <div class="flashcard" onclick="this.classList.toggle('flipped')">
            <div class="card-inner">
                <div class="card-front">
                    <div class="word" th:text="${word.wordHv}">Quốc</div>
                    <div class="hint">Nhấn để xem đáp án</div>
                </div>
                <div class="card-back">
                    <div class="kanji" th:text="${word.kanji ?: ''}">国</div>
                    <div class="onyomi" th:text="${word.wordOnyomi}">KOKU</div>
                </div>
            </div>
            <div class="controls">
                <button class="btn" onclick="event.stopPropagation(); window.location.reload();">Tiếp theo </button>
            </div>
        </div>
    </main>
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/jlab-base-shell.js}"></script>
</body>

</html>
