<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<style th:fragment="rule-conversion-styles">
    .rule-hero, .rule-hero-mini {
        background: white;
        border-radius: 12px;
        padding: 10px 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        border: 1px solid #f1f5f9;
    }
    .rule-conversion {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .sound-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 6px 12px;
        border-radius: 10px;
        min-width: 88px;
    }
    .sound-block.source { background: #e9ddff; border: 1px solid #fecdd3; }
    .sound-block.target { background: #e9ddff; border: 1px solid #e9d5ff; }
    .sound-label {
        font-size: 9px;
        color: #64748b;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        text-align: center;
        line-height: 1.3;
        white-space: nowrap;
    }
    .sound-value {
        font-size: 20px;
        font-weight: 800;
        font-family: var(--font-mono, 'JetBrains Mono', monospace);
        line-height: 1.2;
    }
    .sound-block.source .sound-value { color: #6750a4; }
    .sound-block.target .sound-value { color: #4f378a; }
    .arrow-mid {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        flex-shrink: 0;
    }
    .arrow-right { font-size: 18px; color: #94a3b8; font-weight: 700; line-height: 1; }
    .arrow-mid-label { font-size: 8px; color: #94a3b8; font-weight: 600; text-align: center; max-width: 52px; line-height: 1.2; }
    .rule-hero-mini .sound-value { font-size: 17px; }
    .rule-hero-mini .sound-block { padding: 5px 10px; min-width: 76px; }
    .rule-hero-mini .sound-label { font-size: 8px; }
    .rule-hero-mini .arrow-right { font-size: 15px; }
</style>

<th:block th:fragment="rule-conversion-inner (context, sourceSound, targetSound)">
    <div class="rule-conversion">
        <div class="sound-block source">
            <span class="sound-label"
                  th:text="${#strings.contains(context, 'ĐẦU') or #strings.contains(context, 'đầu')} ? 'Âm đầu Hán Việt:' : (${#strings.contains(context, 'CUỐI') or #strings.contains(context, 'cuối')} ? 'Âm cuối Hán Việt:' : 'Vần Hán Việt:')">
                Âm đầu Hán Việt:
            </span>
            <span class="sound-value" th:text="${sourceSound}">C</span>
        </div>
        <div class="arrow-mid">
            <span class="arrow-right"></span>
            <span class="arrow-mid-label">thường thành</span>
        </div>
        <div class="sound-block target">
            <span class="sound-label"
                  th:text="${#strings.contains(context, 'ĐẦU') or #strings.contains(context, 'đầu')} ? 'Âm đầu Onyomi:' : (${#strings.contains(context, 'CUỐI') or #strings.contains(context, 'cuối')} ? 'Âm cuối Onyomi:' : 'Vần Onyomi:')">
                Âm đầu Onyomi:
            </span>
            <span class="sound-value" th:text="${targetSound}">K</span>
        </div>
    </div>
</th:block>

<div th:fragment="rule-conversion (context, sourceSound, targetSound)" class="rule-hero">
    <th:block th:replace="~{learning/fragments/rule-conversion :: rule-conversion-inner(${context}, ${sourceSound}, ${targetSound})}"></th:block>
</div>

<div th:fragment="rule-conversion-compact (context, sourceSound, targetSound)" class="rule-hero rule-hero-mini">
    <th:block th:replace="~{learning/fragments/rule-conversion :: rule-conversion-inner(${context}, ${sourceSound}, ${targetSound})}"></th:block>
</div>

</body>
</html>
