<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/components/retention-live.css?v=20260903-motion}" />
    <title>Trắc nghiệm - Onyomi</title>
    <style>
        :root {
            --primary: #0058be;
            --secondary: #2170e4;
            --surface-base: #f8f9ff;
            --text: #0b1c30;
        }

        body {
            font-family: var(--font-body, 'Inter', system-ui, sans-serif);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .question {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 40px;
            font-family: var(--font-headline, 'Hanken Grotesk', system-ui, sans-serif);
            color: var(--text);
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .option-btn {
            padding: 20px;
            border: 2px solid #eee;
            border-radius: 16px;
            background: white;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            font-size: 20px;
            color: var(--text);
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #fdfaff;
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .option-btn.wrong {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .result-box {
            margin-top: 40px;
            padding: 20px;
            border-radius: 16px;
            font-weight: 700;
            display: none;
        }

        .btn-next {
            display: none;
            margin-top: 30px;
            padding: 15px 40px;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
        }
    </style>
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png" />
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}" />
</head>

<body id="jlabBasePage">

    <div id="jlabBaseShellMount"></div>
    <main id="jlabBaseContent" class="container">
        <div class="glass-card">
            <div class="question" th:text="${question}">Câu hỏi?</div>

            <div class="options">
                <button th:each="opt : ${options}" class="option-btn" th:text="${opt}"
                    th:onclick="checkAnswer(this, [[${correctAnswer}]])"></button>
            </div>

            <div id="resultBox" class="result-box"></div>
            <button id="nextBtn" class="btn-next"
                th:onclick="'window.location.href=\'/learning/lesson/' + ${lesson.id} + '\''">Hoàn tất & Tiếp
                tục</button>
        </div>
    </main>

    <script th:inline="javascript">
        function checkAnswer(btn, correct) {
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => b.disabled = true);

            const isCorrect = btn.innerText === correct;
            const resultBox = document.getElementById('resultBox');

            if (isCorrect) {
                btn.classList.add('correct');
                resultBox.innerText = "Chính xác! Bạn đã học tốt! 🎉";
                resultBox.style.color = "#4caf50";
                resultBox.style.background = "#e8f5e9";
            } else {
                btn.classList.add('wrong');
                resultBox.innerText = "Chưa đúng rồi! Đáp án là: " + correct;
                resultBox.style.color = "#d32f2f";
                resultBox.style.background = "#ffebee";
            }
            resultBox.style.display = "block";
            document.getElementById('nextBtn').style.display = "block";

            // Submit progress
            fetch('/learning/quiz/submit-lesson?lessonId=' + [[${ lesson.id }]] + '&correct=' + (isCorrect ? 1 : 0) + '&total=1', {
                method: 'POST'
            }).then(response => response.json()).then(payload => {
                const reward = payload && payload.data;
                if (payload && payload.success && reward && !reward.alreadyClaimed && window.RetentionReward) {
                    window.RetentionReward.show({
                        points: reward.rewardPoints,
                        balance: reward.creditBalance,
                        missionTitle: 'Hoàn thành một bài Amon'
                    });
                }
            }).catch(() => {});
        }
    </script>
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/components/retention-reward.js?v=20260903-motion}"></script>
    <script th:src="@{/js/jlab-base-shell.js}"></script>
</body>

</html>
