<!DOCTYPE html>
<html class="dark" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: standard('Đăng ký - JLAS', 'register')}"></head>
<body data-mobile-adapt="owned" class="app-body app-body--auth page-register-body">
<div class="register-background" aria-hidden="true"></div>

<main id="jlabBaseContent" class="app-main app-main--auth">
    <div class="app-main--auth-inner register-auth-inner">
        <section class="card register-card" aria-labelledby="registerTitle">
            <div class="card__body">
                <div th:replace="~{fragments/components/alert :: alert('alert')}"></div>

                <div id="stepRegister">
                    <div class="card__header card__header--center">
                        <h1 id="registerTitle" class="card__title">Tạo tài khoản</h1>
                    </div>

                    <form id="registerForm" class="form" novalidate>
                        <div class="field">
                            <label for="fullName" class="field__label">Họ và tên</label>
                            <div class="input-wrap">
                                <i class="fa-regular fa-user input-wrap__icon" aria-hidden="true"></i>
                                <input id="fullName" name="fullName" type="text"
                                       class="input input--with-icon" placeholder="Nguyễn Văn An"
                                       required minlength="2" maxlength="150"
                                       autocomplete="name" aria-describedby="fullNameError"/>
                            </div>
                            <p id="fullNameError" class="field__error" aria-live="polite"></p>
                        </div>

                        <div class="field">
                            <label for="email" class="field__label">Email</label>
                            <div class="input-wrap">
                                <i class="fa-regular fa-envelope input-wrap__icon" aria-hidden="true"></i>
                                <input id="email" name="email" type="email"
                                       class="input input--with-icon" placeholder="jlas@gmail.com"
                                       required maxlength="255" autocomplete="email"
                                       aria-describedby="emailError"/>
                            </div>
                            <p id="emailError" class="field__error" aria-live="polite"></p>
                        </div>

                        <div class="form__grid form__grid--2">
                            <div class="field">
                                <label for="dateOfBirth" class="field__label">Ngày sinh</label>
                                <div class="input-wrap">
                                    <i class="fa-regular fa-calendar input-wrap__icon" aria-hidden="true"></i>
                                    <input id="dateOfBirth" name="dateOfBirth" type="date"
                                           class="input input--with-icon" required min="1900-01-01"
                                           autocomplete="bday" aria-describedby="dateOfBirthError"/>
                                </div>
                                <p id="dateOfBirthError" class="field__error" aria-live="polite"></p>
                            </div>

                            <div class="field">
                                <label for="level" class="field__label">Trình độ tiếng Nhật hiện tại</label>
                                <div class="input-wrap">
                                    <i class="fa-solid fa-graduation-cap input-wrap__icon" aria-hidden="true"></i>
                                    <select id="level" name="level" class="select select--with-icon">
                                        <option value="UNKNOWN">Mình chưa xác định</option>
                                        <option value="N5">N5 — Sơ cấp</option>
                                        <option value="N4">N4 — Cơ bản</option>
                                        <option value="N3">N3 — Trung cấp</option>
                                        <option value="N2">N2 — Trung cao cấp</option>
                                        <option value="N1">N1 — Cao cấp</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="field">
                            <label for="password" class="field__label">Mật khẩu</label>
                            <div class="input-wrap">
                                <i class="fa-solid fa-lock input-wrap__icon" aria-hidden="true"></i>
                                <input id="password" name="password" type="password"
                                       class="input input--with-icon input--with-action"
                                       placeholder="Tạo mật khẩu" required maxlength="100"
                                       autocomplete="new-password"
                                       aria-describedby="passwordRules passwordError"/>
                                <button type="button" class="input-wrap__action password-toggle"
                                        data-password-toggle="password"
                                        aria-label="Hiện mật khẩu" aria-pressed="false">
                                    <i class="fa-regular fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <ul id="passwordRules" class="password-rules" aria-label="Yêu cầu mật khẩu">
                                <li data-password-rule="length"><i class="fa-solid fa-circle" aria-hidden="true"></i> Từ 8 đến 100 ký tự</li>
                                <li data-password-rule="case"><i class="fa-solid fa-circle" aria-hidden="true"></i> Có chữ hoa và chữ thường</li>
                                <li data-password-rule="number"><i class="fa-solid fa-circle" aria-hidden="true"></i> Có ít nhất một chữ số</li>
                                <li data-password-rule="special"><i class="fa-solid fa-circle" aria-hidden="true"></i> Có ít nhất một ký tự đặc biệt</li>
                            </ul>
                            <p id="passwordError" class="field__error" aria-live="polite"></p>
                        </div>

                        <div class="field">
                            <label for="confirmPassword" class="field__label">Xác nhận mật khẩu</label>
                            <div class="input-wrap">
                                <i class="fa-solid fa-shield-halved input-wrap__icon" aria-hidden="true"></i>
                                <input id="confirmPassword" name="confirmPassword" type="password"
                                       class="input input--with-icon input--with-action"
                                       placeholder="Nhập lại mật khẩu" required maxlength="100"
                                       autocomplete="new-password" aria-describedby="confirmPasswordError"/>
                                <button type="button" class="input-wrap__action password-toggle"
                                        data-password-toggle="confirmPassword"
                                        aria-label="Hiện mật khẩu xác nhận" aria-pressed="false">
                                    <i class="fa-regular fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <p id="confirmPasswordError" class="field__error" aria-live="polite"></p>
                        </div>

                        <button id="submitBtn" type="submit" class="btn btn--primary btn--block">
                            <span class="btn__label">Tạo tài khoản</span>
                        </button>
                    </form>

                    <p class="form-footer">
                        Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
                    </p>
                </div>

                <div id="stepOtp" hidden>
                    <div class="otp-heading-icon" aria-hidden="true">
                        <i class="fa-regular fa-envelope-open"></i>
                    </div>
                    <div class="card__header card__header--center">
                        <h2 class="card__title">Xác minh email</h2>
                        <p class="card__subtitle">
                            Nhập mã gồm 6 chữ số vừa được gửi đến
                            <strong id="registeredEmailText" class="otp-email"></strong>.
                        </p>
                    </div>

                    <form id="otpForm" class="form" novalidate>
                        <fieldset class="otp-fieldset">
                            <legend class="field__label">Mã xác minh</legend>
                            <div id="otp" class="otp-inputs" data-otp-inputs>
                                <input type="text" maxlength="1" class="input otp-digit" inputmode="numeric" autocomplete="one-time-code" aria-label="Chữ số OTP thứ 1"/>
                                <input type="text" maxlength="1" class="input otp-digit" inputmode="numeric" aria-label="Chữ số OTP thứ 2"/>
                                <input type="text" maxlength="1" class="input otp-digit" inputmode="numeric" aria-label="Chữ số OTP thứ 3"/>
                                <input type="text" maxlength="1" class="input otp-digit" inputmode="numeric" aria-label="Chữ số OTP thứ 4"/>
                                <input type="text" maxlength="1" class="input otp-digit" inputmode="numeric" aria-label="Chữ số OTP thứ 5"/>
                                <input type="text" maxlength="1" class="input otp-digit" inputmode="numeric" aria-label="Chữ số OTP thứ 6"/>
                            </div>
                            <p id="otpError" class="field__error field__error--center" aria-live="polite"></p>
                        </fieldset>

                        <button id="verifyOtpBtn" type="submit" class="btn btn--primary btn--block">
                            <span class="btn__label">Xác minh và hoàn tất</span>
                            <i class="fa-solid fa-check" aria-hidden="true"></i>
                        </button>
                    </form>

                    <div class="otp-actions">
                        <button id="resendOtpBtn" type="button" class="btn btn--ghost btn--sm">Gửi lại mã</button>
                        <button id="backToRegisterBtn" type="button" class="btn btn--ghost btn--sm">Đổi email</button>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/components/toast :: toast-host}"></div>
<script th:src="@{/js/components.js}"></script>
<script th:src="@{/js/pages/auth-common.js}"></script>
<script th:src="@{/js/components/date-wheel.js?v=20261102-wheel2}"></script>
<script th:src="@{/js/pages/register.js}"></script>
</body>
</html>
