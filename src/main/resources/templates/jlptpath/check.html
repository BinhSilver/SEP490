<!DOCTYPE html>
<html id="jlabBaseDocument" lang="vi" xmlns:th="http://www.thymeleaf.org">
<!-- [JLAS-W0108] Micro-check page (/learning/jlpt/check/{token}); jpath-check.js draws it from
     GET /api/learning/jlpt/checks/{token}. Look up works on the check at every step. -->
<head th:replace="~{fragments/head :: standard('Kiểm tra nhanh - KotsuKotsu', null)}"></head>
<th:block th:replace="~{jlptpath/fragments/jpath :: assets('jpath-check')}"></th:block>
<body id="jlabBasePage" class="app-body jp-body">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent" class="jp-page jp-check-page" data-inline-dictionary data-jpath-auto-furigana>
    <div class="jp-check-topBar jp-page-head">
        <th:block th:replace="~{jlptpath/fragments/jpath :: crumbs('Bài kiểm tra')}"></th:block>
        <script>
            /* QA 27/11 A2: "Quay về" follows ?return= (same-site /learning… only) instead of always the path page */
            (function () {
                var a = document.currentScript && document.currentScript.previousElementSibling;
                var r = null;
                try { r = new URLSearchParams(location.search).get('return'); } catch (e) { r = null; }
                if (a && a.matches && a.matches('a.jp-back') && r && /^\/learning(?:[/?#]|$)/.test(r) && r.indexOf('//') < 0) a.setAttribute('href', r);
            })();
        </script>
        <div class="jp-check-topBar__actions" data-jpath-furi-slot>
            <a class="jp-check-back" href="/learning?view=jlpt" data-check-exit>Quay lại lộ trình</a>
        </div>
    </div>
    <div id="jpathCheckRoot" class="jp-check-root" aria-busy="true"
         th:attr="data-check-token=${checkToken}">
        <p class="jp-status jp-skel jp-skel--lesson" role="status" aria-busy="true"><span class="jp-skel__sr">Đang tải bài kiểm tra…</span><i class="jp-skel__b jp-skel__b--title"></i><i class="jp-skel__b jp-skel__b--short"></i><i class="jp-skel__b jp-skel__b--tall"></i><i class="jp-skel__b jp-skel__b--btn"></i></p>
    </div>
</main>
<th:block th:replace="~{jlptpath/fragments/jpath :: scripts}"></th:block>
<script th:src="@{/js/jlptpath/jpath-display.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlptpath/jpath-dialog.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlptpath/jpath-furigana.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlptpath/jpath-auto-furigana.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlptpath/jpath-check.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlab-base-shell.js(v=20261125-icons-vi)}"></script>
<th:block th:replace="~{fragments/learning-fox :: fox}"></th:block>
</body>
</html>
