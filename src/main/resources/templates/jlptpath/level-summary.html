<!DOCTYPE html>
<html id="jlabBaseDocument" lang="vi" xmlns:th="http://www.thymeleaf.org">
<!-- [JLAS-W0108] Level summary (/learning/jlpt/levels/{level}/summary); jpath-level-summary.js fills it from
     GET /api/learning/jlpt/levels/{level}/summary. -->
<head th:replace="~{fragments/head :: standard('Tổng kết cấp - JLAS', null)}"></head>
<th:block th:replace="~{jlptpath/fragments/jpath :: assets('jpath-side')}"></th:block>
<body id="jlabBasePage" class="app-body jp-body">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent" class="jp-page jp-side" data-inline-dictionary th:attr="data-level=${level}"
      data-jpath-level-summary>
    <header class="jp-side__head">
        <a class="jp-side__back" href="/learning">← Về lộ trình</a>
        <h1 class="jp-side__title" data-role="title">Tổng kết cấp</h1>
    </header>
    <p class="jp-side__status" role="status" data-role="status">Đang tải…</p>
    <div data-role="body"></div>
    <div data-jpath-extra-links></div>
</main>
<th:block th:replace="~{jlptpath/fragments/jpath :: scripts}"></th:block>
<script th:src="@{/js/jlptpath/jpath-level-summary.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
