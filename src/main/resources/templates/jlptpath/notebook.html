<!DOCTYPE html>
<html id="jlabBaseDocument" lang="vi" xmlns:th="http://www.thymeleaf.org">
<!-- [JLAS-W0108] Notebook of the JLPT path; jpath-wordbank.js fills it from GET /api/learning/jlpt/notebook and
     removes a row with DELETE /items/{type}/{code}/notebook. -->
<head th:replace="~{fragments/head :: standard('Sổ tay - KotsuKotsu', null)}"></head>
<th:block th:replace="~{jlptpath/fragments/jpath :: assets('jpath-side')}"></th:block>
<body id="jlabBasePage" class="app-body jp-body">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent" class="jp-page jp-side" data-inline-dictionary data-jpath-wordbank="NOTEBOOK">
<div class="jp-ws jp-ws--norail">
    <th:block th:replace="~{jlptpath/fragments/jpath :: crumbs('Sổ tay')}"></th:block>
    <aside class="jp-ws__side" aria-label="Điều hướng lộ trình">
        <th:block th:replace="~{jlptpath/fragments/jpath :: sidenav('/learning/jlpt/notebook')}"></th:block>
    </aside>
    <div class="jp-ws__main">
        <header class="jp-page-head"><h1 class="jp-page-head__title jp-side__title">Sổ tay</h1></header>
        <!--/* [JLAS-W0108] F121/F126: words here and kanji saved by hand are also copied to the shared path notebook */-->
        <p class="jp-side__note">Từ trong sổ tay này và Kanji bạn tự thêm cũng được lưu vào sổ <strong>Lộ trình học</strong>
            trong <a href="/learning/notebook">Sổ tay của tôi</a>, chung với từ của lộ trình Giao tiếp.</p>
        <p class="jp-side-summary" data-role="summary" aria-live="polite"></p>
        <div class="jp-side__range" role="group" aria-label="Loại mục">
            <button type="button" class="jp-side-btn" data-tab="VOCAB" aria-pressed="true">Từ vựng</button>
            <button type="button" class="jp-side-btn" data-tab="KANJI" aria-pressed="false">Kanji</button>
            <button type="button" class="jp-side-btn" data-tab="GRAMMAR" aria-pressed="false">Ngữ pháp</button>
        </div>
        <!--/* [JLAS-W0108] owner 20/11: review the notebook rows of the open tab (Từ vựng, Kanji or Ngữ pháp) */-->
        <p><button type="button" class="jp-side-btn" data-role="review" hidden>Ôn sổ tay</button></p>
        <label class="jp-side__note">Tìm trong trang hiện tại <input type="search" data-role="search" autocomplete="off"></label>
        <p class="jp-side__status jp-skel jp-skel--list" role="status" data-role="status" aria-busy="true"><span class="jp-skel__sr">Đang tải…</span><i class="jp-skel__b jp-skel__b--title"></i><i class="jp-skel__b jp-skel__b--line"></i><i class="jp-skel__b jp-skel__b--short"></i><i class="jp-skel__grid"><i class="jp-skel__b jp-skel__b--card"></i><i class="jp-skel__b jp-skel__b--card"></i><i class="jp-skel__b jp-skel__b--card"></i><i class="jp-skel__b jp-skel__b--card"></i></i></p>
        <ul class="jp-bank" data-role="rows"></ul>
        <nav class="jp-side__pager" data-role="pager" aria-label="Trang" hidden>
            <button type="button" class="jp-side-btn" data-page="prev">Trước</button>
            <span data-role="page"></span>
            <button type="button" class="jp-side-btn" data-page="next">Sau</button>
        </nav>
    </div>
</div>
</main>
<th:block th:replace="~{jlptpath/fragments/jpath :: scripts}"></th:block>
<script th:src="@{/js/jlptpath/jpath-wordbank.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
