<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- [JLAS-W0108] Shared JLPT path page kit. Every path page (except print.html and admin pages) includes
     assets('<page-css>') right after fragments/head :: standard(...) and scripts before its own page script. -->

<th:block th:fragment="assets(pageCss)">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&amp;display=swap" />
    <link rel="stylesheet" th:href="@{/css/learning-v2-tokens.css(v=${jpathAssetVersion})}" />
    <link rel="stylesheet" th:href="@{/css/pages/jpath-base.css(v=${jpathAssetVersion})}" />
    <link rel="stylesheet" th:href="@{/css/pages/jpath-extras.css(v=${jpathAssetVersion})}" />
    <!-- Workspace layout + navigation kit (breadcrumbs, stepper, progress, flow buttons, pager, accordion, toc). -->
    <link rel="stylesheet" th:href="@{/css/pages/jpath-nav.css(v=${jpathAssetVersion})}" />
    <link th:if="${pageCss != null and !#strings.isEmpty(pageCss)}" rel="stylesheet"
          th:href="@{${'/css/pages/' + pageCss + '.css'}(v=${jpathAssetVersion})}" />
</th:block>

<th:block th:fragment="scripts">
    <!-- fragments/head does not load confirm-dialog.js; path pages use window.JlasConfirm. -->
    <script th:src="@{/js/pages/confirm-dialog.js(v=${jpathAssetVersion})}"></script>
    <script th:src="@{/js/jlptpath/jpath-api.js(v=${jpathAssetVersion})}"></script>
    <!-- F72: recordings become WAV 16 kHz mono in the browser before scoring (no ffmpeg needed on the server). -->
    <script th:src="@{/js/jlptpath/jpath-wav.js(v=${jpathAssetVersion})}"></script>
    <script th:src="@{/js/jlptpath/jpath-nav.js(v=${jpathAssetVersion})}"></script>
    <!-- Extras: "Báo sai" binds every [data-jpath-report] block, also after each 'jpath:rendered'. -->
    <script th:src="@{/js/jlptpath/jpath-report.js(v=${jpathAssetVersion})}"></script>
    <!-- Writing practice: dictionary stroke player + handwriting point helpers, then the path module. -->
    <script th:src="@{/dictionary/js/stroke-order.js}"></script>
    <script th:src="@{/dictionary/js/handwriting-core.js(v=20260920-1)}"></script>
    <script th:src="@{/js/jlptpath/jpath-writing.js(v=${jpathAssetVersion})}"></script>
    <!-- Print: every [data-jpath-print] control opens /learning/jlpt/print in a new tab. -->
    <script th:src="@{/js/jlptpath/jpath-print.js(v=${jpathAssetVersion})}"></script>
    <!-- Look up: a selected grammar pattern shows its card under the dictionary popup (inline-dictionary.js). -->
    <script th:src="@{/js/jlptpath/jpath-lookup.js(v=${jpathAssetVersion})}"></script>
    <!-- Look up, fuller: Hán Việt, every sense, example with sound, near results and words with the same reading. -->
    <script th:src="@{/js/jlptpath/jpath-lookup-rich.js(v=${jpathAssetVersion})}"></script>
    <!-- "Luyện thêm": fills every [data-jpath-extra-links] (path page, done screen) from GET /extra-links. -->
    <script th:src="@{/js/jlptpath/jpath-extra-links.js(v=${jpathAssetVersion})}"></script>
    <!-- [JLAS-W0108] F36/F37: AI giải thích & hỏi đáp câu hỏi đã trả lời trong Lộ trình JLPT + Giao tiếp. -->
    <script th:src="@{/js/jlptpath/jpath-ai-explain.js(v=${jpathAssetVersion})}"></script>
</th:block>


<!-- Side navigation of the path pages; `current` is the href of this page (aria-current). -->
<th:block th:fragment="sidenav(current)">
    <nav class="jp-sidenav" aria-label="Trang của lộ trình">
        <p class="jp-sidenav__title">Lộ trình JLPT</p>
        <a class="jp-sidenav__link" href="/learning" th:attr="aria-current=${current == '/learning'} ? 'page' : null"><svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-route"/></svg>Lộ trình</a>
        <a class="jp-sidenav__link" href="/learning/jlpt/history" th:attr="aria-current=${current == '/learning/jlpt/history'} ? 'page' : null"><svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-history"/></svg>Lịch sử học</a>
        <a class="jp-sidenav__link" href="/learning/jlpt/stats" th:attr="aria-current=${current == '/learning/jlpt/stats'} ? 'page' : null"><svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-chart-no-axes-combined"/></svg>Thống kê</a>
        <a class="jp-sidenav__link" href="/learning/jlpt/known" th:attr="aria-current=${current == '/learning/jlpt/known'} ? 'page' : null"><svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-check"/></svg>Kho đã biết</a>
        <a class="jp-sidenav__link" href="/learning/jlpt/notebook" th:attr="aria-current=${current == '/learning/jlpt/notebook'} ? 'page' : null"><svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-notebook"/></svg>Sổ tay</a>
        <a class="jp-sidenav__link" href="/learning/jlpt/confusables" th:attr="aria-current=${current == '/learning/jlpt/confusables'} ? 'page' : null"><svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-git-compare-arrows"/></svg>Phân biệt dễ nhầm</a>
        <a class="jp-sidenav__link" href="/learning/jlpt/settings" th:attr="aria-current=${current == '/learning/jlpt/settings'} ? 'page' : null"><svg class="jp-i" aria-hidden="true"><use href="/images/icons/jpath-icons.svg#i-settings"/></svg>Cài đặt lộ trình</a>
    </nav>
</th:block>

<!-- Breadcrumbs with a parent page: Trang chủ › Lộ trình JLPT › {parent} › {here}. -->
<th:block th:fragment="crumbsIn(parentLabel, parentHref, here)">
    <nav class="jp-crumbs jp-ws__crumbs" aria-label="Bạn đang ở"><ol class="jp-crumbs__list">
        <li class="jp-crumbs__item"><a class="jp-crumbs__link" href="/">Trang chủ</a></li>
        <li class="jp-crumbs__item"><a class="jp-crumbs__link" href="/learning">Lộ trình JLPT</a></li>
        <li class="jp-crumbs__item"><a class="jp-crumbs__link" th:href="${parentHref}" th:text="${parentLabel}">Mục</a></li>
        <li class="jp-crumbs__item"><span class="jp-crumbs__here" aria-current="page" th:text="${here}">Trang</span></li>
    </ol></nav>
</th:block>

<!-- Breadcrumbs: Trang chủ › Lộ trình JLPT › {here}. -->
<th:block th:fragment="crumbs(here)">
    <nav class="jp-crumbs jp-ws__crumbs" aria-label="Bạn đang ở"><ol class="jp-crumbs__list">
        <li class="jp-crumbs__item"><a class="jp-crumbs__link" href="/">Trang chủ</a></li>
        <li class="jp-crumbs__item"><a class="jp-crumbs__link" href="/learning">Lộ trình JLPT</a></li>
        <li class="jp-crumbs__item"><span class="jp-crumbs__here" aria-current="page" th:text="${here}">Trang</span></li>
    </ol></nav>
</th:block>

</html>
