<!DOCTYPE html>
<html id="jlabBaseDocument" lang="vi" xmlns:th="http://www.thymeleaf.org">
<!-- [JLAS-W0108] Skill session page (/learning/jlpt/skills/session/{id}): jpath-skill-session.js draws the lesson, the
     practice sets and (Listening) the dictation from GET /api/learning/jlpt/skills/sessions/{id} and /checks/{token}.
     Look up works on the page; also on a passage being answered (owner 04/11). -->
<head th:replace="~{fragments/head :: standard('Buổi Đọc · Nghe - KotsuKotsu', null)}"></head>
<th:block th:replace="~{jlptpath/fragments/jpath :: assets('jpath-skills')}"></th:block>
<body id="jlabBasePage" class="app-body jp-body">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent" class="jp-page jp-skill-session" data-inline-dictionary
      th:attr="data-session-id=${sessionId}" data-jpath-skill-session data-jpath-auto-furigana>
    <th:block th:replace="~{jlptpath/fragments/jpath :: crumbsIn('Đọc · Nghe', '/learning?tab=skills', 'Buổi học')}"></th:block>
    <header class="jp-page-head"><h1 class="jp-page-head__title jp-side__title" data-role="title">Buổi Đọc · Nghe</h1></header>
    <ol class="jp-stepper jp-skill-steps" data-role="steps" aria-label="Các bước của buổi học"></ol>
    <p class="jp-muted jp-skel jp-skel--lesson" role="status" data-role="status" aria-busy="true"><span class="jp-skel__sr">Đang tải buổi học…</span><i class="jp-skel__b jp-skel__b--title"></i><i class="jp-skel__b jp-skel__b--short"></i><i class="jp-skel__b jp-skel__b--tall"></i><i class="jp-skel__b jp-skel__b--btn"></i></p>
    <div data-role="body"></div>
</main>
<th:block th:replace="~{jlptpath/fragments/jpath :: scripts}"></th:block>
<!-- Furigana toggle: generated readings for passages, questions, options and lines (POST /api/learning/jlpt/furigana). -->
<script th:src="@{/js/jlptpath/jpath-furigana.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlptpath/jpath-auto-furigana.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlptpath/jpath-skill-player.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlptpath/jpath-shadow-follow.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlptpath/jpath-dictation.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlptpath/jpath-skill-session.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
