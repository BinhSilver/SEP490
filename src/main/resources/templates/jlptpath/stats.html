<!DOCTYPE html>
<html id="jlabBaseDocument" lang="vi" xmlns:th="http://www.thymeleaf.org">
<!-- [JLAS-W0108] Stats page of the JLPT path. A calendar day opens the history page. -->
<head th:replace="~{fragments/head :: standard('Thống kê học - KotsuKotsu', null)}"></head>
<th:block th:replace="~{jlptpath/fragments/jpath :: assets('jpath-side')}"></th:block>
<body id="jlabBasePage" class="app-body jp-body">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent" class="jp-page jp-side" data-inline-dictionary data-jpath-stats>
<div class="jp-ws jp-ws--norail">
    <th:block th:replace="~{jlptpath/fragments/jpath :: crumbs('Thống kê')}"></th:block>
    <aside class="jp-ws__side" aria-label="Điều hướng lộ trình">
        <th:block th:replace="~{jlptpath/fragments/jpath :: sidenav('/learning/jlpt/stats')}"></th:block>
    </aside>
    <div class="jp-ws__main">
        <header class="jp-page-head"><h1 class="jp-page-head__title jp-side__title">Thống kê học</h1></header>
        <div class="jp-side__range" role="group" aria-label="Khoảng thời gian">
            <button type="button" class="jp-side-btn" data-range="7" aria-pressed="true">7 ngày</button>
            <button type="button" class="jp-side-btn" data-range="30" aria-pressed="false">30 ngày</button>
        </div>
        <p class="jp-side__status jp-skel jp-skel--list" role="status" data-role="status" aria-busy="true"><span class="jp-skel__sr">Đang tải…</span><i class="jp-skel__b jp-skel__b--title"></i><i class="jp-skel__b jp-skel__b--line"></i><i class="jp-skel__b jp-skel__b--short"></i><i class="jp-skel__grid"><i class="jp-skel__b jp-skel__b--card"></i><i class="jp-skel__b jp-skel__b--card"></i><i class="jp-skel__b jp-skel__b--card"></i><i class="jp-skel__b jp-skel__b--card"></i></i></p>
        <div class="jp-side-tiles jp-side-tiles--summary" data-role="summary" aria-label="Số liệu chính"></div>
        <section class="jp-side-card" aria-labelledby="jpsEntryTitle" data-jpath-entry hidden>
            <h2 id="jpsEntryTitle">Đầu vào</h2>
            <div data-role="entry"></div>
        </section>
        <section class="jp-side-card" aria-labelledby="jpsCommTitle" data-cpath-stats hidden>
            <h2 id="jpsCommTitle">Lộ trình giao tiếp</h2>
            <div data-role="comm"></div>
        </section>
        <section class="jp-side-card" aria-labelledby="jpsHeatTitle">
            <div class="jp-side-month-head">
                <h2 id="jpsHeatTitle">Lịch học</h2>
                <div class="jp-side-month-controls" role="group" aria-label="Chọn tháng">
                    <button type="button" class="jp-side-btn" data-month-step="-1" aria-label="Tháng trước"></button>
                    <span data-role="month-label" aria-live="polite"></span>
                    <button type="button" class="jp-side-btn" data-month-step="1" aria-label="Tháng sau"></button>
                </div>
            </div>
            <div class="jp-side-heat" data-role="heatmap"></div>
            <p class="jp-side__note">Ngày nghỉ và ngày kỹ năng được đánh dấu. Chọn một ngày để xem lịch sử.</p>
        </section>
        <details class="jp-side-more">
            <summary>Số liệu chi tiết</summary>
            <section class="jp-side-card" aria-labelledby="jpsAccTitle">
                <h2 id="jpsAccTitle">Độ chính xác</h2>
                <div class="jp-side-tiles" data-role="accuracy"></div>
            </section>
            <section class="jp-side-card" aria-labelledby="jpsCountTitle">
                <h2 id="jpsCountTitle">Mục của bạn</h2>
                <div class="jp-side-tiles" data-role="counts"></div>
            </section>
            <section class="jp-side-card" aria-labelledby="jpsDaysTitle">
                <h2 id="jpsDaysTitle">Mỗi ngày</h2>
                <div class="jp-side-bars" data-role="bars"></div>
            </section>
        </details>
        <details class="jp-side-more">
            <summary>Huy hiệu</summary>
            <ul class="jp-side-badges" data-role="badges"></ul>
        </details>
    </div>
</div>
</main>
<th:block th:replace="~{jlptpath/fragments/jpath :: scripts}"></th:block>
<script th:src="@{/js/jlptpath/jpath-stats.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlptpath/jpath-entry.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/cpath/cpath-stats.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
