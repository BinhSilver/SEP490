<!DOCTYPE html>
<html id="jlabBaseDocument" lang="vi" xmlns:th="http://www.thymeleaf.org">
<!-- [JLAS-W0108] Confusable pairs of the JLPT path; jpath-confusables.js fills it from GET /api/learning/jlpt/confusables
     and opens a 10-question CONFUSABLE check. -->
<head th:replace="~{fragments/head :: standard('Phân biệt dễ nhầm - KotsuKotsu', null)}"></head>
<th:block th:replace="~{jlptpath/fragments/jpath :: assets('jpath-side')}"></th:block>
<body id="jlabBasePage" class="app-body jp-body">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent" class="jp-page jp-side" data-inline-dictionary data-jpath-confusables>
<div class="jp-ws jp-ws--norail">
    <th:block th:replace="~{jlptpath/fragments/jpath :: crumbs('Phân biệt dễ nhầm')}"></th:block>
    <aside class="jp-ws__side" aria-label="Điều hướng lộ trình">
        <th:block th:replace="~{jlptpath/fragments/jpath :: sidenav('/learning/jlpt/confusables')}"></th:block>
    </aside>
    <div class="jp-ws__main">
        <header class="jp-page-head"><h1 class="jp-page-head__title jp-side__title">Phân biệt dễ nhầm</h1></header>
        <div class="jp-side__range" role="group" aria-label="Loại mục">
            <button type="button" class="jp-side-btn" data-tab="VOCAB" aria-pressed="true">Từ vựng</button>
            <button type="button" class="jp-side-btn" data-tab="KANJI" aria-pressed="false">Kanji</button>
            <button type="button" class="jp-side-btn" data-tab="GRAMMAR" aria-pressed="false">Ngữ pháp</button>
        </div>
        <div class="jp-side__range jp-confusables-mode" role="group" aria-label="Danh sách">
            <button type="button" class="jp-side-btn" data-mode="mine" aria-pressed="true">Của bạn</button>
            <button type="button" class="jp-side-btn" data-mode="preview" aria-pressed="false">Xem trước tất cả</button>
        </div>
        <div class="jp-side__range">
            <button type="button" class="jp-side-btn jp-side-btn--primary" data-role="start" disabled>Luyện 10 câu</button>
            <p class="jp-side__status" role="status" data-role="status">Đang tải…</p>
        </div>
        <label class="jp-side__note">Tìm trong danh sách <input type="search" data-role="search" autocomplete="off"></label>
        <ul class="jp-pairs" data-role="pairs"></ul>
        <nav class="jp-side__pager" data-role="pager" aria-label="Trang" hidden>
            <button type="button" class="jp-side-btn" data-page="prev">Trước</button>
            <span data-role="page"></span>
            <button type="button" class="jp-side-btn" data-page="next">Sau</button>
        </nav>
    </div>
</div>
</main>
<th:block th:replace="~{jlptpath/fragments/jpath :: scripts}"></th:block>
<script th:src="@{/js/jlptpath/jpath-confusables.js(v=${jpathAssetVersion})}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
