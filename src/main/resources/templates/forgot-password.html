<!DOCTYPE html>
<html class="dark" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: standard('Quên mật khẩu - KotsuKotsu', 'forgot-password')}"></head>
<body data-mobile-adapt="owned" id="jlabBasePage" class="app-body app-body--auth">

<div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent" class="app-main app-main--auth">
    <div class="page-forgot">
        <div class="card card--accent-top">
            <div class="card__body">
                <section id="emailStep">
                    <div class="card__header card__header--center">
                        <div class="icon-circle"><span class="material-symbols-outlined">lock_reset</span></div>
                        <h1 class="card__title">Quên mật khẩu</h1>
                        <p class="card__subtitle">Nhập email để nhận mã OTP đặt lại mật khẩu.</p>
                    </div>

                    <form id="requestOtpForm" class="form" novalidate>
                        <div class="field">
                            <label for="email" class="field__label">Địa chỉ email</label>
                            <div class="input-wrap">
                                <span class="input-wrap__icon"><span class="material-symbols-outlined">mail</span></span>
                                <input id="email" name="email" type="email" class="input input--with-icon"
                                       placeholder="name@example.com" autocomplete="email" required maxlength="255" />
                            </div>
                        </div>
                        <button id="requestOtpBtn" type="submit" class="btn btn--primary btn--block">
                            Gửi mã OTP
                        </button>
                    </form>
                </section>

                <section id="otpStep" hidden>
                    <div class="card__header card__header--center">
                        <div class="icon-circle"><span class="material-symbols-outlined">mark_email_read</span></div>
                        <h1 class="card__title">Xác nhận mã OTP</h1>
                        <p class="card__subtitle">Nhập mã OTP đã gửi đến <strong id="targetEmail"></strong>.</p>
                    </div>

                    <form id="verifyOtpForm" class="form" novalidate>
                        <div class="field">
                            <label for="otp" class="field__label">Mã OTP gồm 6 chữ số</label>
                            <div class="input-wrap">
                                <span class="input-wrap__icon"><span class="material-symbols-outlined">pin</span></span>
                                <input id="otp" type="tel" class="input input--with-icon" inputmode="numeric" pattern="[0-9]{6}"
                                       autocomplete="one-time-code" maxlength="6" placeholder="123456" required />
                            </div>
                        </div>

                        <button id="verifyOtpBtn" type="submit" class="btn btn--primary btn--block">
                            Xác nhận OTP
                        </button>
                    </form>

                    <div class="forgot-actions">
                        <button id="resendOtpBtn" type="button" class="btn btn--ghost btn--sm">Gửi lại mã</button>
                        <button id="changeEmailBtn" type="button" class="btn btn--ghost btn--sm">Đổi email</button>
                    </div>
                </section>

                <section id="passwordStep" hidden>
                    <div class="card__header card__header--center">
                        <div class="icon-circle"><span class="material-symbols-outlined">password</span></div>
                        <h1 class="card__title">Đặt lại mật khẩu</h1>
                        <p class="card__subtitle">Mã OTP đã được xác nhận. Hãy đặt mật khẩu mới cho tài khoản của bạn.</p>
                    </div>

                    <form id="resetPasswordForm" class="form" novalidate>
                        <div class="field">
                            <label for="newPassword" class="field__label">Mật khẩu mới</label>
                            <div class="input-wrap">
                                <span class="input-wrap__icon"><span class="material-symbols-outlined">lock</span></span>
                                <input id="newPassword" type="password" class="input input--with-icon"
                                       autocomplete="new-password" minlength="8" maxlength="72" required />
                            </div>
                        </div>

                        <div class="field">
                            <label for="confirmPassword" class="field__label">Xác nhận mật khẩu mới</label>
                            <div class="input-wrap">
                                <span class="input-wrap__icon"><span class="material-symbols-outlined">lock_clock</span></span>
                                <input id="confirmPassword" type="password" class="input input--with-icon"
                                       autocomplete="new-password" minlength="8" maxlength="72" required />
                            </div>
                        </div>

                        <button id="resetPasswordBtn" type="submit" class="btn btn--primary btn--block">Đặt lại mật khẩu</button>
                    </form>

                    <div class="forgot-actions">
                        <button id="backToOtpBtn" type="button" class="btn btn--ghost btn--sm">Quay lại OTP</button>
                    </div>
                </section>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/components/toast :: toast-host}"></div>
<script th:src="@{/js/components.js}"></script>
<script>
    (function () {
        const emailStep = document.getElementById('emailStep');
        const otpStep = document.getElementById('otpStep');
        const passwordStep = document.getElementById('passwordStep');
        const emailInput = document.getElementById('email');
        const requestOtpBtn = document.getElementById('requestOtpBtn');
        const resendOtpBtn = document.getElementById('resendOtpBtn');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const resetPasswordBtn = document.getElementById('resetPasswordBtn');
        const targetEmail = document.getElementById('targetEmail');
        const otpInput = document.getElementById('otp');
        let email = '';
        let verifiedOtp = '';
        let resendCooldown = null;

        otpInput.addEventListener('beforeinput', function (event) {
            if (event.data && /\D/.test(event.data)) event.preventDefault();
        });
        otpInput.addEventListener('input', function () {
            otpInput.value = otpInput.value.replace(/\D/g, '').slice(0, 6);
        });
        otpInput.addEventListener('paste', function (event) {
            event.preventDefault();
            otpInput.value = (event.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
        });

        async function requestOtp(showStep) {
            const response = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });
            const json = await response.json();
            if (!response.ok || !json.success) {
                throw new Error(json.message || 'Không thể gửi mã OTP.');
            }
            if (showStep) {
                targetEmail.textContent = email;
                emailStep.hidden = true;
                passwordStep.hidden = true;
                otpStep.hidden = false;
                document.getElementById('otp').focus();
            }
            return json;
        }

        function startResendCooldown() {
            let seconds = 60;
            window.clearInterval(resendCooldown);
            resendOtpBtn.disabled = true;
            resendOtpBtn.textContent = 'Gửi lại sau ' + seconds + ' giây';
            resendCooldown = window.setInterval(function () {
                seconds -= 1;
                if (seconds <= 0) {
                    window.clearInterval(resendCooldown);
                    resendOtpBtn.disabled = false;
                    resendOtpBtn.textContent = 'Gửi lại mã';
                    return;
                }
                resendOtpBtn.textContent = 'Gửi lại sau ' + seconds + ' giây';
            }, 1000);
        }

        document.getElementById('requestOtpForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            if (!emailInput.value.trim() || !emailInput.validity.valid) {
                JlasUI.toast('Vui lòng nhập địa chỉ email hợp lệ.', 'error');
                return;
            }
            email = emailInput.value.trim();
            requestOtpBtn.disabled = true;
            try {
                const json = await requestOtp(true);
                JlasUI.toast(json.message, 'success');
                startResendCooldown();
            } catch (error) {
                JlasUI.toast(error.message, 'error');
            } finally {
                requestOtpBtn.disabled = false;
            }
        });

        document.getElementById('verifyOtpForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const otp = document.getElementById('otp').value.replace(/\D/g, '');
            if (otp.length !== 6) {
                JlasUI.toast('Mã OTP phải gồm đúng 6 chữ số.', 'error');
                return;
            }
            verifyOtpBtn.disabled = true;
            try {
                const response = await fetch('/api/auth/verify-reset-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });
                const json = await response.json();
                if (!response.ok || !json.success) throw new Error(json.message || 'Mã OTP không đúng hoặc đã hết hạn.');
                verifiedOtp = otp;
                otpStep.hidden = true;
                passwordStep.hidden = false;
                document.getElementById('newPassword').focus();
                JlasUI.toast('Xác nhận OTP thành công.', 'success');
            } catch (error) {
                JlasUI.toast(error.message, 'error');
            } finally {
                verifyOtpBtn.disabled = false;
            }
        });

        document.getElementById('resetPasswordForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (!verifiedOtp) {
                passwordStep.hidden = true;
                otpStep.hidden = false;
                JlasUI.toast('Vui lòng xác nhận OTP trước.', 'error');
                return;
            }
            if (password.length < 8) {
                JlasUI.toast('Mật khẩu mới cần có ít nhất 8 ký tự.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                JlasUI.toast('Xác nhận mật khẩu chưa khớp.', 'error');
                return;
            }

            resetPasswordBtn.disabled = true;
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp: verifiedOtp, password, confirmPassword })
                });
                const json = await response.json();
                if (!response.ok || !json.success) throw new Error(json.message || 'Không thể đặt lại mật khẩu.');
                JlasUI.toast(json.message, 'success');
                window.setTimeout(function () { window.location.assign('/login'); }, 1200);
            } catch (error) {
                JlasUI.toast(error.message, 'error');
            } finally {
                resetPasswordBtn.disabled = false;
            }
        });

        resendOtpBtn.addEventListener('click', async function () {
            resendOtpBtn.disabled = true;
            try {
                const json = await requestOtp(false);
                verifiedOtp = '';
                document.getElementById('otp').value = '';
                JlasUI.toast(json.message, 'success');
                startResendCooldown();
            } catch (error) {
                JlasUI.toast(error.message, 'error');
                resendOtpBtn.disabled = false;
            }
        });

        document.getElementById('changeEmailBtn').addEventListener('click', function () {
            window.clearInterval(resendCooldown);
            verifiedOtp = '';
            otpStep.hidden = true;
            passwordStep.hidden = true;
            emailStep.hidden = false;
            emailInput.focus();
        });

        document.getElementById('backToOtpBtn').addEventListener('click', function () {
            passwordStep.hidden = true;
            otpStep.hidden = false;
            document.getElementById('otp').focus();
        });
    })();
</script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
