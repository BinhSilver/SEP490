<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: standard(${pageTitle}, 'arena')}"></head>
<body data-mobile-adapt="owned" id="jlabBasePage" class="app-body arena-body">
<div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent" class="ar-page ar-hub">
    <div class="ar-shell">
        <div class="ar-banner" data-resume hidden>
            <span>Bạn đang ở phòng <strong class="ar-code" data-resume-code>—</strong>.</span>
            <a class="ar-btn ar-btn--sm ar-btn--primary" data-resume-link href="/games">Quay lại phòng</a>
        </div>

        <div class="ar-banner" data-quick-status hidden role="status">
            <span><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                Đang tìm đối thủ <strong data-quick-game>—</strong> · bộ <strong data-quick-deck>—</strong></span>
            <span class="ar-banner__actions">
                <a class="ar-btn ar-btn--sm ar-btn--primary" data-quick-open href="/games/lobby?mode=QUICK">Xem</a>
                <button type="button" class="ar-btn ar-btn--sm" data-quick-cancel>Huỷ</button>
            </span>
        </div>

        <section class="ar-games" aria-labelledby="ar-games-title">
            <header class="ar-section-head ar-section-head--hub">
                <div>
                    <h1 id="ar-games-title">Vừa chơi vừa học</h1>
                    <a class="ar-btn ar-btn--sm ar-hub-shop" th:href="@{/games/shop}">
                        <i class="fa-solid fa-store" aria-hidden="true"></i> Cửa hàng
                    </a>
                </div>
                <form class="ar-join" data-join-form novalidate>
                    <label class="ar-label" for="ar-join-code">Có mã phòng của bạn bè?</label>
                    <div class="ar-join__row">
                        <input id="ar-join-code" class="ar-input ar-input--code" name="code" maxlength="6"
                               placeholder="123456" autocomplete="off" spellcheck="false" inputmode="numeric" pattern="[0-9]{6}"
                               aria-label="Mã phòng" aria-describedby="ar-join-error">
                        <button class="ar-btn ar-btn--dark" type="submit" aria-label="Vào phòng" title="Vào phòng">
                            <span class="ar-join__submit-text">Vào phòng</span>
                            <svg class="ar-join__submit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
                                <circle cx="10.5" cy="10.5" r="6.5"></circle>
                                <path d="m16 16 4.5 4.5"></path>
                            </svg>
                        </button>
                    </div>
                    <p id="ar-join-error" class="ar-error-text" data-join-error role="alert" hidden></p>
                </form>
            </header>
            <div class="ar-game-grid">
                <article th:each="game : ${games}" class="ar-game-card"
                         th:classappend="'ar-game-card--' + ${game.slug}">
                    <figure class="ar-game-card__art">
                        <div class="ar-preview" th:attr="data-game-preview=${game.slug}" role="img"
                             th:aria-label="'Minh hoạ cách chơi ' + ${game.name}">
                            <img th:src="@{${game.image}}" alt="" loading="lazy" width="960" height="600">
                        </div>
                    </figure>
                    <div class="ar-game-card__body">
                        <p class="ar-game-card__tag" th:text="${game.tagline}">Tagline</p>
                        <h3 th:text="${game.name}">Tên game</h3>

                        <div class="ar-game-card__actions">
                            <a class="ar-btn ar-btn--primary" th:href="@{/games/lobby(game=${game.type},mode='QUICK')}">Ghép trận</a>
                            <a class="ar-btn" th:href="@{/games/lobby(game=${game.type},mode='VERSUS')}">Mời bạn</a>
                            <a class="ar-btn" th:href="@{/games/lobby(game=${game.type},mode='SOLO')}">Luyện tập</a>
                        </div>
                    </div>
                </article>
            </div>
        </section>
    </div>
</main>

<script th:src="@{/arena/js/arena-client.js(v='20261010-device')}"></script>
<script th:src="@{/arena/js/games-page.js(v='20261013-numeric-room-code')}"></script>
<script th:src="@{/arena/js/game-previews.js}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
