<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: standard(${pageTitle}, 'arena')}"></head>
<body data-mobile-adapt="owned" id="jlabBasePage" class="app-body arena-body arena-body--page arena-standard jl-ui-kit">
<link rel="stylesheet" href="/arena/css/arena-standard.css?v=20261126-search">
<div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent" class="ar-page ar-shop">
    <div class="ar-shell">
        <nav class="ar-crumbs" aria-label="Đường dẫn">
            <a th:href="@{/games}">Trò chơi</a><span aria-hidden="true">/</span><span aria-current="page">Cửa hàng</span>
        </nav>

        <header class="ar-section-head ar-section-head--hub">
            <div>
                <h1>Cửa hàng</h1>
            </div>
        </header>

        <div class="jl-tabs ar-shop-tabs" role="tablist" aria-label="Danh mục cửa hàng" data-shop-tabs hidden>
            <span class="jl-tabs__ind" aria-hidden="true"></span>
        </div>

        <div class="ar-card ar-panel" data-shop-status role="status">
            <p class="ar-muted">Đang mở cửa hàng…</p>
        </div>

        <section id="ar-shop-panel" class="ar-shop-grid" role="tabpanel" data-shop-grid aria-live="polite" hidden></section>
    </div>

    <dialog class="ar-dialog ar-shop-confirm" data-confirm aria-labelledby="ar-confirm-title">
        <div class="ar-dialog__head">
            <h2 id="ar-confirm-title">Mua món này?</h2>
            <button type="button" class="ar-icon-btn" data-confirm-cancel aria-label="Đóng"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>
        <div class="ar-dialog__body ar-shop-confirm__body">
            <figure class="ar-shop-item__art" data-confirm-art></figure>
            <p data-confirm-text></p>
        </div>
        <div class="ar-dialog__foot">
            <button type="button" class="ar-btn" data-confirm-cancel>Để sau</button>
            <button type="button" class="ar-btn ar-btn--primary" data-confirm-ok>Mua</button>
        </div>
    </dialog>
</main>

<script th:src="@{/arena/js/arena-client.js(v='20261119-leave-fast')}"></script>
<script th:src="@{/arena/js/character-skin-preview.js(v='20261106-shared-art')}"></script>
<script th:src="@{/arena/js/shop-page.js(v='20261106-shared-art')}"></script>
<script th:src="@{/js/jlab-base-shell.js(v=20261125-icons-vi)}"></script>
<script defer src="/arena/js/standard-tabs.js?v=20261126-offset"></script>
</body>
</html>
