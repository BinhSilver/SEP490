<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: standard(${pageTitle}, 'arena')}"></head>
<body data-mobile-adapt="owned" id="jlabBasePage" class="app-body arena-body">
<div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent" class="ar-page ar-setup">
    <div class="ar-shell">
        <nav class="ar-crumbs" aria-label="Đường dẫn">
            <a th:href="@{/games}">Trò chơi</a><span aria-hidden="true">/</span><span aria-current="page">Thiết lập trận</span>
        </nav>

        <header class="ar-setup-head">
            <h1 data-setup-title>Ghép trận nhanh</h1>
        </header>
        <p class="ar-error-text" data-setup-error role="alert" hidden></p>

        <div class="ar-setup-flow">
            <section class="ar-step ar-card" aria-labelledby="ar-step-mode" data-step-mode hidden>
                <h2 id="ar-step-mode" tabindex="-1"><span class="ar-step__no">1</span> Chọn chế độ</h2>
                <div data-mobile-mode></div>
            </section>
            <div class="ar-setup-top">
                <section class="ar-step ar-card" aria-labelledby="ar-step-game" data-step-game>
                    <h2 id="ar-step-game" tabindex="-1"><span class="ar-step__no">1</span> Chọn game</h2>
                    <div class="ar-seg ar-mode-seg" role="radiogroup" aria-label="Chế độ chơi" data-mode-seg>
                        <button type="button" role="radio" aria-checked="true" data-value="QUICK">
                            <i class="fa-solid fa-bolt" aria-hidden="true"></i> Ghép trận nhanh
                        </button>
                        <button type="button" role="radio" aria-checked="false" data-value="VERSUS">
                            <i class="fa-solid fa-user-group" aria-hidden="true"></i> Phòng với bạn bè
                        </button>
                        <button type="button" role="radio" aria-checked="false" data-value="SOLO">
                            <i class="fa-solid fa-user" aria-hidden="true"></i> Luyện tập một mình
                        </button>
                    </div>
                    <div class="ar-game-picker" role="radiogroup" aria-labelledby="ar-step-game" data-game-picker></div>
                </section>

                <section class="ar-step ar-card ar-step--deck" aria-labelledby="ar-step-deck" data-step-deck>
                    <h2 id="ar-step-deck" tabindex="-1"><span class="ar-step__no">2</span> Chọn bộ flashcard</h2>
                    <div data-deck-picker></div>
                    <div class="ar-setup-actions">
                        <p class="ar-summary__problem" data-summary-problem role="status" hidden></p>
                        <button type="button" class="ar-btn ar-btn--primary ar-btn--lg ar-btn--block" data-submit disabled>Tìm đối thủ</button>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <div class="ar-mobile-bar" hidden>
        <button type="button" class="ar-btn ar-btn--primary ar-btn--lg" data-submit disabled>Tìm đối thủ</button>
    </div>

    <div class="ar-search-overlay" data-search-overlay hidden role="dialog" aria-modal="true" aria-labelledby="ar-search-title">
        <div class="ar-search-overlay__panel">
            <div class="ar-search-overlay__radar" aria-hidden="true"><i></i><i></i><i></i></div>
            <p class="ar-search-overlay__kicker" data-search-game>Ghép trận nhanh</p>
            <h2 id="ar-search-title">Đang tìm đối thủ…</h2>
            <p class="ar-search-overlay__deck">Bộ <strong data-search-deck>—</strong></p>
            <p class="ar-search-overlay__time" aria-live="off"><span data-search-time>0:00</span></p>
            <p class="ar-search-overlay__hint" data-search-hint aria-live="polite">Chờ người chọn cùng game và cùng bộ thẻ.</p>
            <button type="button" class="ar-btn ar-btn--lg" data-search-cancel>Huỷ tìm trận</button>
        </div>
    </div>
</main>

<script th:src="@{/arena/js/arena-client.js(v='20261109-kotsu')}"></script>
<script th:src="@{/arena/js/arena-setup-kit.js?v=20261110-word-count}"></script>
<script th:src="@{/arena/js/game-previews.js}"></script>
<script th:src="@{/arena/js/lobby-page.js(v='20261109-coin-toss')}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
