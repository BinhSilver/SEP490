<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: standard(${pageTitle}, 'arena')}"></head>
<body data-mobile-adapt="owned" id="jlabBasePage" class="app-body arena-body arena-standard jl-ui-kit">
<link rel="stylesheet" href="/arena/css/arena-standard.css?v=20261124-ui-standard">
<div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent" class="ar-page ar-setup">
    <div class="ar-shell">
        <nav class="ar-crumbs" aria-label="Đường dẫn">
            <a th:href="@{/games}">Trò chơi</a><span aria-hidden="true">/</span><span aria-current="page" data-crumb-game>Thiết lập trận</span>
        </nav>

        <header class="ar-setup-head">
            <h1 data-setup-title>Thiết lập trận</h1>
        </header>
        <p class="ar-error-text" data-setup-error role="alert" hidden></p>

        <!-- Các game dùng chung hai bước: chế độ, rồi nguồn học liệu. -->
        <div class="ar-setup-flow">
            <div class="ar-setup-top">
                <section class="ar-step ar-card ar-step--mode" aria-labelledby="ar-step-mode" data-step-mode>
                    <h2 id="ar-step-mode" tabindex="-1"><span class="ar-step__no">1</span> Chọn chế độ</h2>
                    <div class="ar-setup-game" data-setup-game></div>
                    <div class="ar-mode-list" role="radiogroup" aria-labelledby="ar-step-mode" data-mode-seg>
                        <button type="button" role="radio" aria-checked="true" data-value="QUICK">
                            <i class="fa-solid fa-bolt" aria-hidden="true"></i>
                            <span><strong>Ghép trận nhanh</strong><small>Đấu với người đang tìm trận cùng bộ thẻ.</small></span>
                        </button>
                        <button type="button" role="radio" aria-checked="false" data-value="VERSUS">
                            <i class="fa-solid fa-user-group" aria-hidden="true"></i>
                            <span><strong>Phòng với bạn bè</strong><small>Tạo phòng rồi gửi mã 6 số cho bạn bè.</small></span>
                        </button>
                        <button type="button" role="radio" aria-checked="false" data-value="SOLO">
                            <i class="fa-solid fa-user" aria-hidden="true"></i>
                            <span><strong>Luyện tập một mình</strong><small data-solo-copy>Chơi thử, tự chọn phần hỏi và phần đáp.</small></span>
                        </button>
                    </div>
                </section>

                <section class="ar-step ar-card ar-step--deck" aria-labelledby="ar-step-deck" data-step-deck>
                    <h2 id="ar-step-deck" tabindex="-1"><span class="ar-step__no">2</span> <span data-source-heading>Chọn bộ flashcard</span></h2>
                    <div class="ar-setup-picker" data-deck-picker></div>
                    <div class="ar-setup-picker" data-level-picker hidden>
                        <ul class="ar-deck-list" id="ar-setup-jlpt" role="radiogroup"
                            aria-label="Cấp JLPT" data-level-list></ul>
                    </div>
                    <div class="ar-setup-actions">
                        <p class="ar-summary__problem" data-summary-problem role="status" hidden></p>
                        <button type="button" class="ar-btn ar-btn--primary ar-btn--lg ar-btn--block" data-submit disabled>Tìm đối thủ</button>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <div class="ar-mobile-bar" hidden>
        <button type="button" class="ar-btn ar-btn--primary ar-btn--lg" data-submit disabled>Tìm đối thủ</button>
    </div>

    <div class="ar-search-overlay" data-search-overlay hidden role="dialog" aria-modal="true" aria-labelledby="ar-search-title">
        <div class="ar-search-overlay__panel">
            <div class="ar-search-overlay__radar" aria-hidden="true"><i></i><i></i><i></i></div>
            <p class="ar-search-overlay__kicker" data-search-game>Ghép trận nhanh</p>
            <h2 id="ar-search-title">Đang tìm đối thủ…</h2>
            <p class="ar-search-overlay__deck">Bộ <strong data-search-deck>—</strong></p>
            <p class="ar-search-overlay__time" aria-live="off"><span data-search-time>0:00</span></p>
            <p class="ar-search-overlay__hint" data-search-hint aria-live="polite">Chờ người chọn cùng game và cùng bộ thẻ.</p>
            <button type="button" class="ar-btn ar-btn--lg" data-search-cancel>Huỷ tìm trận</button>
        </div>
    </div>
</main>

<script th:src="@{/arena/js/arena-client.js(v='20261119-leave-fast')}"></script>
<script th:src="@{/arena/js/arena-setup-kit.js?v=20261111-select}"></script>
<script th:src="@{/arena/js/game-previews.js}"></script>
<script th:src="@{/arena/js/lobby-page.js(v='20261111-two-steps')}"></script>
<script th:src="@{/js/jlab-base-shell.js(v=20261125-icons-vi)}"></script>
<script defer src="/arena/js/standard-tabs.js?v=20261124-ui-standard"></script>
</body>
</html>
