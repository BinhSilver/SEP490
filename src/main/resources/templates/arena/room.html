<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: standard(${pageTitle}, 'arena')}"></head>
<body data-mobile-adapt="owned" id="jlabBasePage" class="app-body arena-body">
<div id="jlabBaseShellMount"></div>

<main id="jlabBaseContent" class="ar-page ar-room" th:attr="data-room-id=${roomId}">
    <link rel="stylesheet" th:href="@{/arena/css/room-preparation.css(v='20261106-skin-art')}">
    <link rel="stylesheet" th:href="@{/arena/css/vs-room.css(v='20261109-kotsu')}">
    <section class="vs" data-vs hidden aria-label="Phòng ghép trận nhanh"></section>
    <div class="ar-shell" data-room-shell>
        <nav class="ar-crumbs" aria-label="Đường dẫn">
            <a th:href="@{/games}">Trò chơi</a><span aria-hidden="true">/</span><span aria-current="page">Phòng đấu</span>
        </nav>

        <div class="ar-card ar-panel" data-room-status role="status">
            <p class="ar-muted">Đang vào phòng…</p>
        </div>

        <div data-room hidden>
            <header class="ar-room-head ar-card">
                <div>
                    <p class="ar-kicker" data-room-game>Game</p>
                    <h1>Phòng <span class="ar-code" data-room-code>———</span></h1>
                    <p class="ar-muted" data-room-visibility></p>
                </div>
                <div class="ar-room-head__tools">
                    <span class="ar-conn"><span class="ar-dot" data-conn-dot aria-hidden="true"></span><span data-conn-text>Đang kết nối</span></span>
                    <div class="ar-room-copy-actions">
                        <button type="button" class="ar-btn ar-btn--sm" data-copy-code><i class="fa-regular fa-copy" aria-hidden="true"></i> Sao chép mã</button>
                        <button type="button" class="ar-btn ar-btn--sm" data-copy-link><i class="fa-solid fa-link" aria-hidden="true"></i> Sao chép link mời</button>
                    </div>
                </div>
            </header>

            <section class="ar-card ar-panel ar-room-skins" data-room-skins aria-label="Chọn skin" hidden></section>
            <section class="ar-versus" aria-label="Người chơi">
                <div class="ar-seat ar-card" data-seat="0"></div>
                <div class="ar-vs" aria-hidden="true">VS</div>
                <div class="ar-seat ar-card" data-seat="1"></div>
            </section>

            <div class="ar-room-body">
                <section class="ar-card ar-panel" aria-labelledby="ar-room-settings-title">
                    <header>
                        <h2 id="ar-room-settings-title">Cài đặt trận</h2>
                        <button type="button" class="ar-btn ar-btn--sm" data-edit-settings hidden>
                            <i class="fa-solid fa-sliders" aria-hidden="true"></i> Đổi cài đặt
                        </button>
                    </header>
                    <dl class="ar-kv" data-settings-list></dl>
                </section>

                <section class="ar-card ar-panel" aria-labelledby="ar-room-actions-title">
                    <header><h2 id="ar-room-actions-title">Sẵn sàng?</h2></header>
                    <div class="ar-room-actions" data-room-actions></div>
                </section>
                <section class="ar-card ar-panel" aria-labelledby="ar-last-result-title" data-last-result hidden>
                    <header><h2 id="ar-last-result-title">Trận vừa xong</h2></header>
                    <div data-last-result-body></div>
                </section>
            </div>
        </div>
    </div>

    <dialog class="ar-dialog" data-settings-dialog aria-labelledby="ar-settings-dialog-title">
        <div class="ar-dialog__head">
            <h2 id="ar-settings-dialog-title">Đổi cài đặt trận</h2>
            <button type="button" class="ar-icon-btn" data-close-dialog aria-label="Đóng"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>
        <div class="ar-dialog__body">
            <section class="ar-card ar-step">
                <div class="ar-room-deck-summary__row" data-dialog-deck-summary hidden>
                    <strong data-dialog-deck-name></strong>
                    <button type="button" class="ar-btn ar-btn--sm" data-dialog-toggle-decks aria-expanded="false">Đổi bộ thẻ</button>
                </div>
                <h2><span class="ar-step__no">1</span> Bộ flashcard</h2>
                <div data-dialog-deck></div>
            </section>
            <section class="ar-card ar-step">
                <h2><span class="ar-step__no">2</span> Hỏi gì, đáp gì?</h2>
                <div data-dialog-fields></div>
            </section>
            <section class="ar-card ar-step">
                <h2><span class="ar-step__no">3</span> Tuỳ chọn</h2>
                <div data-dialog-options></div>
            </section>
            <p class="ar-summary__problem" data-dialog-problem role="status" hidden></p>
            <section class="ar-room-setup" data-dialog-game-setup hidden aria-label="Thiết lập như luyện tập"></section>
        </div>
        <div class="ar-dialog__foot">
            <button type="button" class="ar-btn" data-close-dialog>Huỷ</button>
            <button type="button" class="ar-btn ar-btn--primary" data-save-settings>Lưu cài đặt</button>
        </div>
    </dialog>

    <div class="ar-countdown" data-countdown hidden role="alert" aria-live="assertive">
        <div><strong data-countdown-number>3</strong><p data-countdown-text>Chuẩn bị…</p></div>
    </div>
</main>

<script th:src="@{/arena/js/arena-client.js(v='20261109-kotsu')}"></script>
<link rel="stylesheet" th:href="@{/arena/css/voice.css}">
<script th:src="@{/arena/js/voice-client.js}"></script>
<script th:src="@{/arena/js/arena-setup-kit.js(v='20261109-coin-toss')}"></script>
<script th:src="@{/arena/js/character-skin-preview.js(v='20261106-shared-art')}"></script>
<script th:src="@{/arena/js/vs-room.js(v='20261109-kotsu')}"></script>
<script th:src="@{/arena/js/room-skins.js(v='20261106-skin-art')}"></script>
<script th:src="@{/arena/js/room-settings.js(v='20261013-memory-preparation')}"></script>
<script th:src="@{/arena/js/room-page.js(v='20261109-kotsu')}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
