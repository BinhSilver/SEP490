<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${page == 'billing'} ? 'Gói & thanh toán · J-LAB' : (${page == 'checkout'} ? 'Thanh toán · J-LAB' : (${page == 'credits'} ? 'Mua CP · J-LAB' : 'Nâng cấp Premium · J-LAB'))">Premium · J-LAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}" />
    <link rel="stylesheet" th:href="@{/css/pages/premium.css(v=20261110-coupon)}" />
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css(v='20261111-nav-nowrap')}" />
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png" />
</head>
<body id="jlabBasePage" class="premium-page">
    <div id="jlabBaseShellMount"></div>
    <main id="jlabBaseContent">
        <div id="premiumApp" class="pm" th:attr="data-page=${page},data-order=${orderCode}" aria-live="polite">
            <div class="pm-loading"><i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i> Đang tải…</div>
        </div>
    </main>
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/jlab-base-shell.js}"></script>
    <script th:if="${page == 'checkout'}" src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script th:src="@{/js/pages/premium.js(v=20261110-credit-checkout)}"></script>
</body>
</html>
