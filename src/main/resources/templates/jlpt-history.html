<!DOCTYPE html>
<html id="jlabBaseDocument" class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: standard('Lịch sử làm bài JLPT - KotsuKotsu', 'jlpt')}"></head>
<body id="jlabBasePage" class="app-body jlpt-body">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent" class="jlpt-page jlpt-history" data-inline-dictionary>
    <a class="jlpt-history-back" href="/jlpt"><span class="material-symbols-outlined">arrow_back</span>Thư viện đề JLPT</a>
    <header class="jlpt-library-intro jlpt-history-intro">

    <section class="jlpt-history-list" aria-labelledby="jlptHistoryTitle">

        <p id="jlptHistoryStatus" class="jlpt-history-status" role="status">Đang tải lịch sử…</p>
        <div id="jlptHistoryItems" class="jlpt-history-items"></div>
        <button id="jlptHistoryMore" class="jlpt-history-more" type="button" hidden>Tải thêm</button>
    </section>
</main>
<script th:src="@{/js/jlab-base-shell.js?v=20261107-nav}"></script>
