<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}">Bắt cá · JLAS</title>
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png" />
    <link rel="stylesheet" th:href="@{/arena/app/neko/neko-app.css}" />
    <!-- Thanh điều hướng chung: CSS riêng theo id, không kéo CSS chung của trang vào game. -->
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell-standalone.css}" />
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}" />
</head>
<body id="jlabBasePage" class="site-nav-hidden arena-play arena-play--neko">
<div id="jlabBaseShellMount"></div>
<div id="neko-root"
     th:attr="data-session-id=${sessionId},data-mode=${session.mode},data-back-url=${session.backUrl},data-me-id=${session.meUserId},data-skin=${skin}">
</div>
<noscript>Trình duyệt này chưa chạy được game. Hãy mở bằng Chrome, Edge hoặc Safari bản mới.</noscript>
<script th:src="@{/js/auth-session.js}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
<script th:src="@{/arena/js/arena-client.js}"></script>
<script type="module" th:src="@{/arena/app/neko/neko-app.js}"></script>
</body>
</html>
