<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang xử lý | KotsuKotsu Shadowing</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/tokens.css?v=20261125-largescreen"/>
    <link rel="stylesheet" href="/css/theme-bridge.css"/>
    <link rel="stylesheet" href="/css/base.css?v=20261125-largescreen"/>
    <link rel="stylesheet" href="/shadowing/css/styles.css?v=20261116-bin">
    <link rel="icon" href="/images/jlab.png" type="image/png"/>
    <link rel="stylesheet" href="/css/components/kitsu-guide.css?v=20261125-phase1"/>
    <link rel="stylesheet" href="/css/pages/shadowing.css?v=20261105-plum"/>
    <link rel="stylesheet" href="/css/jlab-base-shell.css?v=20261125-largescreen"/>
    <link rel="stylesheet" href="/css/owned-mobile.css?v=20261009-compact-2">
    <link rel="stylesheet" href="/shadowing/css/creator-standard.css?v=20261123-gold-modes">
    <link rel="stylesheet" href="/css/components/cp-unit.css?v=20261123-gold">
    <script defer src="/js/components/cp-unit.js?v=20261123-gold"></script>
</head>
<body data-mobile-adapt="owned" id="jlabBasePage" class="shadowing-creator-standard jl-ui-kit page-shadowing page-shadowing-processing">
    <div id="jlabBaseShellMount"></div>

    <input type="hidden" id="video-id" th:value="${videoId}">

    <main id="jlabBaseContent" class="container">
        <section>
            <header class="section-header">
                <h1 class="hero-display" id="video-title">Đang xử lý...</h1>
            </header>

            <div id="processingWorkspace">
                <aside id="processingKitsuGuide" role="status" aria-live="polite">
                    <div class="kitsu-guide">
                        <div class="kitsu-guide__mascot">
                            <img id="processing-kitsu-animation" src="/images/mascots/kitsu/kitsu-preparing.webp?v=20261012" alt="" aria-hidden="true">
                        </div>
                        <div class="kitsu-guide__bubble">
                            <strong class="kitsu-guide__title">Kitsu-chan đang chuẩn bị bài học</strong>
                            <p class="kitsu-guide__message">Bạn có thể về trang chủ, khi xong mình sẽ thông báo.</p>
                        </div>
                    </div>
                </aside>

                <div id="processingProgressCard" class="store-utility-card">
                <ul class="progress-steps" id="steps">
                    <li data-step="UPLOADED"><span class="step-icon fa-regular fa-circle"></span> Bắt đầu</li>
                    <li data-step="YOUTUBE_DOWNLOAD"><span class="step-icon fa-regular fa-circle"></span> Hoàn tất</li>
                    <li data-step="SUBTITLE_DOWNLOAD"><span class="step-icon fa-regular fa-circle"></span> Tải / tạo phụ đề</li>
                    <li data-step="EXTRACTING_AUDIO"><span class="step-icon fa-regular fa-circle"></span> Tách âm thanh</li>
                    <li data-step="TRANSCRIBING"><span class="step-icon fa-regular fa-circle"></span> Nhận dạng giọng nói</li>
                    <li data-step="AI_PROCESSING"><span class="step-icon fa-regular fa-circle"></span> Furigana &amp; dịch (AI)</li>
                </ul>

                <div class="progress-bar" style="margin: 16px 0;">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
                <p class="caption" id="progress-text" style="text-align: center;">0%</p>
                <p id="step-status" class="caption" style="text-align: center; margin-top: 8px;"></p>
                <p id="error-msg" class="caption" style="color: var(--danger); text-align: center; display: none;"></p>

                <div id="processing-actions" style="text-align: center; margin-top: 24px;">
                    <button id="processing-done-button" type="button" onclick="window.location.href='/shadowing'" class="button-primary" hidden>
                        <i class="fa-solid fa-check"></i> Bài học đã hoàn tất — về thư viện Shadowing
                    </button>
                    <button id="resume-processing-button" type="button" class="button-primary" hidden><i class="fa-solid fa-play"></i> Tiếp tục xử lý</button>
                    <button id="stop-processing-button" type="button" class="button-secondary"><i class="fa-solid fa-stop"></i> Dừng xử lý</button>
                    <button id="abandon-processing-button" type="button" class="button-secondary"><i class="fa-solid fa-ban"></i> Bỏ tiến trình</button>
                    <button id="retry-btn" class="button-secondary" style="display: none;"><i class="fa-solid fa-rotate-right"></i> Thử lại</button>
                </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/auth-session.js"></script>
    <script src="/js/jlab-base-shell.js?v=20261125-icons-vi"></script>
    <script src="/shadowing/js/client.js?v=20261109-kotsu"></script>
    <script src="/shadowing/js/confirm-modal.js?v=20261116-bin-cycle"></script>
    <script src="/shadowing/js/processing.js?v=20261017-leave-notice" ></script>
    <!-- Chỉ hoạt động khi chạy local với Spring Boot DevTools. -->
    <script src="http://localhost:35729/livereload.js?snipver=1" defer></script>
</body>
</html>
