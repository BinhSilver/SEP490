<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chọn cách học | JLAS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/theme-bridge.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/pages/shadowing-practice.css?v=20260929-merge-ti">
    <link rel="stylesheet" href="/css/jlab-base-shell.css">
    <link rel="stylesheet" href="/shadowing/css/empty-exercises.css?v=20261009-crying-30frames">
    <link rel="icon" href="/images/jlab.png" type="image/png">
    <link rel="stylesheet" href="/css/owned-mobile.css?v=20261009-compact-2">
    <link rel="stylesheet" href="/shadowing/css/responsive-player.css?v=20261012-mic-tools">
</head>
<body data-mobile-adapt="owned" id="jlabBasePage" class="page-shadowing-practice-select">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent">
    <input id="practice-video-id" type="hidden" th:value="${videoId}">
    <div id="practice-select-shell">
        <a id="practice-library-link" href="/shadowing">Thư viện</a>
        <header id="practice-select-header">
            <div>
                <span id="practice-eyebrow">Bắt đầu bài học</span>
                <h1 id="practice-video-title">Đang tải bài học…</h1>
                <p><span id="practice-subtitle-count">-- câu</span><span id="practice-video-jlpt" hidden></span></p>
            </div>
            <img id="practice-kitsu" src="/images/mascots/kitsu/kitsu-announcing.webp?v=20261012" alt="" aria-hidden="true">
        </header>

        <section id="practice-mode-section" aria-labelledby="practice-mode-heading">
            <h2 id="practice-mode-heading">Chọn chế độ</h2>
            <div id="practice-mode-grid">
                <button type="button" class="practice-mode-card is-selected" data-mode="SHADOWING" aria-pressed="true">
                    <i class="fa-solid fa-microphone-lines"></i>
                    <span><strong>Shadowing</strong></span>
                    <em>Hiện có</em>
                </button>
                <button type="button" class="practice-mode-card" data-mode="LISTENING" aria-pressed="false">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span><strong>Luyện nghe</strong></span>
                    <em>Dễ · Vừa · Khó</em>
                </button>
            </div>
        </section>

        <div id="practice-session-controls">
            <div id="practice-start-row">
                <img id="practice-start-kitsu" src="/images/mascots/kitsu/kitsu-preparing.webp?v=20261012" alt="" aria-hidden="true" hidden>
                <button id="practice-start-button" type="button" disabled>
                    <i id="practice-start-icon" class="fa-solid fa-play" aria-hidden="true"></i>
                    <span>Bắt đầu Shadowing</span>
                </button>
                <p id="practice-status" aria-live="polite"></p>
                <a id="practice-contribute-link" th:href="@{/shadowing/prepare/{id}(id=${videoId})}" hidden>Đóng góp câu hỏi <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{shadowing/fragments/empty-exercises :: dialog(${videoId})}"></div>
<script src="/js/auth-session.js"></script>
<script src="/js/jlab-base-shell.js"></script>
<script src="/shadowing/js/client.js"></script>
<script src="/shadowing/js/empty-exercises.js?v=20261009"></script>
<script src="/shadowing/js/mode-select.js?v=20261012-mic-tools"></script>
</body>
</html>
