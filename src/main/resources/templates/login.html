<!DOCTYPE html>
<html class="dark" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: standard('Đăng nhập - JLAS', 'login')}"></head>
<body data-mobile-adapt="owned" class="app-body app-body--auth page-login"
      th:attr="data-google-client-id=${googleClientId != null ? googleClientId : ''}">

<div class="login-background" aria-hidden="true"></div>

<main id="jlabBaseContent" class="app-main app-main--auth">
    <div class="login-layout">
        <section class="login-mascot-panel" aria-label="Mascot JLAS">
            <div class="login-mascot-copy">
                <h2>Học tiếng Nhật<br>vui hơn mỗi ngày</h2>
                <p>Đăng nhập để tiếp tục hành trình của bạn.</p>
            </div>
            <div th:replace="~{fragments/components/fox-mascot :: foxMascot}"></div>
        </section>

    <div class="app-main--auth-inner">
        <section class="card login-card" aria-labelledby="loginTitle">
            <div class="card__body">
                <div class="card__header card__header--center">
                    <h1 id="loginTitle" class="card__title">Đăng nhập</h1>
                </div>

                <form id="loginForm" class="form" novalidate>
                    <div class="field">
                        <label for="email" class="field__label">Email</label>
                        <div class="input-wrap">
                            <i class="fa-regular fa-envelope input-wrap__icon" aria-hidden="true"></i>
                            <input id="email" name="email" type="email"
                                   class="input input--with-icon"
                                   placeholder="jlas@gmail.com" required maxlength="255"
                                   autocomplete="email" inputmode="email" autocapitalize="none"
                                   spellcheck="false" aria-describedby="emailError"/>
                        </div>
                        <p id="emailError" class="field__error" aria-live="polite"></p>
                    </div>

                    <div class="field">
                        <div class="field__label-row">
                            <label for="password" class="field__label">Mật khẩu</label>
                            <a th:href="@{/forgot-password}" class="field__link login-forgot-desktop">Quên mật khẩu?</a>
                        </div>
                        <div class="input-wrap">
                            <i class="fa-solid fa-lock input-wrap__icon" aria-hidden="true"></i>
                            <input id="password" name="password" type="password"
                                   class="input input--with-icon input--with-action"
                                   placeholder="Nhập mật khẩu" required maxlength="100"
                                   autocomplete="current-password" aria-describedby="passwordError capsLockWarning"/>
                            <button type="button" class="input-wrap__action password-toggle"
                                    data-password-toggle="password"
                                    aria-label="Hiện mật khẩu" aria-pressed="false">
                                <i class="fa-regular fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                        <p id="passwordError" class="field__error" aria-live="polite"></p>
                        <p id="capsLockWarning" class="caps-lock-warning" role="status" hidden>
                            Caps Lock đang bật.
                        </p>
                    </div>

                    <button id="submitBtn" type="submit" class="btn btn--primary btn--block">
                        <span class="btn__label">Đăng nhập</span>
                    </button>
                </form>
                <a th:href="@{/forgot-password}" class="field__link login-forgot-mobile">Quên mật khẩu?</a>

                <div id="googleSection"
                     th:if="${googleClientId != null and !#strings.isEmpty(googleClientId) and !#strings.contains(googleClientId, 'your-google-client-id')}">
                    <div class="form-divider"><span class="login-divider-desktop">Hoặc tiếp tục với</span><span class="login-divider-mobile">Hoặc đăng nhập bằng</span></div>
                    <div id="googleBtnContainer"></div>
                </div>
            </div>
        </section>

        <p class="form-footer">
            Chưa có tài khoản?
            <a th:href="@{/register}">Đăng ký miễn phí</a>
        </p>
    </div>
    </div>
</main>

<div th:replace="~{fragments/components/toast :: toast-host}"></div>
<script th:src="@{/js/components.js}"></script>
<script th:src="@{/js/pages/auth-common.js}"></script>
<script th:if="${googleClientId != null and !#strings.isEmpty(googleClientId) and !#strings.contains(googleClientId, 'your-google-client-id')}"
        src="https://accounts.google.com/gsi/client" async defer></script>
<script th:src="@{/js/pages/login.js(v='20261012-google-white')}"></script>
</body>
</html>
