<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Lỗi · KotsuKotsu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/tokens.css}"/>
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}"/>
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}"/>
    <link rel="stylesheet" th:href="@{/css/components/dropdowns.css}"/>
    <link rel="stylesheet" th:href="@{/css/components/header.css}"/>
    <link rel="stylesheet" th:href="@{/css/components/brand.css}"/>
    <link rel="stylesheet" th:href="@{/css/components/platform-nav.css}"/>
    <link rel="stylesheet" th:href="@{/css/components/user-menu.css}"/>
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}"/>
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/components.js}"></script>
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png"/>
    <link rel="stylesheet" href="/css/owned-mobile.css?v=20261009-compact-2">
</head>
<body data-mobile-adapt="owned" id="jlabBasePage">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent" class="auth-wrap">
    <div class="panel auth-card" style="text-align:center">
        <div class="cat-icon" style="margin:0 auto 12px">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h1>Đã xảy ra lỗi</h1>
        <p style="color:var(--muted);margin:12px 0"
           th:text="${message} ?: 'Xin lỗi, đã có lỗi khi xử lý yêu cầu của bạn.'">lỗi</p>
        <div class="alert" th:if="${error}" th:text="${error}"></div>
        <a class="btn btn-primary" th:href="@{/ai-call}">
            <i class="fa-solid fa-house"></i> Về trang chủ
        </a>
    </div>
</main>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
