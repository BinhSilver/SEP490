    <title>AI Call · Chọn chế độ · KotsuKotsu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <link rel="stylesheet" th:href="@{/css/tokens.css}"/>

<body data-mobile-adapt="owned" id="jlabBasePage" class="page-mode-select">

<main id="jlabBaseContent" class="mode-select-main">
    <div class="mode-grid">
        <a class="card cat-card mode-card" th:href="@{/ai-call/free-chat/start}">

                <h3>Trò Chuyện AI</h3>

            </a>

            <div class="cat-icon"><i class="fa-solid fa-scroll"></i></div>
            <div>
                <h3>AI Theo Kịch Bản</h3>
                <div class="jp">シナリオ会話</div>
            </div>
            <div class="meta">
                <span class="badge"><i class="fa-solid fa-bullseye"></i> Nhiệm vụ (ミッション)</span>
                <span class="badge"><i class="fa-solid fa-graduation-cap"></i> Học tập</span>
            </div>
        </a>
    </div>

<script th:src="@{/js/auth-session.js}"></script>
