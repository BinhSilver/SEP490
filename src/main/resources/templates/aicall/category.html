<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${category.title} + ' · JLAS'">Chủ đề</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/tokens.css}"/>
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}"/>
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png"/>
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}"/>
</head>
<body id="jlabBasePage">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent">

<header class="page-header container">
    <div class="eyebrow"><i th:class="${category.icon}"></i> <span th:text="${category.titleJa}">JP</span></div>
    <h1 th:text="${category.title}">Chủ đề</h1>
    <p th:text="${category.description}">Mô tả</p>
</header>

<section class="container" style="padding-bottom:48px">
    <div class="scenario-grid">
        <article class="card scenario-card" th:each="s : ${scenarios}">
            <div class="meta">
                <span class="badge" th:text="${s.jlptLevel}">N5</span>
                <span class="badge" th:text="${s.difficulty}">Dễ</span>
                <span class="badge"><i class="fa-solid fa-clock"></i>
                    <span th:text="${s.estimatedMinutes}">5</span> phút
                </span>
            </div>
            <h3 th:text="${s.title}">Tên kịch bản</h3>
            <p class="mission" th:text="${s.description}">Mô tả nhiệm vụ</p>
            <div class="footer">
                <span class="meta" th:if="${s.aiRole != null}">
                    <i class="fa-solid fa-user-tie"></i>
                    <span th:text="${s.aiRole.name}">Vai AI</span>
                </span>
                <a class="btn btn-primary" th:href="@{'/scenario/' + ${s.id}}">
                    Xem chi tiết <i class="fa-solid fa-chevron-right"></i>
                </a>
            </div>
        </article>
    </div>
    <div th:if="${#lists.isEmpty(scenarios)}" class="panel" style="margin-top:16px">
        <p>Chưa có kịch bản trong chủ đề này.</p>
    </div>
</section>
</main>
<script th:src="@{/js/auth-session.js}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
