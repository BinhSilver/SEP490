<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${category.title} + ' · AI Call'">Chủ đề</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/tokens.css}"/>
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}"/>
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" th:href="@{/css/aicall-tree.css}"/>
    <link rel="stylesheet" th:href="@{/css/aicall-catalog.css(v='20261005-site-colors-2')}"/>
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}"/>
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png"/>
</head>
<body id="jlabBasePage">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent" class="aicall-topic-list">
    <header class="page-header container">
        <a class="topics-back" th:href="@{/ai-call/scenarios}"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Tất cả chủ đề</a>
        <h1 th:text="${category.title}">Chủ đề</h1>
    </header>
    <section class="container topics-section" aria-label="Chọn kịch bản trong chủ đề">
        <ul class="topics-list scenario-directory" th:unless="${#lists.isEmpty(scenarios)}">
            <li th:each="s : ${scenarios}">
                <a class="topic-scenario-link" th:href="@{/scenario/{id}(id=${s.id})}">
                    <i th:class="${scenarioIcons[s.id]}" aria-hidden="true"></i>
                    <span class="topic-scenario-title" th:text="${s.catalogTitle}"></span>
                    <span class="topic-scenario-level" th:text="${s.jlptLevel}"></span>
                    
                </a>
            </li>
        </ul>
        <p class="topics-empty" th:if="${#lists.isEmpty(scenarios)}">Chưa có kịch bản trong chủ đề này.</p>
    </section>
</main>
<script th:src="@{/js/auth-session.js}"></script>
<script th:src="@{/js/jlab-base-shell.js}"></script>
</body>
</html>
