<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập · JLAS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <link rel="stylesheet" th:href="@{/css/components/brand.css}" />
    <link rel="stylesheet" th:href="@{/css/components/header.css}" />
    <link rel="stylesheet" th:href="@{/css/components/dropdowns.css}" />
    <link rel="stylesheet" th:href="@{/css/components/user-menu.css}" />
    <link rel="stylesheet" th:href="@{/css/components/platform-nav.css}" />
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}" />
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png" />
    <link rel="stylesheet" href="/css/owned-mobile.css?v=20261009-compact-2">
</head>

<body data-mobile-adapt="owned" id="jlabBasePage">
    <div id="jlabBaseShellMount"></div>
    <main id="jlabBaseContent" class="auth-wrap">
        <div class="panel auth-card">
            <h1 style="margin-bottom:8px"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập</h1>
            <p style="color:var(--muted);margin-bottom:16px">Ứng dụng hiện không bắt buộc đăng nhập. Bạn có thể vào
                thẳng trang chủ.</p>
            <div class="alert" th:if="${param.error}">Sai tên đăng nhập hoặc mật khẩu.</div>
            <div class="alert alert-ok" th:if="${param.registered}">Đăng ký thành công. Hãy đăng nhập.</div>
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input class="form-control" type="text" name="username" required autofocus />
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input class="form-control" type="password" name="password" required />
                </div>
                <button class="btn btn-primary btn-block" type="submit">
                    <i class="fa-solid fa-check"></i> Đăng nhập
                </button>
            </form>
            <p style="margin-top:14px;text-align:center">
                <a th:href="@{/ai-call}">Tiếp tục không đăng nhập</a>
            </p>
        </div>
    </main>
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/jlab-base-shell.js}"></script>
</body>

</html>
