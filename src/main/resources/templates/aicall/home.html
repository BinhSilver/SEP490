<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Chủ đề hội thoại · AI Call</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/tokens.css(v=20261125-largescreen)}"/>
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}"/>
    <link rel="stylesheet" th:href="@{/css/base.css(v=20261125-largescreen)}"/>
    <link rel="stylesheet" th:href="@{/css/app.css(v=20261125-phase1)}"/>
    <link rel="stylesheet" th:href="@{/css/aicall-tree.css}"/>
    <link rel="stylesheet" th:href="@{/css/aicall-catalog.css(v='20261114-path-chip')}"/>
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png"/>
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css(v=20261125-largescreen)}"/>
    <link rel="stylesheet" href="/css/owned-mobile.css?v=20261009-compact-2">
<link rel="stylesheet" href="/css/pages/aicall-standard.css?v=20261126-fixes">
<link rel="stylesheet" href="/css/components/cp-unit.css?v=20261123-gold">
<script defer src="/js/components/cp-unit.js?v=20261123-gold"></script>
</head>
<body data-mobile-adapt="owned" id="jlabBasePage" class="aicall-standard jl-ui-kit">
<div id="jlabBaseShellMount"></div>
<main id="jlabBaseContent" class="aicall-topic-list">

<header class="page-header container">
    <h1>Chọn chủ đề hội thoại</h1>
</header>

<section class="container topics-section" aria-label="Danh sách chủ đề hội thoại">
    <ul class="topics-list" th:unless="${#lists.isEmpty(categories)}">
        <li th:each="c : ${categories}">
            <details class="topic-accordion">
            <summary class="topic-row">
                <span class="topic-icon"><i th:class="${c.icon != null ? c.icon : 'fa-solid fa-comments'}" aria-hidden="true"></i></span>
                <div class="topic-labels">
                    <h2 th:text="${c.title}">Chủ đề</h2>
                    <span class="topic-japanese" lang="ja" th:text="${c.titleJa}">日本語</span>
                </div>
                <span class="topic-count" th:text="${scenarioCounts[c.id]} + ' kịch bản'">1 kịch bản</span>
            </summary>
            <ul class="topic-scenarios" th:unless="${#lists.isEmpty(scenariosByCategory[c.id])}">
                <li th:each="s : ${scenariosByCategory[c.id]}">
                    <a class="topic-scenario-link" th:href="@{/scenario/{id}(id=${s.id})}">
                        <i th:class="${scenarioIcons[s.id]}" aria-hidden="true"></i>
                        <span class="topic-scenario-name"><span class="topic-scenario-title" th:text="${s.catalogTitle}"></span><span class="topic-scenario-path" th:if="${s.slug != null and #strings.startsWith(s.slug, 'cpath-')}" title="Kịch bản này thuộc Lộ trình Giao tiếp"><i class="fa-solid fa-route" aria-hidden="true"></i> Lộ trình Giao tiếp</span></span>
                        <span class="topic-scenario-level" th:text="${s.jlptLevel}"></span>

                    </a>
                </li>
            </ul>
            <p class="topics-empty" th:if="${#lists.isEmpty(scenariosByCategory[c.id])}">Chưa có kịch bản trong chủ đề này.</p>
            </details>
        </li>
    </ul>
    <p th:if="${#lists.isEmpty(categories)}" class="topics-empty">Chưa có chủ đề hội thoại.</p>
</section>

</main>
<script th:src="@{/js/auth-session.js}"></script>
<script th:src="@{/js/jlab-base-shell.js(v=20261125-icons-vi)}"></script>
</body>
</html>
