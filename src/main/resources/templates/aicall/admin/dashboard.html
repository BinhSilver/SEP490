<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản trị · JLAS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <link rel="stylesheet" th:href="@{/css/components/brand.css}" />
    <link rel="stylesheet" th:href="@{/css/components/header.css}" />
    <link rel="stylesheet" th:href="@{/css/components/dropdowns.css}" />
    <link rel="stylesheet" th:href="@{/css/components/user-menu.css}" />
    <link rel="stylesheet" th:href="@{/css/components/platform-nav.css}" />
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}" />
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png" />
    <link rel="stylesheet" href="/css/owned-mobile.css?v=20261009-compact-2">
</head>

<body data-mobile-adapt="owned" id="jlabBasePage">
    <div id="jlabBaseShellMount"></div>
    <main id="jlabBaseContent">
    <nav class="container" aria-label="Quản trị AI Call"
         style="display:flex;flex-wrap:wrap;gap:8px;padding-top:16px">
        <a class="btn btn-secondary" th:href="@{/admin/categories}">Chủ đề</a>
        <a class="btn btn-secondary" th:href="@{/admin/scenarios}">Kịch bản</a>
        <a class="btn btn-secondary" th:href="@{/admin/prompts}">Mẫu lệnh</a>
        <a class="btn btn-secondary" th:href="@{/ai-call}">Ứng dụng</a>
    </nav>
    <section class="container" style="padding:40px 0">
        <h1 style="margin-bottom:20px">Bảng điều khiển</h1>
        <div class="score-grid">
            <div class="score-item"><strong th:text="${categoryCount}">0</strong><span>Chủ đề</span></div>
            <div class="score-item"><strong th:text="${scenarioCount}">0</strong><span>Kịch bản</span></div>
            <div class="score-item"><strong th:text="${promptCount}">0</strong><span>Mẫu prompt</span></div>
        </div>
        <p style="color:var(--muted);margin-top:16px">
            Quản lý nội dung học (chủ đề, kịch bản, prompt) mà không cần sửa code.
        </p>
    </section>
    </main>
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/jlab-base-shell.js}"></script>
</body>

</html>
