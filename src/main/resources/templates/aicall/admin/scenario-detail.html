<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chi tiết kịch bản · Quản trị</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <link rel="stylesheet" th:href="@{/css/components/brand.css}" />
    <link rel="stylesheet" th:href="@{/css/components/header.css}" />
    <link rel="stylesheet" th:href="@{/css/components/dropdowns.css}" />
    <link rel="stylesheet" th:href="@{/css/components/user-menu.css}" />
    <link rel="stylesheet" th:href="@{/css/components/platform-nav.css}" />
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}" />
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png" />
</head>

<body id="jlabBasePage">
    <div id="jlabBaseShellMount"></div>
    <main id="jlabBaseContent">
    <nav class="container" aria-label="Quản trị AI Call" style="padding-top:16px">
        <a class="btn btn-secondary" th:href="@{/admin/scenarios}">Kịch bản</a>
    </nav>
    <section class="container" style="padding:32px 0 64px">
        <h1 th:text="${scenario.titleVi}">Kịch bản</h1>
        <p class="jp" th:text="${scenario.titleJa}"></p>
        <div class="detail-layout" style="margin-top:20px">
            <div class="panel">
                <h3>Nhiệm vụ</h3>
                <ul class="list-clean">
                    <li th:each="m : ${missions}" th:text="${m.code + ' — ' + m.titleVi}"></li>
                </ul>
                <h3 style="margin-top:16px">Từ vựng</h3>
                <ul class="list-clean">
                    <li th:each="v : ${vocabulary}" th:text="${v.wordJa + ' = ' + v.meaningVi}"></li>
                </ul>
                <h3 style="margin-top:16px">Ngữ pháp</h3>
                <ul class="list-clean">
                    <li th:each="g : ${grammar}" th:text="${g.pattern}"></li>
                </ul>
            </div>
            <div class="panel">
                <h3>Điều kiện hoàn thành</h3>
                <ul class="list-clean">
                    <li th:each="c : ${conditions}" th:text="${c.code + ' [' + c.conditionType + '] ' + c.matchValue}">
                    </li>
                </ul>
                <h3 style="margin-top:16px">Gợi ý</h3>
                <ul class="list-clean">
                    <li th:each="h : ${hints}" th:text="${'Lv' + h.level + ': ' + h.contentVi}"></li>
                </ul>
            </div>
        </div>
    </section>
    </main>
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/jlab-base-shell.js}"></script>
</body>

</html>
