<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kịch bản · Quản trị</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-bridge.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <link rel="stylesheet" th:href="@{/css/components/brand.css}" />
    <link rel="stylesheet" th:href="@{/css/components/header.css}" />
    <link rel="stylesheet" th:href="@{/css/components/dropdowns.css}" />
    <link rel="stylesheet" th:href="@{/css/components/user-menu.css}" />
    <link rel="stylesheet" th:href="@{/css/components/platform-nav.css}" />
    <link rel="stylesheet" th:href="@{/css/jlab-base-shell.css}" />
    <link rel="icon" th:href="@{/images/jlab.png}" type="image/png" />
    <link rel="stylesheet" href="/css/owned-mobile.css?v=20261009-compact-2">
</head>

<body data-mobile-adapt="owned" id="jlabBasePage">
    <div id="jlabBaseShellMount"></div>
    <main id="jlabBaseContent">
    <nav class="container" aria-label="Quản trị AI Call" style="padding-top:16px">
        <a class="btn btn-secondary" th:href="@{/admin}">Bảng điều khiển</a>
    </nav>
    <section class="container" style="padding:32px 0 64px">
        <h1>Kịch bản</h1>
        <div class="panel" style="margin:16px 0;overflow:auto">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Chủ đề</th>
                        <th>Mã</th>
                        <th>Tên</th>
                        <th>Cấp độ</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${scenarios}">
                        <td th:text="${s.category.titleVi}"></td>
                        <td th:text="${s.code}"></td>
                        <td th:text="${s.titleVi}"></td>
                        <td th:text="${s.difficulty}"></td>
                        <td><a th:href="@{'/admin/scenarios/' + ${s.id}}">Chi tiết</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="panel">
            <h3>Tạo / cập nhật kịch bản</h3>
            <form class="admin-form" th:action="@{/admin/scenarios}" method="post">
                <div class="form-group">
                    <label>Chủ đề</label>
                    <select class="form-control" name="categoryId" required>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.titleVi}"></option>
                    </select>
                </div>
                <div class="row">
                    <div class="form-group"><label>Mã</label><input class="form-control" name="code" required /></div>
                    <div class="form-group"><label>Độ khó</label>
                        <select class="form-control" name="difficulty">
                            <option>N5</option>
                            <option>N4</option>
                            <option>N3</option>
                            <option>N2</option>
                            <option>N1</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="form-group"><label>Tên tiếng Việt</label><input class="form-control" name="titleVi"
                            required /></div>
                    <div class="form-group"><label>Tên tiếng Nhật</label><input class="form-control" name="titleJa"
                            required /></div>
                </div>
                <div class="row">
                    <div class="form-group"><label>Vai trò AI</label><input class="form-control" name="aiRole" required />
                    </div>
                    <div class="form-group"><label>Vai trò người dùng</label><input class="form-control" name="userRole"
                            required /></div>
                </div>
                <div class="form-group"><label>Tóm tắt nhiệm vụ</label><textarea class="form-control"
                        name="missionSummary" rows="2" required></textarea></div>
                <div class="form-group"><label>Mô tả</label><textarea class="form-control" name="description"
                        rows="2"></textarea></div>
                <div class="form-group"><label>Số phút ước tính</label><input class="form-control" type="number"
                        name="estimatedMinutes" value="5" /></div>
                <button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Lưu</button>
            </form>
        </div>
    </section>
    </main>
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/jlab-base-shell.js}"></script>
</body>

</html>
