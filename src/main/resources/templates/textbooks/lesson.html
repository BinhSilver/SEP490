<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: standard('Bài học - JLAS', 'textbooks')}"></head>

<body id="jlabBasePage" class="app-body page-textbooks page-lesson">

    <div id="jlabBaseShellMount"></div>

    <!-- Giao diện mới trang học bài: class lesson-page bật bộ component mới trong textbook-lesson.js + css/pages/lesson-page.css.
         path-lesson.html (lộ trình) dùng chung JS nhưng không có class này nên giữ giao diện cũ. -->
    <link rel="stylesheet" th:href="@{/css/pages/lesson-page.css(v=20261019lt)}" />

    <main id="jlabBaseContent" class="app-main textbooks-main lesson-page" data-inline-dictionary
          th:attr="data-textbook-id=${textbookId}, data-lesson-id=${lessonId}">
        <nav class="textbooks-breadcrumb" aria-label="Breadcrumb">
            <a th:href="@{/textbooks}"><i class="fa-solid fa-book" aria-hidden="true"></i> Giáo trình</a>
            <span aria-hidden="true">/</span>
            <a id="breadcrumbTextbook" th:href="@{/textbooks/{id}(id=${textbookId})}">Danh sách bài</a>
            <span aria-hidden="true">/</span>
            <span id="breadcrumbLesson">…</span>
        </nav>

        <header class="lp-hero" id="lessonHeader" hidden>
            <div class="lp-hero__body">
                <p class="lp-hero__eyebrow" id="lessonUnit"></p>
                <h1 class="lp-hero__title" id="lessonTitle"></h1>
                <p class="lp-hero__desc" id="lessonDesc" hidden></p>
                <div class="lp-hero__meta" id="lessonMeta"></div>
            </div>
            <span class="lp-hero__kanji" id="lessonKanjiDeco" lang="ja" aria-hidden="true"></span>
        </header>

        <div id="lessonLoading" class="textbooks-loading">
            <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
            <span>Đang tải nội dung bài học (từ vựng, ngữ pháp kèm câu ví dụ, hội thoại)…</span>
        </div>

        <div id="lessonError" class="alert alert--error" role="alert"></div>

        <section id="lessonContent" class="lesson-content" hidden>
            <!-- Tab rỗng tự ẩn theo dữ liệu (js/pages/textbook-lesson.js); tab đầu tiên còn lại được chọn -->
            <div class="lesson-tabs" role="tablist" aria-label="Nội dung bài học">
                <span class="lp-tabs__slider" aria-hidden="true"></span>
                <button type="button" class="lesson-tab" role="tab" data-tab="kana" aria-selected="false" hidden>
                    Bảng chữ <span class="lesson-tab__count" id="countKana">0</span>
                </button>
                <button type="button" class="lesson-tab" role="tab" data-tab="kanji" aria-selected="false">
                    Kanji <span class="lesson-tab__count" id="countKanji">0</span>
                </button>
                <button type="button" class="lesson-tab" role="tab" data-tab="vocab" aria-selected="false">
                    Từ vựng <span class="lesson-tab__count" id="countVocab">0</span>
                </button>
                <button type="button" class="lesson-tab" role="tab" data-tab="grammar" aria-selected="false">
                    Ngữ pháp <span class="lesson-tab__count" id="countGrammar">0</span>
                </button>
                <button type="button" class="lesson-tab" role="tab" data-tab="dialogue" aria-selected="false">
                    Hội thoại <span class="lesson-tab__count" id="countDialogue">0</span>
                </button>
                <!-- Bài đọc / bài nghe (content_item READING ngoài bảng chữ cái + LISTENING không phải lời thoại).
                     Đặt cuối để bài có từ vựng/ngữ pháp vẫn mở tab đó trước; tên tab do JS đặt theo dữ liệu. -->
                <button type="button" class="lesson-tab" role="tab" data-tab="reading" aria-selected="false">
                    <span id="labelReading">Bài đọc</span> <span class="lesson-tab__count" id="countReading">0</span>
                </button>
            </div>

            <div class="lesson-panel" id="panelKana" role="tabpanel" data-panel="kana" hidden></div>
            <div class="lesson-panel" id="panelKanji" role="tabpanel" data-panel="kanji" hidden>
                <div id="kanjiList"></div>
                <!-- Ghi nguồn KANJIDIC2: nghĩa vụ CC BY-SA 4.0, đặt tại nơi dữ liệu được hiển thị -->
                <p class="lesson-attribution">
                    Dữ liệu Kanji: <a href="https://www.edrdg.org/wiki/index.php/KANJIDIC_Project" target="_blank" rel="noopener">KANJIDIC2</a>
                    &copy; <a href="https://www.edrdg.org/" target="_blank" rel="noopener">Electronic Dictionary Research and Development Group</a>,
                    giấy phép <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.
                </p>
            </div>
            <div class="lesson-panel" id="panelVocab" role="tabpanel" data-panel="vocab" hidden></div>
            <div class="lesson-panel" id="panelGrammar" role="tabpanel" data-panel="grammar" hidden></div>
            <div class="lesson-panel" id="panelDialogue" role="tabpanel" data-panel="dialogue" hidden></div>
            <div class="lesson-panel" id="panelReading" role="tabpanel" data-panel="reading" hidden></div>
        </section>
    </main>

    <script th:src="@{/js/jlab-base-shell.js}"></script>
    <script th:src="@{/js/pages/textbook-lesson.js(v=20261019lt)}"></script>

</body>

</html>
