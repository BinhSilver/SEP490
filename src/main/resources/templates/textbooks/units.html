<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: standard('Giáo trình - KotsuKotsu', 'textbooks')}"></head>

<body id="jlabBasePage" class="app-body page-textbooks">

    <div id="jlabBaseShellMount"></div>

    <main id="jlabBaseContent" class="app-main textbooks-main" th:attr="data-textbook-id=${textbookId}">
        <nav class="textbooks-breadcrumb" aria-label="Breadcrumb">
            <a th:href="@{/textbooks}"><i class="fa-solid fa-book" aria-hidden="true"></i> Giáo trình</a>
            <span aria-hidden="true">/</span>
            <span id="breadcrumbTextbook">…</span>
        </nav>

        <header class="textbooks-hero textbooks-hero--compact" id="textbookHeader" hidden>
            <p class="textbooks-hero__eyebrow" id="textbookLevel"></p>
            <h1 class="textbooks-hero__title" id="textbookTitle"></h1>
            <p class="textbooks-hero__subtitle" id="textbookDescription"></p>
            <div class="textbooks-hero__meta" id="textbookMeta"></div>
        </header>

        <div id="unitsLoading" class="textbooks-loading">
            <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
            <span>Đang tải danh sách bài học…</span>
        </div>

        <div id="unitsError" class="alert alert--error" role="alert"></div>

        <div id="unitsEmpty" class="textbooks-empty" hidden>
            <div th:replace="~{fragments/components/fox-mascot :: foxMascot}"></div>
            <strong>Giáo trình chưa có bài học nào được công bố</strong>
            <p>Nội dung đang được biên soạn. Vui lòng quay lại sau.</p>
        </div>

        <!-- Mỗi unit là một card, bên trong là danh sách bài; render bằng js/pages/textbook-units.js -->
        <div id="unitsList" class="units-list" hidden></div>
    </main>

    <dialog th:replace="~{textbooks/premium-dialog :: premiumDialog}"></dialog>

    <script th:src="@{/js/jlab-base-shell.js(v=20261125-icons-vi)}"></script>
    <script th:src="@{/js/pages/textbook-units.js}"></script>

</body>

</html>
