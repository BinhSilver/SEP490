<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin-head :: head('Quản lý nội dung - JLAS', 'textbooks')}"></head>

<body id="jlabBasePage" class="admin-portal page-textbooks">

    <div id="adminShellMount"></div>

    <main id="jlabBaseContent" class="app-main textbooks-main manage-main" hidden>
        <nav class="textbooks-breadcrumb" aria-label="Breadcrumb">
            <span><i class="fa-solid fa-book" aria-hidden="true"></i> Giáo trình</span>
            <span aria-hidden="true">/</span>
            <span>Quản lý nội dung</span>
        </nav>

        <header class="textbooks-hero textbooks-hero--compact">
            <p class="textbooks-hero__eyebrow">Biên soạn</p>
            <h1 class="textbooks-hero__title">Quản lý nội dung</h1>
            <p class="textbooks-hero__subtitle">
                Giáo trình, phần và bài học. Mục đã lưu trữ không hiện với học viên nhưng vẫn giữ nguyên
                dữ liệu và tiến độ đã học.
            </p>
        </header>

        <!-- Thanh công cụ: lọc mục đã lưu trữ + thêm giáo trình -->
        <div class="manage-toolbar">
            <label class="manage-filter">
                <input type="checkbox" id="showArchived">
                <span>Hiện mục đã lưu trữ</span>
            </label>
            <button type="button" class="manage-btn manage-btn--primary" id="addTextbookBtn">
                <i class="fa-solid fa-plus" aria-hidden="true"></i> Thêm giáo trình
            </button>
        </div>

        <div id="manageLoading" class="textbooks-loading">
            <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
            <span>Đang tải cây nội dung…</span>
        </div>

        <div id="manageError" class="alert alert--error" role="alert"></div>

        <div id="manageEmpty" class="textbooks-empty" hidden>
            <div th:replace="~{fragments/components/fox-mascot :: foxMascot}"></div>
            <strong>Chưa có giáo trình nào</strong>
            <p>Bấm “Thêm giáo trình” để bắt đầu biên soạn.</p>
        </div>

        <!-- Cây 3 cấp: giáo trình → phần → bài; render bằng js/pages/textbook-manage.js -->
        <div id="manageTree" class="manage-tree" hidden></div>
    </main>

    <!-- Form dùng chung cho cả 4 loại (giáo trình / phần / bài / điểm kiến thức); JS đổi nội dung theo ngữ cảnh -->
    <div class="manage-modal" id="manageModal" hidden>
        <div class="manage-modal__backdrop" data-close="1"></div>
        <div class="manage-modal__panel" role="dialog" aria-modal="true" aria-labelledby="manageModalTitle">
            <h2 class="manage-modal__title" id="manageModalTitle">…</h2>
            <form id="manageForm" class="manage-form" novalidate>
                <div id="manageFormFields"></div>
                <p class="manage-form__error" id="manageFormError" hidden></p>
                <div class="manage-form__actions">
                    <button type="button" class="manage-btn" data-close="1">Huỷ</button>
                    <button type="submit" class="manage-btn manage-btn--primary" id="manageSubmitBtn">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/components/toast :: toast-host}"></div>

    <script th:src="@{/js/pages/admin-core.js}"></script>
    <script th:src="@{/js/admin-shell.js(v=20261024-navscroll)}"></script>
    <script th:src="@{/js/pages/textbook-manage.js(v=20261013portal)}"></script>

</body>

</html>
