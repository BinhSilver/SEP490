<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<body>
<!-- Hộp thoại "cần Premium" dùng chung cho các trang Giáo trình (index, units, lesson).
     JS mở bằng document.getElementById('tbPremiumDialog').showModal(); luật khóa nằm ở TextbookAccessPolicy (backend). -->
<dialog th:fragment="premiumDialog" id="tbPremiumDialog" class="tb-premium-dialog" aria-labelledby="tbPremiumTitle">
    <form method="dialog" class="tb-premium-dialog__box">
        <span class="tb-premium-dialog__icon" aria-hidden="true"><i class="fa-solid fa-lock"></i></span>
        <h2 id="tbPremiumTitle" class="tb-premium-dialog__title">Nâng cấp Premium để mở toàn bộ giáo trình</h2>
        <p class="tb-premium-dialog__text">
            Tài khoản miễn phí học được phần Nhập môn (Bảng chữ cái) và các giáo trình N5.
            Premium mở thêm giáo trình N4–N1 và giáo trình theo chủ đề.
        </p>
        <div class="tb-premium-dialog__actions">
            <a class="button-primary" th:href="@{/premium}"><i class="fa-solid fa-crown" aria-hidden="true"></i> Nâng cấp Premium</a>
            <button type="submit" class="button-secondary" value="close">Để sau</button>
        </div>
    </form>
</dialog>
</body>
</html>
