<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<!-- [JLAS2-17] Cổng quản trị (giống manage.html): admin-head + #adminShellMount; main hiện khi AdminShell xác nhận quyền. -->
<head th:replace="~{fragments/admin-head :: head('Thêm bài học - JLAS', 'textbooks')}"></head>

<body id="jlabBasePage" class="admin-portal page-textbooks">

    <div id="adminShellMount"></div>

    <!-- [JLAS2-17] Trang thêm bài học 3 bước (thay modal "Thêm bài học"). Style: css/pages/admin-create.css
         (scope .admin-create-page); logic: js/pages/admin-create.js. API: các API modal cũ (tạo bài, tạo điểm
         kiến thức, tải file mẫu, nhập Excel; tạo phần khi giáo trình chưa có phần nào). -->
    <link rel="stylesheet" th:href="@{/css/pages/admin-create.css(v=20261017ap)}" />

    <main id="jlabBaseContent" class="app-main textbooks-main admin-create-page" hidden data-create="lesson"
          th:attr="data-textbook-id=${textbookId}, data-unit-id=${unitId}">
        <nav class="textbooks-breadcrumb" aria-label="Breadcrumb" id="acBreadcrumb">
            <a th:href="@{/textbooks/manage}"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Quản lý nội dung</a>
            <span aria-hidden="true">/</span>
            <span id="acCrumbTextbook">…</span>
            <span aria-hidden="true" id="acCrumbUnitSep" hidden>/</span>
            <span id="acCrumbUnit" hidden></span>
        </nav>

        <header class="ac-head">
            <h1 class="ac-head__title">Thêm bài học</h1>
            <p class="ac-head__desc">Ba bước ngắn: thông tin, phân loại, nội dung. Bài mới được lưu ở trạng thái Nháp.</p>
        </header>

        <div class="ac-denied" id="acDenied" role="alert" hidden>
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            Chỉ tài khoản người biên soạn nội dung (CONTENT_CREATOR) mới thêm được bài học.
        </div>

        <div id="acRoot"></div>
    </main>

    <div th:replace="~{fragments/components/toast :: toast-host}"></div>

    <script th:src="@{/js/pages/admin-core.js(v=20261107-creator-nav)}"></script>
    <script th:src="@{/js/admin-shell.js(v=20261107-theme)}"></script>
    <script th:src="@{/js/pages/admin-create.js(v=20261017ap)}"></script>

</body>

</html>
