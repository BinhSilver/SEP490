<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-head :: head('Trang quản trị | JLAS', 'admin')}"></head>
<body data-mobile-adapt="owned" id="jlabBasePage" class="page-admin admin-portal">
<link rel="stylesheet" th:if="${section == 'game-effects'}" th:href="@{/css/pages/game-effects.css}"/>
<link rel="stylesheet" th:if="${section == 'game-skins' or section == 'avatar-frames'}" th:href="@{/css/pages/admin-game-skins.css(v='20261024-nostats')}"/>
<link rel="stylesheet" th:if="${section == 'avatar-frames'}" th:href="@{/css/components/avatar-frame.css(v='20261021-catalog')}"/>
<link rel="stylesheet" th:if="${section == 'avatar-frames'}" th:href="@{/css/pages/admin-avatar-frames.css(v='20261022-gallery')}"/>
<link rel="stylesheet" th:if="${section == 'system-dashboard'}" th:href="@{/css/pages/admin-dashboard-stitch.css(v='20261025-live')}"/>
<link rel="stylesheet" href="/css/owned-mobile.css?v=20261009-compact-2">
<div id="adminShellMount"></div>

<main id="jlabBaseContent" hidden>
    <div class="adm-layout" id="admRoot" th:attr="data-section=${section}">
        <section class="adm-main" aria-live="polite">
            <header class="adm-header">
                <h1 class="adm-title" id="admTitle">Trang quản trị</h1>
                <p class="adm-subtitle" id="admSubtitle" hidden></p>
            </header>
            <div id="admContent">
                <div class="adm-empty"><span class="adm-spinner" aria-hidden="true"></span><span>Đang tải…</span></div>
            </div>
        </section>
    </div>
</main>

<script th:src="@{/js/pages/admin-core.js(v=20261024-filters)}"></script>
<script th:src="@{/js/admin-shell.js(v=20261024-navscroll)}"></script>
<script th:src="@{/js/pages/admin-moderation-review.js(v=20261024-collapse)}"></script>
<script th:src="@{/js/pages/admin-moderation-tools.js(v=20261024-collapse)}"></script>
<script th:src="@{/js/pages/admin-system.js(v=20261025-audit)}"></script>
<script th:src="@{/js/pages/admin-game-effects.js(v=20261024-filters)}"></script>
<script th:if="${section == 'game-skins'}" th:src="@{/arena/js/character-skin-preview.js(v='20261022-fix')}"></script>
<script th:if="${section == 'game-skins'}" th:src="@{/js/pages/admin-game-skins.js(v=20261024-nostats)}"></script>
<script th:if="${section == 'avatar-frames'}" th:src="@{/js/components/avatar-frame.js(v='20261021-catalog')}"></script>
<script th:if="${section == 'avatar-frames'}" th:src="@{/js/pages/admin-avatar-frames.js(v='20261024-nostats')}"></script>
<script th:src="@{/js/pages/admin-boot.js(v=20261013portal)}"></script>
</body>
</html>
