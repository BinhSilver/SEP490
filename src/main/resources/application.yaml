spring:
  application:
    name: jlas

  # ── Datasource ──────────────────────────────────────────────────────────────
  datasource:
    # url, username and password live in ignored application-local.yaml.
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: JlasHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # chỉ validate schema, KHÔNG tạo/sửa bảng
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 50
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # ── Profiles ────────────────────────────────────────────────────────────────
  profiles:
    default: local                # dùng local khi không có profile nào được chọn rõ ràng

  jackson:
    default-property-inclusion: non_null

  # Static: links rendered through Thymeleaf @{} under /css and /js get a content hash in the URL
  # (base-<md5>.css) and are cached for a year by StaticAssetCacheFilter. Every other static URL is
  # revalidated (304 when unchanged), so a plain href or an ES-module import never serves a stale file.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**

  # Giới hạn chung cho multipart, đủ cho video Shadowing tải lên (tối đa 20 phút, xem video.max.duration).
  # Từng tính năng vẫn tự kiểm giới hạn riêng (ảnh bài đọc 5MB, avatar/thumbnail giáo trình 2MB, gói skin 25MB).
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:500MB}
      # Lớn hơn max-file-size một chút cho phần đầu multipart và các trường đi kèm (tiêu đề, ảnh bìa).
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:510MB}

# ── Server ───────────────────────────────────────────────────────────────────
server:
  port: 8080
  forward-headers-strategy: none
  # Spring serves .js as text/javascript, so it must be listed next to application/javascript.
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,text/plain,text/xml,application/xml,image/svg+xml

game:
  voice:
    enabled: ${GAME_VOICE_ENABLED:false}
    url: ${GAME_VOICE_URL:}
    api-key: ${GAME_VOICE_API_KEY:}
    api-secret: ${GAME_VOICE_API_SECRET:}
    allowed-origins: ${GAME_VOICE_ALLOWED_ORIGINS:}
    token-ttl-seconds: ${GAME_VOICE_TOKEN_TTL_SECONDS:60}
    tokens-per-minute: ${GAME_VOICE_TOKENS_PER_MINUTE:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM:${spring.mail.username:no-reply@localhost}}

upload:
  path:
    avatar: ${AVATAR_UPLOAD_PATH:uploads/avatar}
    flashcard: ${FLASHCARD_UPLOAD_PATH:uploads/flashcard}
    video: ${VIDEO_UPLOAD_PATH:uploads/video/}
    audio: ${AUDIO_UPLOAD_PATH:uploads/audio/}
    thumbnail: ${THUMBNAIL_UPLOAD_PATH:uploads/thumbnails/}
    # Ảnh thumbnail giáo trình (khác thumbnail video shadowing ở trên). Phục vụ tại /uploads/textbook-thumbnails/**.
    textbook-thumbnail: ${TEXTBOOK_THUMBNAIL_UPLOAD_PATH:uploads/textbook-thumbnails}
    # [JLAS2-17] Ảnh đoạn đọc do người biên soạn tải lên (≤ 5MB). Phục vụ tại /uploads/reading-images/**.
    # Ảnh gốc của seed vẫn nằm trong content.audio.path và KHÔNG bao giờ bị ghi/xoá bởi tính năng này.
    reading-image: ${READING_IMAGE_UPLOAD_PATH:uploads/reading-images}

# Audio giáo trình số hoá (content_audio.audio_url là đường dẫn tương đối trong thư mục này).
# Khác với upload.path.audio (audio người dùng tải lên). Phục vụ tại /uploads/content-audio/**.
# Mặc định là data/content-audio/ (tính từ thư mục gốc project). Thư mục này không nằm trong git: tải gói audio
# trên Google Drive của nhóm rồi giải nén vào đó, không cần khai báo CONTENT_AUDIO_PATH.
content:
  audio:
    path: ${CONTENT_AUDIO_PATH:data/content-audio/}

ffmpeg:
  bin:
    path: ${FFMPEG_BIN_PATH:ffmpeg}
  audio:
    bitrate: ${FFMPEG_AUDIO_BITRATE:32k}

yt-dlp:
  bin:
    path: ${YT_DLP_BIN_PATH:yt-dlp}
  python:
    path: ${YT_DLP_PYTHON_PATH:}
  js-runtime: ${YT_DLP_JS_RUNTIME:}
  # cookies.txt of a signed-in YouTube account, for servers YouTube asks to "confirm you're not a bot".
  cookies-file: ${YT_DLP_COOKIES_FILE:}
  download:
    helper-path: ${YT_DLP_DOWNLOAD_HELPER_PATH:}

youtube:
  max:
    duration:
      no-subtitle:
        # 0 = không giới hạn: video không phụ đề tính phút hạn mức gấp 3 (Deepgram), người dùng trả theo phút.
        seconds: ${YOUTUBE_MAX_NO_SUBTITLE_SECONDS:0}
  subtitle:
    # Drop anime opening/ending song lyrics found from [音楽] blocks in YouTube auto captions.
    skip-theme-songs:
      enabled: ${YOUTUBE_SUBTITLE_SKIP_THEME_SONGS:true}
    quality:
      enabled: ${YOUTUBE_SUBTITLE_QUALITY_ENABLED:true}
      max-duration-seconds: ${YOUTUBE_SUBTITLE_QUALITY_MAX_DURATION_SECONDS:300}
      minimum-match-score: ${YOUTUBE_SUBTITLE_QUALITY_MINIMUM_MATCH_SCORE:0.82}
      time-overlap-padding-seconds: ${YOUTUBE_SUBTITLE_QUALITY_TIME_OVERLAP_PADDING_SECONDS:0.30}

deepgram:
  api:
    key: ${DEEPGRAM_API_KEY:}
  upload:
    max-retries: ${DEEPGRAM_MAX_RETRIES:5}
    delay-between-ms: ${DEEPGRAM_RETRY_DELAY_MS:2000}
    split:
      min-seconds: ${DEEPGRAM_SPLIT_MIN_SECONDS:60}
  http:
    connect-timeout-ms: ${DEEPGRAM_CONNECT_TIMEOUT_MS:60000}
    read-timeout-ms: ${DEEPGRAM_READ_TIMEOUT_MS:600000}

openrouter:
  api:
    key: ${OPENROUTER_API_KEY:}
    url: ${OPENROUTER_API_URL:https://openrouter.ai/api/v1}
  site:
    url: ${OPENROUTER_SITE_URL:http://localhost:8080}
    name: ${OPENROUTER_SITE_NAME:JLAS}
  model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
  # AI Call turns: reasoning effort (none/minimal/low/...; off = no reasoning parameter) and provider sort.
  reasoning-effort: ${OPENROUTER_REASONING_EFFORT:low}
  provider-sort: ${OPENROUTER_PROVIDER_SORT:}
  shadowing:
    model: ${OPENROUTER_SHADOWING_MODEL:${openrouter.model}}
    max-tokens: ${OPENROUTER_SHADOWING_MAX_TOKENS:8192}
    exercise:
      model: ${OPENROUTER_SHADOWING_EXERCISE_MODEL:${openrouter.shadowing.model}}
  temperature: ${OPENROUTER_TEMPERATURE:0}
  top-p: ${OPENROUTER_TOP_P:0.9}

# ── Gemini (cá nhân hoá learning path) ──────────────────────────────────────
# Key nằm trong application-local.yaml dưới tên `gemini-api-key` (hoặc env GEMINI_API_KEY);
# không khai báo ở đây để tránh ghi đè key thật bằng chuỗi rỗng.
gemini:
  api:
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
  model: ${GEMINI_MODEL:gemini-3.8-flash}
  temperature: ${GEMINI_TEMPERATURE:0}
  max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:4096}
  json:
    max-retries: ${GEMINI_JSON_MAX_RETRIES:2}

# AI Call (kaiwa): Fish Audio TTS, runtime phiên hội thoại và hạn mức (JLAS-W0199 / W0205).
fish:
  audio:
    api:
      key: ${FISH_AUDIO_API_KEY:}
      url: ${FISH_AUDIO_API_URL:https://api.fish.audio}
    model: ${FISH_AUDIO_MODEL:s2.1-pro-free}
    voice:
      female: ${FISH_AUDIO_VOICE_FEMALE:}
      male: ${FISH_AUDIO_VOICE_MALE:}

aicall:
  runtime:
    ttl-minutes: ${AICALL_RUNTIME_TTL_MINUTES:120}
    max-sessions: ${AICALL_RUNTIME_MAX_SESSIONS:10000}
  # Kế hoạch Pro/CP (doc-huy/ke-hoach-kinh-doanh-pro-cp-huy.md, mục 2): 1 lượt = 0,2 phút, hết hạn mức 10 CP/lượt.
  # Trần tháng giữ chi phí AI tối đa không quá nửa giá gói. premium-monthly-minutes = 0 là không giới hạn.
  quota:
    free-daily-minutes: ${AICALL_FREE_DAILY_MINUTES:3}
    free-monthly-minutes: ${AICALL_FREE_MONTHLY_MINUTES:15}
    premium-daily-minutes: ${AICALL_PREMIUM_DAILY_MINUTES:10}
    premium-monthly-minutes: ${AICALL_PREMIUM_MONTHLY_MINUTES:40}
    minutes-per-turn: ${AICALL_MINUTES_PER_TURN:0.2}
    credit-per-turn: ${AICALL_CREDIT_PER_TURN:10}
  # Giới hạn một lượt (kế hoạch mục 2): tin nhắn N ký tự, nói vào micro tối đa vài giây, giọng đọc K ký tự mỗi câu.
  # Câu trả lời của AI tối đa 900 token (M, trong OpenRouterClient).
  turn-limits:
    message-max-chars: ${AICALL_MESSAGE_MAX_CHARS:150}
    voice-max-seconds: ${AICALL_VOICE_MAX_SECONDS:30}
    tts-max-chars: ${AICALL_TTS_MAX_CHARS:200}

# API key OpenRouter riêng cho từng tính năng (tên trong com.jlas.common.ai.AiFeature), để dashboard OpenRouter tách
# chi phí theo key. Để trống thì tính năng dùng key chung openrouter.api.key. Ví dụ env:
#   OPENROUTER_FEATURE_KEYS_AI_CALL_REPLY, OPENROUTER_FEATURE_KEYS_SHADOWING_SUBTITLES, OPENROUTER_FEATURE_KEYS_JLPT_EXPLAIN
# Dù có key riêng hay không, mỗi lần gọi đều được ghi vào ai_usage_log theo tên tính năng (trang admin "Chi phí AI").

# Bảng giá nhà cung cấp để quy chi phí AI ra tiền ở báo cáo admin (kế hoạch mục 2, bước "Quy ra tiền").
# OpenRouter tự trả chi phí USD mỗi lần gọi; Fish Audio và Azure thì tính ở đây. Sửa khi nhà cung cấp đổi giá.
ai-pricing:
  usd-to-vnd: ${AI_PRICING_USD_TO_VND:26000}
  # s2.1-pro-free: 0; bản trả phí s2.1-pro: 15
  fish-audio-usd-per-million-bytes: ${AI_PRICING_FISH_AUDIO_USD_PER_MILLION_BYTES:0}
  azure-pronunciation-usd-per-hour: ${AI_PRICING_AZURE_PRONUNCIATION_USD_PER_HOUR:1.32}
  # Hệ số trong công thức giá CP: làm tròn lên bội số của 5 (chi phí P90 × hệ số ÷ giá 1 CP)
  markup: ${AI_PRICING_MARKUP:3}
  vnd-per-credit: ${AI_PRICING_VND_PER_CREDIT:100}

azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container: ${AZURE_STORAGE_CONTAINER:jlas-media}
    audio-container: ${AZURE_STORAGE_AUDIO_CONTAINER:audio}
  speech:
    pronunciation:
      key: ${AZURE_SPEECH_PRONUNCIATION_KEY:}
      region: ${AZURE_SPEECH_PRONUNCIATION_REGION:}
      locale: ${AZURE_SPEECH_PRONUNCIATION_LOCALE:ja-JP}
      max-audio-bytes: ${AZURE_SPEECH_MAX_AUDIO_BYTES:5242880}
      max-audio-seconds: ${AZURE_SPEECH_MAX_AUDIO_SECONDS:30}
      requests-per-minute: ${AZURE_SPEECH_REQUESTS_PER_MINUTE:20}
    tts:
      key: ${AZURE_SPEECH_TTS_KEY:${azure.speech.pronunciation.key}}
      region: ${AZURE_SPEECH_TTS_REGION:${azure.speech.pronunciation.region}}
      voice: ${AZURE_SPEECH_TTS_VOICE:ja-JP-NanamiNeural}
      output-format: ${AZURE_SPEECH_TTS_OUTPUT_FORMAT:audio-24khz-48kbitrate-mono-mp3}

dictionary:
  tts:
    cache-dir: ${DICTIONARY_TTS_CACHE_DIR:uploads/tts-cache}
    max-chars: ${DICTIONARY_TTS_MAX_CHARS:200}
    requests-per-minute: ${DICTIONARY_TTS_REQUESTS_PER_MINUTE:30}

pronunciation:
  storage:
    provider: ${PRONUNCIATION_STORAGE_PROVIDER:local}
    local:
      root: ${PRONUNCIATION_STORAGE_ROOT:storage/pronunciation}

# File tải lên tạo bài Shadowing: tối đa 20 phút (giới hạn phần cứng: dung lượng, ffmpeg). Link YouTube không giới hạn.
video:
  max:
    duration:
      seconds: ${VIDEO_MAX_DURATION_SECONDS:1200}

processing:
  ai:
    max:
      duration:
        seconds: ${PROCESSING_AI_MAX_DURATION_SECONDS:1200}
    batch:
      size: ${PROCESSING_AI_BATCH_SIZE:6}
    parallelism: ${PROCESSING_AI_PARALLELISM:3}
    json:
      max-retries: ${PROCESSING_AI_JSON_MAX_RETRIES:2}

shadowing:
  practice:
    ai:
      max-subtitles-per-session: ${SHADOWING_PRACTICE_AI_MAX_SUBTITLES:120}

# [JLAS2-37] Community Hub: so bao cao OPEN de tu dong tam an noi dung/binh luan (moderator xu ly o /admin/moderation/reports).
community:
  report:
    # Số người khác nhau báo cáo (OPEN) để tự ẩn chờ kiểm duyệt; 3 giống ngưỡng ẩn video của Shadowing.
    content-hide-threshold: ${COMMUNITY_REPORT_CONTENT_HIDE_THRESHOLD:3}
    comment-hide-threshold: ${COMMUNITY_REPORT_COMMENT_HIDE_THRESHOLD:3}

moderation:
  avatar:
    storage: ${MODERATION_AVATAR_STORAGE:storage/moderation/avatar}
  appeal:
    storage: ${MODERATION_APPEAL_STORAGE:storage/moderation/appeals}
  enabled: ${MODERATION_ENABLED:true}
  image:
    enabled: ${MODERATION_IMAGE_ENABLED:true}
    model: ${MODERATION_IMAGE_MODEL:}
    fallback-model: ${MODERATION_IMAGE_FALLBACK_MODEL:}
    timeout-ms: ${MODERATION_IMAGE_TIMEOUT_MS:45000}
    max-tokens: ${MODERATION_IMAGE_MAX_TOKENS:256}
  video:
    enabled: ${MODERATION_VIDEO_ENABLED:true}
    quick-scan: ${MODERATION_VIDEO_QUICK_SCAN:true}
    targeted-scan: ${MODERATION_VIDEO_TARGETED_SCAN:true}
    frame-max-width: ${MODERATION_VIDEO_FRAME_MAX_WIDTH:768}
    temp-dir: ${MODERATION_VIDEO_TEMP_DIR:uploads/moderation-frames/}
  rate-limit:
    comment-per-minute: ${MODERATION_COMMENT_PER_MINUTE:30}
    image-per-hour: ${MODERATION_IMAGE_PER_HOUR:40}
    publish-per-hour: ${MODERATION_PUBLISH_PER_HOUR:20}

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.jlas: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

# [JLAS-W0193] Off until all V2 activity pages are released.
learning:
  # [JLAS-W0108] Lộ trình giao tiếp (BA, Du lịch, Đời sống; owner 07/11: bật mặc định). Cần bảng cpath_* của
  # sql/learning/learning_schema.sql và dữ liệu sql/learning/learning_data.sql.
  comm-path:
    enabled: ${LEARNING_COMM_PATH_ENABLED:true}
  interactive-v2:
    enabled: ${LEARNING_INTERACTIVE_V2_ENABLED:false}
    # [JLAS-W0108] Spec §2.1 / OD-48 (owner 2026-10-20): refuse a new JLPT path whose stage lacks a required skill
    # (Vocabulary, Kanji, Grammar, Reading, Listening). REPORT only records the gaps; existing paths are untouched.
    readiness-gate: ${LEARNING_READINESS_GATE:ENFORCE}
  # [JLAS-W0193] RC Task 7 — no real Mock Test owner contract exists in this codebase, so destination-url
  # stays empty (BLOCKED_INTEGRATION) by default. If a real contract ever ships, set destination-url plus
  # approved-origins here (or via env) — ConfiguredMockTestDestinationProvider still rejects anything that
  # is not an internal relative route or an origin on this exact list; never accept an unapproved URL.
  mock-test:
    # Owner decision 2026-10-06 (option A): the JLPT module from develop is a self-assessment link, not a gate.
    destination-url: ${LEARNING_MOCK_TEST_DESTINATION_URL:/jlpt}
    approved-origins: ${LEARNING_MOCK_TEST_APPROVED_ORIGINS:}
  # [JLAS-W0108] Lộ trình JLPT theo chủ đề (owner 07/11: bật mặc định). Tắt = /learning về lộ trình cũ, không đụng dữ liệu cũ.
  jlpt-path:
    enabled: ${LEARNING_JLPT_PATH_ENABLED:true}
    # CHỈ dùng thử local (jlas_mirai): hiện cả mục DRAFT khi nội dung chưa qua bộ kiểm. Không bao giờ bật ở bản chính.
    preview-draft: ${LEARNING_JLPT_PATH_PREVIEW_DRAFT:false}
    force-released-levels: ${LEARNING_JLPT_PATH_FORCE_RELEASED:}
    audio-base-url: /uploads/content-audio/
    reminder:
      job-enabled: ${LEARNING_JLPT_PATH_REMINDER_JOB:true}
      email-enabled: ${LEARNING_JLPT_PATH_REMINDER_EMAIL:false}
      default-time: "20:00"
assessment:
  jlpt:
    # [JLAS-W0108] Mock Test policy versions whose attempt snapshots may complete a learning path.
    # Server-side only; empty = nothing qualifies. The Mock Test owner must write attempt.policy_version from this set.
    accepted-policy-versions: ${ASSESSMENT_JLPT_ACCEPTED_POLICY_VERSIONS:JLPT_PATH_GATE_V1}
