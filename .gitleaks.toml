title = "J-LAS secret detection"

[extend]
useDefault = true

[[allowlists]]
description = "Question-bank seed_key values identify content records"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)questionbank\.sql$''']
regexTarget = "match"
regexes = ['''^seed_key\\?"\s*:\s*\\?"''']

[[allowlists]]
description = "Demo seed \"key\" values are lowercase slugs naming comments and flashcard sets, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)data/shadowing/demo_engagement\.json$''', '''(^|/)data/flashcard/community_sets\.json$''']
regexTarget = "match"
regexes = ['''^key"\s*:\s*"[a-z0-9]+(-[a-z0-9]+)*"?$''']

[[allowlists]]
description = "Learning content gap codes passed next to a gapKey argument are UPPER_SNAKE_CASE constants"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)src/main/java/com/jlas/learning/service/impl/JpaInteractiveContentCatalog\.java$''']
regexTarget = "match"
regexes = ['''^gapKey\s*,\s*"[A-Z0-9_]+"?$''']

[[allowlists]]
description = "Learning-owned content seed_key values are UPPER-KEBAB record codes such as KANJI-DIVERSE-N4-003"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)data/learning-owned/learning-content\.json$''']
regexTarget = "match"
regexes = ['''^seed_key"\s*:\s*"[A-Z0-9]+(-[A-Z0-9]+)*"?$''']

[[allowlists]]
description = "The setup guide and local config example show a 'change me' placeholder in place of the JWT secret"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)docs/HUONG-DAN-CHAY-DU-AN\.md$''', '''(^|/)src/main/resources/application-local\.example\.yaml$''']
regexTarget = "match"
regexes = [''''doi-thanh-chuoi-ngau-nhien-it-nhat-32-ky-tu-cho-moi-may'?$''']
